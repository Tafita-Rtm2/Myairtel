<div class="container">
  <div class="container-icon" [routerLink]="event | hgEventLink">
    <hg-entrypoint-icon [entryPointId]="event.entryPointId"></hg-entrypoint-icon>
  </div>
  <div class="container-infos" [routerLink]="event | hgEventLink">
    <div class="container-infos-time">
      <span class="container-infos-displayId">{{ event.displayId }}</span>
      <span class="container-infos-expectedStart">{{ event.expectedStart | hgTime }}</span>
    </div>
    <div [ngSwitch]="event.eventType">
      <span class="container-infos-name">
        {{ 'VIRTUAL_GAMES.KIRONSPINANDWIN' | i18n }}
      </span>
      <span class="container-infos-name">{{ event.name }}</span>
    </div>
  </div>
  <div class="main-event-bet-type-items">
    <ng-container>
      <button
        class="button main-event-bet-type-item"
        [class.selected]="eventBetTypeItem.selected"
        *ngFor="let eventBetTypeItem of event.eventBetTypes[0].eventBetTypeItems"
        (click)="toggleBet(eventBetTypeItem)"
      >
        <div class="infos">
          <span>{{ eventBetTypeItem.shortName }}</span>
          <span class="odds">{{ eventBetTypeItem.odds }}</span>
        </div>
      </button>
    </ng-container>
  </div>
</div>
