<!-- eslint-disable @angular-eslint/template/eqeqeq -->
<ng-container *ngIf="selectionMode === SpinAndWinSelectionMode.Manual; else grid">
  <input type="number" [(ngModel)]="inputNumber" #input />
</ng-container>

<ng-template #grid>
  <div class="grid">
    <button
      *ngFor="let item of items; trackBy: trackByIndex"
      (click)="selectItem(item)"
      [class.opacity]="inputNumber && inputNumber !== item"
      type="button"
    >
      <hg-roulette-item [number]="item" [size]="RouletteItemSize.Small"></hg-roulette-item>
    </button>
  </div>

  <hr />
</ng-template>

<div class="neighbors" *ngIf="inputNumber != null">
  <div
    *ngFor="let c of spinAndWinSplit[inputNumber]"
    [class.not-selected]="selectedItems.indexOf(inputNumber + '_' + c) === -1"
  >
    <hg-roulette-item
      [number]="c"
      [size]="RouletteItemSize.Large"
      (click)="addOrRemoveItemToSelection(c)"
    ></hg-roulette-item>
    <i [ngClass]="selectedItems.indexOf(inputNumber + '_' + c) > -1 ? 'hg-checked' : 'hg-unchecked'"></i>
  </div>
</div>
