<div class="title" *ngIf="displayBetCategoryNameOnMobile">
  <i class="hg-virtualgames"></i>
  <h1>{{ 'NAV.VIRTUAL' | i18n }}</h1>
</div>

<hg-loader *ngIf="loading"></hg-loader>

<ng-container *ngIf="!loading && eventCategoryId !== gamesEnum.KironSpinAndWin">
  <div class="menu">
    <div *ngIf="displayEntryPointsMenu" class="entrypoints-menu">
      <ng-container *ngFor="let entrypoint of entryPointsFilter; let i = index">
        <div
          *ngIf="instantLeague.includes(entrypoint)"
          [class.active]="eventCategoryId === entrypoint"
          class="entrypoint"
          (click)="clickOnCategory(entrypoint)"
          [routerLink]="['/virtual/category/instant-league/' + entrypoint]"
        >
          <hg-entrypoint-icon [entryPointId]="entrypoint"></hg-entrypoint-icon>
        </div>
        <div
          *ngIf="insaLeague.includes(entrypoint)"
          [class.active]="eventCategoryId === entrypoint"
          class="entrypoint"
          (click)="clickOnCategory(entrypoint)"
          [routerLink]="['/virtual/category/instant-league/' + entrypoint]"
        >
          <hg-entrypoint-icon [entryPointId]="entrypoint"></hg-entrypoint-icon>
        </div>
        <div
          *ngIf="footballLeague.includes(entrypoint)"
          [class.active]="eventCategoryId === entrypoint"
          class="entrypoint"
          (click)="clickOnCategory(entrypoint)"
          [routerLink]="['/virtual/category/' + entrypoint]"
        >
          <hg-entrypoint-icon [entryPointId]="entrypoint"></hg-entrypoint-icon>
        </div>
        <div
          *ngIf="races.includes(entrypoint)"
          [class.active]="eventCategoryId === entrypoint"
          class="entrypoint"
          (click)="clickOnCategory(entrypoint)"
          [routerLink]="['/virtual/category/' + entrypoint]"
        >
          <span>
            <hg-entrypoint-icon [entryPointId]="8005"></hg-entrypoint-icon>
            <hg-entrypoint-icon [entryPointId]="8006"></hg-entrypoint-icon>
          </span>
        </div>
        <div
          *ngIf="games.includes(entrypoint)"
          [class.active]="eventCategoryId === entrypoint"
          class="entrypoint"
          (click)="clickOnCategory(entrypoint)"
          [routerLink]="['/virtual/category/' + entrypoint]"
        >
          <hg-entrypoint-icon [entryPointId]="entrypoint"></hg-entrypoint-icon>
        </div>
      </ng-container>
    </div>
    <div *ngIf="category" class="categories-menu" #categoriesMenu>
      <ng-container *ngFor="let entrypoint of entryPoints">
        <ng-container *ngIf="category[entrypoint.id]">
          <a
            id="Virtual_country_tab"
            [class.active]="eventCategoryId === category[entrypoint.id]"
            class="category"
            [routerLinkActive]="isServer ? '' : 'active'"
            [routerLink]="[
              '/virtual/category/' +
                (!!InstantLeagueEnum[entrypoint.id] || !!InsaLeagueEnum[entrypoint.id] ? 'instant-league/' : ''),
              entrypoint.id
            ]"
            (click)="onMenuClickAction()"
          >
            <ng-container
              *ngIf="
                InsaLeagueEnum[entrypoint.id] || InstantLeagueEnum[entrypoint.id] || footballLeagueEnum[entrypoint.id];
                else notLeagues
              "
            >
              <div [style.backgroundImage]="getCategoryIcon(entrypoint)"></div>
              <span [innerHtml]="categoryCountryName(entrypoint.name)"></span>
            </ng-container>
            <ng-template #notLeagues>
              <hg-entrypoint-icon [entryPointId]="entrypoint.id"></hg-entrypoint-icon>
              <span>{{ entrypoint.name }}</span>
            </ng-template>
          </a>
        </ng-container>
      </ng-container>
    </div>
  </div>
</ng-container>
