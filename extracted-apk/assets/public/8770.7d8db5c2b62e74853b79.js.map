<div class="race-header" *ngIf="race">
  <i class="hg-arrow-left" (click)="goBack()"></i>
  <a [routerLink]="race | hgEventLink">
    <hg-virtual-race
      [race]="race"
      [showEntrypoint]="true"
      [showEntryPointName]="true"
      [flatMode]="false"
      [isAboutToStart]="isAboutToStart"
    ></hg-virtual-race>
  </a>
</div>

<hg-virtual-event-result *ngIf="race" [event]="race"></hg-virtual-event-result>

<router-outlet></router-outlet>
