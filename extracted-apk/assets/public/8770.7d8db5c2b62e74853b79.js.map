<hg-loader *ngIf="isLoading"></hg-loader>

<div class="no-bets" *ngIf="!isLoading && isEventExpired">
  <i class="hg-cross"></i>
  {{ 'EVENT.VIRTUAL.NO_BETS' | i18n }}
</div>

<div
  class="event-bet-types-container"
  *ngIf="!!event && !isLoading && !isEventExpired"
  [class.center-wide]="eventCategoryId === 8022"
>
  <div class="item" *ngFor="let eventBetType of event.eventBetTypes" (click)="onEventBetTypeSelected(eventBetType)">
    <i
      [class]="
        eventBetType.betTypeId +
          (eventBetType.betTypeContext ? getContext(eventBetType.betTypeId, eventBetType.betTypeContext) : null)
          | hgVirtualBetTypeIcon
      "
    ></i>
    <span>{{ eventBetType.name }}</span>
  </div>
</div>
