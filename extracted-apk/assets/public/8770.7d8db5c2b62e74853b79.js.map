<div class="no-bets" *ngIf="event && event.eventType === EventType.Race && $any(event).result">
  <div class="results">
    <span class="title">{{ 'VIRTUAL.RESULTS' | i18n }} :</span>
    <div class="result-container">
      <span *ngFor="let item of $any(event).result" class="runner">{{ item }}</span>
    </div>
  </div>
</div>

<hg-event-summary [event]="$any(event)" *ngIf="event.eventType === EventType.Match"></hg-event-summary>
