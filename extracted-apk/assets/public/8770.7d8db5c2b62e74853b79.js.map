<div class="numbers-container">
  <hg-lucky-loot-item
    [color]="LuckyLootItemColor.Yellow"
    [allSelected]="true"
    (click)="addToBetSlip(LuckyLootItemColor.Yellow)"
  ></hg-lucky-loot-item>
  <hg-lucky-loot-item
    [color]="LuckyLootItemColor.Green"
    [allSelected]="true"
    (click)="addToBetSlip(LuckyLootItemColor.Green)"
  ></hg-lucky-loot-item>
  <hg-lucky-loot-item
    [color]="LuckyLootItemColor.Blue"
    [allSelected]="true"
    (click)="addToBetSlip(LuckyLootItemColor.Blue)"
  ></hg-lucky-loot-item>
  <hg-lucky-loot-item
    [color]="LuckyLootItemColor.Red"
    [allSelected]="true"
    (click)="addToBetSlip(LuckyLootItemColor.Red)"
  ></hg-lucky-loot-item>
</div>
