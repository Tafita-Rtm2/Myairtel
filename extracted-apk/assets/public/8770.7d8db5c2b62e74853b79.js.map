<ng-container *ngIf="!loading; else loader">
  <table *ngIf="teams && !error">
    <thead>
      <th></th>
      <th class="pts">
        <div>{{ 'VIRTUAL.POINTS' | i18n }}</div>
      </th>
      <th>
        <div>{{ 'VIRTUAL.HISTORY' | i18n }}</div>
      </th>
    </thead>

    <tbody>
      <tr *ngFor="let team of teams">
        <td>
          <div class="rank-name">
            <span>{{ team.position }}</span> <img [src]="team.name | hgVirtualTeamImageLink" alt="{{ team.name }}" />
            {{ team.name }}
          </div>
        </td>
        <td>
          <span class="points">{{ team.points }}</span>
        </td>
        <td>
          <ul>
            <li *ngFor="let matchStatus of team.history" [class.close]="matchStatus === MatchState.Lost">
              <img
                [src]="
                  'assets/virtual/' +
                  (matchStatus === MatchState.Draw
                    ? 'icon_match_nul.svg'
                    : matchStatus === MatchState.Won
                    ? 'icon_victoire.svg'
                    : 'icon_defaite.svg')
                "
                alt="Match state"
              />
            </li>
          </ul>
        </td>
      </tr>
    </tbody>
  </table>

  <p class="nodata" *ngIf="!loading && error">
    <img src="/assets/nodata.png" alt="nodata" />
    {{ 'BETSLIST.NO_EVENT' | i18n }}
  </p>
</ng-container>

<ng-template #loader>
  <div class="loader">
    <hg-loader></hg-loader>
  </div>
</ng-template>
