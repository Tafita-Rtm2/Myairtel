<hg-popup [hideClose]="true" [bottom]="true" [opened]="betSlipActive">
  <hg-bet-slip
    (close)="closeBetSlip()"
    [betValidatedTemplate]="betValidatedTemplate"
    [freeBalance]="me?.freeBalance"
    [balance]="me?.balance"
    [hideBalance]="me?.hideBalance"
  ></hg-bet-slip>
  <ng-template #betValidatedTemplate let-context="context" let-close="close">
    <hg-bet-validated [context]="context" (close)="close($event)"></hg-bet-validated>
  </ng-template>
</hg-popup>

<hg-bet-slip-icon
  id="Virtual_betslip"
  class="bet-slip"
  [class.opened]="betSlipActive"
  [class.odds-previewer-visible]="oddsPreviewerState"
  (click)="openBetSlip()"
></hg-bet-slip-icon>
<hg-anchor anchor="virtual-sidebar"></hg-anchor>
