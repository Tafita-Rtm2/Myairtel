<hg-three-columns-layout>
  <ng-container left>
    <hg-virtual-ui-desktop-event-categories-navigation
      *hgMediaIfNot="'md'; ssr: true"
      (navigated)="navigated($event)"
      (entryPointIndex)="entryPointIndex($event)"
    ></hg-virtual-ui-desktop-event-categories-navigation>
  </ng-container>

  <div class="center" center>
    <div class="banners" *ngIf="displayBanner">
      <hg-anchor anchor="banner-virtual"></hg-anchor>
    </div>

    <ng-container *hgMediaIf="'md'; ssr: true">
      <hg-virtual-mobile-event-categories-navigation
        *ngIf="scope === Scope.Customer"
        (entryPointIndex)="entryPointIndex($event)"
        [eventCategoryId]="eventCategoryId"
      ></hg-virtual-mobile-event-categories-navigation>
    </ng-container>

    <router-outlet *ngIf="!isServer; else placeholder" (activate)="onActivate($event)"></router-outlet>
    <ng-template #placeholder
      ><div class="placeholder">
        <hg-loader></hg-loader></div
    ></ng-template>

    <hg-virtual-font-loader></hg-virtual-font-loader>
  </div>

  <ng-container right>
    <hg-virtual-sidebar></hg-virtual-sidebar>
  </ng-container>
</hg-three-columns-layout>
