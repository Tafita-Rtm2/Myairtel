<hg-loader *ngIf="loading"></hg-loader>

<div *ngIf="!loading">
  <div class="events-block">
    <div
      *ngFor="let item of eventsWithEventBetTypes; let first = first; trackBy: trackEvent; let index = index"
      class="race-event"
      [@removed]="true"
    >
      <ng-container [ngSwitch]="item.eventType">
        <ng-container class="events">
          <hg-event-with-event-bet-type
            class="event"
            [showEntrypoint]="true"
            [showEntryPointName]="false"
            [isVirtual]="true"
            [eventBetType]="item.eventBetType"
            [isAboutToStart]="item.isAboutToStart"
            [showTimer]="item.isAboutToStart && first"
            [event]="item"
            [isStreamed]="first"
            (betSelectionChanged)="onBetSelectionChanged(item, $event)"
            *ngSwitchCase="EventType.Match"
          ></hg-event-with-event-bet-type>
        </ng-container>

        <div class="race" *ngSwitchCase="EventType.Race || EventType.VirtualRace">
          <hg-virtual-race
            [race]="item"
            [showEntrypoint]="true"
            [showEntryPointName]="false"
            [flatMode]="true"
            [isAboutToStart]="item.isAboutToStart"
            [showTimer]="item.isAboutToStart && first"
            (betSelectionChanged)="onBetSelectionChanged(item, $event)"
          ></hg-virtual-race>
        </div>
        <ng-container class="numbers-game" *ngSwitchCase="EventType.NumbersGame">
          <hg-spin-and-win-event-bet-types
            *ngIf="item.entryPointId === EntryPoint.SpinAndWin"
            [event]="item"
            (betSelectionChanged)="onBetSelectionChanged(item, $event)"
          >
          </hg-spin-and-win-event-bet-types>
        </ng-container>
      </ng-container>

      <hr
        *ngIf="
          eventsWithEventBetTypes[index] &&
          eventsWithEventBetTypes[index + 1] &&
          eventsWithEventBetTypes[index].expectedStart.getTime() !==
            eventsWithEventBetTypes[index + 1].expectedStart.getTime() &&
          (eventsWithEventBetTypes[index].entryPointId === 8019 ||
            eventsWithEventBetTypes[index].entryPointId === 8020 ||
            eventsWithEventBetTypes[index].entryPointId === 8021)
        "
      />
    </div>
  </div>

  <footer *ngIf="hasMore">
    <hg-loader *ngIf="loadingMore"></hg-loader>
    <span *ngIf="!loading && !loadingMore && hasMore" (click)="loadMoreEvents()">{{ 'SEARCH.SHOW_MORE' | i18n }}</span>
  </footer>

  <p class="nodata" *ngIf="!loading && (!eventsWithEventBetTypes || !eventsWithEventBetTypes.length)">
    <img src="/assets/nodata.png" alt="nodata" />
    {{ 'BETSLIST.NO_EVENT' | i18n }}
  </p>
</div>
