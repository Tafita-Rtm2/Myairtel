<ng-container *ngIf="match">
  <div class="match-header">
    <i class="hg-arrow-left" (click)="goBack()"></i>
    <hg-event
      [event]="match"
      [showEntryPointName]="true"
      [showDisplayId]="true"
      [isAboutToStart]="isAboutToStart"
    ></hg-event>
  </div>

  <div *ngIf="match.state === EventStateType.Finished || match.state === EventStateType.Settled">
    <hg-virtual-event-result [event]="match"></hg-virtual-event-result>
  </div>
</ng-container>

<ng-container *ngIf="!loading && !isEventExpired && match.streamConfiguration">
  <hg-video-player
    [streamConfig]="match.streamConfiguration"
    [shouldBeOpenedByDefault]="videoPlayerShouldBeOpenedByDefault"
  ></hg-video-player>
</ng-container>

<hg-loader *ngIf="loading"></hg-loader>

<div class="groups" *ngIf="!loading && !isEventExpired">
  <div class="group" *ngFor="let bt of eventBetTypesGroupedByBetType; trackBy: trackEventBetType">
    <div class="bet-type">
      <hg-bet-type-infos-icon *ngIf="bt.hasExplanations" [betTypeId]="bt.betTypeId"></hg-bet-type-infos-icon>
      {{ bt.groupName }}
    </div>

    <div class="bet-type-items">
      <div class="bet-type-items-group" *ngFor="let ebt of bt.eventBetTypes; let last = last">
        <ng-container *ngFor="let item of ebt.eventBetTypeItems; trackBy: trackEventBetTypeItem">
          <hg-event-bet-type-item
            [ngClass]="'bet-type-' + bt.betTypeId"
            [selected]="item.selected"
            [disabled]="!ebt.bettingAllowed || !item.bettingAllowed"
            [inactive]="!ebt.active || !item.active"
            [eventBetTypeItem]="item"
            (click)="toggleBet(ebt, item)"
          ></hg-event-bet-type-item>
        </ng-container>
        <hr *ngIf="!last" />
      </div>
    </div>
  </div>
</div>
