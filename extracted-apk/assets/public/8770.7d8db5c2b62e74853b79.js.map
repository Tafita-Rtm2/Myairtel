<div class="informations" *ngIf="eventCategory && !loading">
  <div class="title">
    <hg-entrypoint-icon [entryPointId]="eventCategory.id"></hg-entrypoint-icon>
    <span>{{ eventCategory.name }}</span>
  </div>

  <div class="tab-picker" [class.last-nav]="rlRef.isActive">
    <div id="Virtual_results" routerLinkActive="active" [routerLink]="['results']">
      {{ 'VIRTUAL.RESULTS' | i18n }}
    </div>
    <div id="Virtual_matches" routerLinkActive="active" [routerLink]="['matches']">
      {{ 'VIRTUAL.MATCHES' | i18n }}
    </div>
    <div id="Virtual_ranking" routerLinkActive="active" [routerLink]="['ranking']" #rlRef="routerLinkActive">
      {{ 'VIRTUAL.RANKING' | i18n }}
    </div>
  </div>
</div>

<div class="virtual-page-wrapper">
  <router-outlet></router-outlet>
</div>
