<div *ngIf="scope !== Scope.Customer || (scope === Scope.Customer && currentIndex)" class="entrypoints">
  <a
    class="item"
    *ngIf="scope === Scope.Agent"
    routerLink="/virtual"
    [routerLinkActive]="isServer ? '' : 'is-active'"
    [routerLinkActiveOptions]="{ exact: true }"
    (click)="toggleMenuEvent.emit()"
  >
    <i class="hg-virtualgames"></i>
    <span>{{ 'MENU.ALL_VIRTUALS' | i18n }}</span>
    <i class="hg-full-right-arrow"></i>
  </a>
  <a
    class="item"
    *ngIf="scope === Scope.Agent"
    [routerLinkActive]="isServer ? '' : 'is-active'"
    [routerLink]="['/virtual/results']"
    (click)="toggleMenuEvent.emit()"
  >
    <i class="hg-result"></i>
    <span>{{ 'MENU.RESULTS' | i18n }}</span>
    <i class="hg-full-right-arrow"></i>
  </a>

  <a
    class="item"
    *ngFor="let entrypoint of entryPoints"
    [routerLinkActive]="isServer ? '' : 'is-active'"
    [routerLink]="[
      '/virtual/category/' +
        (!!InstantLeagueEnum[entrypoint.id] || !!InsaLeagueEnum[entrypoint.id] ? 'instant-league/' : ''),
      entrypoint.id
    ]"
    (click)="onMenuClickAction()"
  >
    <hg-entrypoint-icon [entryPointId]="entrypoint.id"></hg-entrypoint-icon>
    <span>{{ getEntryPointName(entrypoint) }}</span>
    <i class="hg-full-right-arrow"></i>
  </a>
</div>
