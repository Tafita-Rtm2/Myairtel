<hg-loader *ngIf="isLoading"></hg-loader>

<div
  class="title"
  *ngIf="!isLoading && !!eventBetType && eventBetType.betTypeId !== 30030 && eventBetType.betTypeId !== 30031"
>
  <i [class]="eventBetType.betTypeId | hgVirtualBetTypeIcon"></i>
  <span>{{ eventBetType.name }}</span>
</div>
<div class="no-bets" *ngIf="!isLoading && isEventExpired">
  <i class="hg-cross"></i>
  {{ 'EVENT.VIRTUAL.NO_BETS' | i18n }}
</div>
<ng-container *ngIf="!isLoading && eventBetType?.betTypeId && !isEventExpired">
  <div class="items-container" [ngSwitch]="eventBetType.betTypeId">
    <ng-container *ngSwitchDefault>
      <div
        class="item"
        *ngFor="let eventBetTypeItem of internalEventBetTypeItems"
        (click)="onSelectionChanged(eventBetTypeItem)"
        [class.selected]="eventBetTypeItem.selected"
      >
        <span
          class="name"
          *ngIf="
            event.eventType !== EventType.Race && event.eventType !== EventType.NumbersGame;
            else RaceOrNumbersGame
          "
          >{{ eventBetTypeItem.longName || eventBetTypeItem.shortName }}</span
        >
        <ng-template #RaceOrNumbersGame>
          <span class="name">{{ eventBetTypeItem.shortName }}</span>
        </ng-template>
        <span *ngIf="event.eventType === EventType.Race" class="runner-name">{{ eventBetTypeItem.runnerName }}</span>
        <span class="odds">{{ eventBetTypeItem.odds }} </span>
      </div>
    </ng-container>

    <!-- Spin and Win -->
    <hg-spin-and-win-winner
      *ngSwitchCase="30043"
      [eventBetType]="eventBetType"
      [eventBetTypeItems]="internalEventBetTypeItems"
      (selectionChanged)="onSelectionChanged($event, false)"
    ></hg-spin-and-win-winner>
    <hg-spin-and-win-high-low
      *ngSwitchCase="30045"
      [eventBetTypeItems]="internalEventBetTypeItems"
      (selectionChanged)="onSelectionChanged($event)"
    ></hg-spin-and-win-high-low>
    <hg-spin-and-win-dozens
      *ngSwitchCase="30046"
      [eventBetTypeItems]="internalEventBetTypeItems"
      (selectionChanged)="onSelectionChanged($event)"
    ></hg-spin-and-win-dozens>
    <hg-spin-and-win-color
      *ngSwitchCase="30047"
      [eventBetTypeItems]="internalEventBetTypeItems"
      (selectionChanged)="onSelectionChanged($event)"
    ></hg-spin-and-win-color>
    <hg-spin-and-win-split
      *ngSwitchCase="30048"
      [eventBetTypeItems]="internalEventBetTypeItems"
      (selectionChanged)="onSelectionChanged($event)"
    ></hg-spin-and-win-split>
    <hg-spin-and-win-line
      *ngSwitchCase="30049"
      [eventBetTypeItems]="internalEventBetTypeItems"
      (selectionChanged)="onSelectionChanged($event)"
    ></hg-spin-and-win-line>
    <hg-spin-and-win-corner
      *ngSwitchCase="30050"
      [eventBetTypeItems]="internalEventBetTypeItems"
      (selectionChanged)="onSelectionChanged($event)"
    ></hg-spin-and-win-corner>
    <hg-spin-and-win-six
      *ngSwitchCase="30052"
      [eventBetTypeItems]="internalEventBetTypeItems"
      (selectionChanged)="onSelectionChanged($event)"
    ></hg-spin-and-win-six>
    <hg-spin-and-win-column
      *ngSwitchCase="30053"
      [eventBetTypeItems]="internalEventBetTypeItems"
      (selectionChanged)="onSelectionChanged($event)"
    ></hg-spin-and-win-column>
    <hg-spin-and-win-neighbors
      *ngSwitchCase="30054"
      [eventBetType]="eventBetType"
      [eventBetTypeItems]="internalEventBetTypeItems"
      (selectionChanged)="onSelectionChanged($event, false)"
    ></hg-spin-and-win-neighbors>
    <hg-spin-and-win-sectors
      *ngSwitchCase="30055"
      [eventBetTypeItems]="internalEventBetTypeItems"
      (selectionChanged)="onSelectionChanged($event)"
    ></hg-spin-and-win-sectors>

    <!-- Lucky Loot -->
    <hg-lucky-loot-numbers
      *ngSwitchCase="30032"
      [count]="6"
      [event]="event"
      [eventBetType]="eventBetType"
    ></hg-lucky-loot-numbers>
    <hg-lucky-loot-numbers
      *ngSwitchCase="30033"
      [count]="5"
      [event]="event"
      [eventBetType]="eventBetType"
    ></hg-lucky-loot-numbers>
    <hg-lucky-loot-numbers
      *ngSwitchCase="30034"
      [count]="4"
      [event]="event"
      [eventBetType]="eventBetType"
    ></hg-lucky-loot-numbers>
    <hg-lucky-loot-numbers
      *ngSwitchCase="30035"
      [count]="3"
      [event]="event"
      [eventBetType]="eventBetType"
    ></hg-lucky-loot-numbers>
    <hg-lucky-loot-numbers
      *ngSwitchCase="30036"
      [count]="2"
      [event]="event"
      [eventBetType]="eventBetType"
    ></hg-lucky-loot-numbers>
    <hg-lucky-loot-numbers
      *ngSwitchCase="30037"
      [count]="1"
      [event]="event"
      [eventBetType]="eventBetType"
    ></hg-lucky-loot-numbers>
    <hg-lucky-loot-colors-or-more
      *ngSwitchCase="30038"
      [eventBetTypeItems]="internalEventBetTypeItems"
      [isFirstColorBetType]="true"
      (selectionChanged)="onSelectionChanged($event)"
    ></hg-lucky-loot-colors-or-more>
    <hg-lucky-loot-colors-or-more
      *ngSwitchCase="30039"
      [eventBetTypeItems]="internalEventBetTypeItems"
      (selectionChanged)="onSelectionChanged($event)"
    ></hg-lucky-loot-colors-or-more>
    <hg-lucky-loot-event-bet-type-with-event-bet-type-items
      *ngSwitchCase="30040"
      [eventBetTypeItems]="internalEventBetTypeItems"
      (selectionChanged)="onSelectionChanged($event)"
    >
    </hg-lucky-loot-event-bet-type-with-event-bet-type-items>
    <hg-lucky-loot-event-bet-type-with-event-bet-type-items
      *ngSwitchCase="30041"
      [eventBetTypeItems]="internalEventBetTypeItems"
      [betTypeContext]="eventBetType.betTypeContext"
      (selectionChanged)="onSelectionChanged($event)"
    >
    </hg-lucky-loot-event-bet-type-with-event-bet-type-items>
    <hg-lucky-loot-numbers
      *ngSwitchCase="30042"
      [count]="6"
      [event]="event"
      [eventBetType]="eventBetType"
    ></hg-lucky-loot-numbers>

    <!-- Keno -->
    <hg-keno-heads-tails-even
      *ngSwitchCase="30030"
      [eventBetTypeItems]="internalEventBetTypeItems"
      (selectionChanged)="onSelectionChanged($event)"
    ></hg-keno-heads-tails-even>
    <hg-keno-pick *ngSwitchCase="30031" [event]="event" [eventBetType]="eventBetType"></hg-keno-pick>
  </div>
</ng-container>
