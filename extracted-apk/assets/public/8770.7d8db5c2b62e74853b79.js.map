<ul>
  <li
    *ngFor="let round of rounds | slice : 0 : 10; let i = index; trackBy: trackRound"
    [id]="i === 0 ? 'Virtual_current_matches' : 'Virtual_futur_matches'"
    [class.active]="round.id === selectedRoundId"
    [class.live]="!!liveInterval && i === 0"
    [class.margin]="liveTimeLeft > 0 && i === 0"
    [class.new]="round.roundNumber === 1 && i !== 0"
    (click)="changeRound(round.id)"
  >
    <ng-container
      [ngTemplateOutlet]="
        round.time > now && i !== 0 ? displayStartTime : liveInterval ? displayLive : displayCountdown
      "
    >
    </ng-container>

    <ng-template #displayStartTime>
      <div *ngIf="round.roundNumber === 1 && i !== 0" class="new-badge">
        <div></div>
        <span>NEW</span>
        <div></div>
      </div>
      <div class="infos">
        <div class="time">{{ round.time | hgTime }}</div>
      </div>
    </ng-template>

    <ng-template #displayCountdown>
      <div class="infos">
        <div class="time">{{ minutesBeforeStart | number : '2.0-0' }}:{{ secondsBeforeStart | number : '2.0-0' }}</div>
      </div>
    </ng-template>

    <ng-template #displayLive>
      <div class="infos">
        <div class="time">
          <div *ngIf="liveTimeLeft > 0">Live</div>
          <div *ngIf="liveTimeLeft <= 0">{{ 'INSTANT_LEAGUE.RESULTS' | i18n }}</div>
          <div *ngIf="liveTimeLeft > 0">{{ liveMinuteDisplayed | number : '2.0-0' }}'</div>
        </div>
        <div *ngIf="liveTimeLeft > 0" class="progress-bar" [style.width]="livePercentageProgress + '%'"></div>
        <div *ngIf="resultsTimeLeft > 0" class="progress-bar" [style.width]="resultsPercentageProgress + '%'"></div>
      </div>
    </ng-template>
  </li>
</ul>
