<div
  class="button-container"
  *ngFor="let sector of spinAndWinSectors; let i = index; let last = last"
  [class.not-selected]="!orderedEventBetTypeItems[i + 1].selected"
>
  <button
    class="button"
    [style.background-color]="spinAndWinSectorColors[i]"
    (click)="addOrRemoveItemToSelection(orderedEventBetTypeItems[i + 1])"
    [ngClass]="{ 'last-child': last }"
  >
    <span *ngFor="let s of sector">{{ s }}</span>
  </button>
</div>

<div class="zero-container" [class.not-selected]="!orderedEventBetTypeItems[0].selected">
  <div class="zero" (click)="addOrRemoveItemToSelection(orderedEventBetTypeItems[0])">
    <hg-roulette-item
      [number]="0"
      [size]="RouletteItemSize.Small"
      [optionalWidth]="RouletteItemSize.ExtraLarge"
    ></hg-roulette-item>
  </div>
</div>
