<div *ngFor="let eventBetTypeItem of eventBetTypeItems">
  <button [class.selected]="eventBetTypeItem.selected" (click)="addOrRemoveItemToSelection(eventBetTypeItem)">
    <i [class]="betTypeIcons[eventBetTypeItem.betTypeItemId]"></i>
    <span class="short-name">{{ eventBetTypeItem.shortName }}</span>
    <span class="description" *ngIf="betTypeContext">{{
      'VIRTUAL.EVENT_BETTYPE_ITEM.' + eventBetTypeItem.betTypeItemId | i18n : total
    }}</span>
    <span class="description" *ngIf="!betTypeContext">{{
      'VIRTUAL.EVENT_BETTYPE_ITEM.' + eventBetTypeItem.betTypeItemId | i18n
    }}</span>
  </button>
</div>
