<div class="event" *ngIf="event">
  <div class="icon">
    <i class="hg-arrow-left" (click)="goBack()"></i>
  </div>
  <div class="informations" [routerLink]="event | hgEventLink">
    <hg-entrypoint-icon [entryPointId]="event.entryPointId"></hg-entrypoint-icon>
    <div class="event-informations">
      <div class="name">
        {{ eventCategory.name }}
        <span *ngIf="event.displayId">({{ event.displayId }})</span>
      </div>
      <div class="infos">
        <span>{{ event.expectedStart | hgDate }}&nbsp;&nbsp;-&nbsp;&nbsp;{{ event.expectedStart | hgTime }}</span>
      </div>
    </div>
  </div>
</div>
