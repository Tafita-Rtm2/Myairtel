<!-- eslint-disable @angular-eslint/template/eqeqeq -->

<ng-container *ngIf="selectionMode === SpinAndWinSelectionMode.Manual; else grid">
  <input type="number" [(ngModel)]="selected" (ngModelChange)="previewSelectedItem()" #input />
</ng-container>

<ng-template #grid>
  <div class="grid">
    <button
      *ngFor="let item of items; trackBy: trackByIndex"
      (click)="selectItem(item)"
      [class.opacity]="selected && selected !== item"
      type="button"
    >
      <hg-roulette-item [number]="item" [size]="RouletteItemSize.Small"></hg-roulette-item>
    </button>
  </div>

  <hr />
</ng-template>

<div class="neighbors">
  <div *ngFor="let c of spinAndWinNeighbors[selected]">
    <hg-roulette-item [number]="c" [size]="RouletteItemSize.Large"></hg-roulette-item>
  </div>
</div>

<button
  class="button button-addToBetslip"
  (click)="addOrRemoveItemToSelection()"
  *ngIf="selected != null && selected >= 0 && selected <= 36"
>
  {{ 'BET.ADD_TO_BETSLIP' | i18n }}
</button>

<div class="mobile-selection" [class.opened]="oddsPreviewerState">
  <div class="action">
    <button class="button" (click)="addOrRemoveItemToSelection()">
      {{ 'VIRTUAL.ADD_TO_BETSLIP' | i18n }}
    </button>
  </div>

  <div class="selection">
    <div class="selection-odds-container">
      <div class="bet-type">{{ eventBetType.name }} :</div>
      <div class="items-container">
        <span>{{ selected }}</span>
      </div>
    </div>

    <span class="odds" *ngIf="eventBetTypeItem">{{ eventBetTypeItem.odds }}</span>
  </div>
</div>
