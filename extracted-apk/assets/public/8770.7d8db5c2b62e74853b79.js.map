<div *ngFor="let item of items; let i = index" class="container">
  <div class="line">
    <hg-roulette-item
      [number]="item[0].id"
      [size]="RouletteItemSize.Large"
      [class.not-selected]="!item[0].selected"
    ></hg-roulette-item>
    <i
      [class]="orderedEventBetTypeItems[i * 2 + 1].selected ? 'hg-checked' : 'hg-unchecked'"
      (click)="addOrRemoveItemToSelection(orderedEventBetTypeItems[i * 2 + 1])"
      *ngIf="i < 11"
    ></i>
    <hg-roulette-item
      [number]="item[1].id"
      [size]="RouletteItemSize.Large"
      [class.not-selected]="!item[1].selected"
    ></hg-roulette-item>
    <i
      [class]="orderedEventBetTypeItems[i * 2 + 2].selected ? 'hg-checked' : 'hg-unchecked'"
      (click)="addOrRemoveItemToSelection(orderedEventBetTypeItems[i * 2 + 2])"
      *ngIf="i < 11"
    ></i>
    <hg-roulette-item
      [number]="item[2].id"
      [size]="RouletteItemSize.Large"
      [class.not-selected]="!item[2].selected"
    ></hg-roulette-item>
  </div>
</div>

<div class="zero">
  <i
    [class]="orderedEventBetTypeItems[0].selected ? 'hg-checked' : 'hg-unchecked'"
    (click)="addOrRemoveItemToSelection(orderedEventBetTypeItems[0])"
  ></i>
  <hg-roulette-item
    [number]="0"
    [size]="RouletteItemSize.Small"
    [optionalWidth]="RouletteItemSize.ExtraLarge"
    [class.not-selected]="!orderedEventBetTypeItems[0].selected"
  ></hg-roulette-item>
</div>
