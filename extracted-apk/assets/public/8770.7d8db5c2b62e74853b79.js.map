<ng-container *ngIf="!isClosed; else closed">
  <ng-container *ngIf="isUserLoggedIn; else userDisconnected">
    <div
      class="video-player"
      [style.backgroundImage]="
        streamConfig && streamConfig.configuration ? 'url(' + streamConfig.configuration.previewImage + ')' : ''
      "
    >
      <ng-container
        *ngIf="streamConfig && streamConfig.configuration.displayMode === DisplayMode.IFrame; else directLink"
      >
        <div class="header">
          <span>{{ 'VIDEOPLAYER.WATCH_STREAM' | i18n }}</span>
          <i class="icon hg-close" (click)="closeVideoPlayer()"></i>
        </div>
        <div class="shadow" (click)="showIFrame()">
          <i class="icon hg-play" *ngIf="!isIFrameVisible"></i>
          <iframe
            class="video-frame"
            [src]="streamConfig.url | hgSafeUrl"
            allowfullscreen
            frameborder="0"
            *ngIf="isIFrameVisible"
          ></iframe>
        </div>
      </ng-container>

      <ng-template #directLink>
        <!-- TODO: Handle Streaming mode and display a custom video media player -->
        TODO
      </ng-template>
    </div>
  </ng-container>

  <ng-template #userDisconnected>
    <div
      class="connection"
      [style.backgroundImage]="
        streamConfig && streamConfig.configuration ? 'url(' + streamConfig.configuration.previewImage + ')' : ''
      "
    >
      <div class="shadow">
        <i class="icon hg-close" (click)="closeVideoPlayer()"></i>
        <span>{{ 'VIDEOPLAYER.CONNECT_TO_VIEW_STREAM' | i18n }}</span>
        <div class="buttons">
          <button class="button login" (click)="connect()">{{ 'LOGIN.LOGIN' | i18n }}</button>
          <button class="button register" [routerLink]="'/myaccount/registration'">
            {{ 'LOGIN.REGISTER' | i18n }}
          </button>
        </div>
      </div>
    </div>
  </ng-template>
</ng-container>

<ng-template #closed>
  <div class="closed" (click)="openVideoPlayer()">
    <div class="infos">
      <i class="icon hg-play accent"></i>
      <span>{{ 'VIDEOPLAYER.WATCH_STREAM' | i18n }}</span>
    </div>
    <div class="preview">
      <img
        *ngIf="streamConfig?.configuration?.streamImage"
        src="{{ streamConfig?.configuration?.streamImage }}"
        alt="Stream"
      />
    </div>
  </div>
</ng-template>
