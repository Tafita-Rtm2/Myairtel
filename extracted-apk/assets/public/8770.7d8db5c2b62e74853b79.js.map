<ng-container *ngIf="!loading && eventCategory?.streamConfiguration">
  <hg-video-player
    [streamConfig]="eventCategory.streamConfiguration"
    [shouldBeOpenedByDefault]="videoPlayerShouldBeOpenedByDefault"
  ></hg-video-player>
</ng-container>

<div class="informations" *ngIf="eventCategory && !loading">
  <hg-entrypoint-icon [entryPointId]="eventCategory.id"></hg-entrypoint-icon>
  <span>{{ getEventCategoryName(eventCategory) }}</span>
</div>

<router-outlet></router-outlet>
