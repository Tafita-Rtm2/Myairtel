<button
  class="button color"
  [class.selected]="orderedEventBetTypeItems[0].selected"
  (click)="addOrRemoveItemToSelection(orderedEventBetTypeItems[0])"
>
  <div class="black">
    <div class="icon"></div>
    <span class="odds">{{ orderedEventBetTypeItems[0].odds }}</span>
    <span>{{ orderedEventBetTypeItems[0].shortName }}</span>
  </div>
</button>

<button
  class="button color"
  [class.selected]="orderedEventBetTypeItems[1].selected"
  (click)="addOrRemoveItemToSelection(orderedEventBetTypeItems[1])"
>
  <div class="red">
    <div class="icon"></div>
    <span class="odds">{{ orderedEventBetTypeItems[1].odds }}</span>
    <span>{{ orderedEventBetTypeItems[1].shortName }}</span>
  </div>
</button>

<button
  class="button number"
  [class.selected]="orderedEventBetTypeItems[2].selected"
  (click)="addOrRemoveItemToSelection(orderedEventBetTypeItems[2])"
>
  <div class="zero">
    <hg-roulette-item
      [number]="0"
      [size]="RouletteItemSize.Small"
      [optionalWidth]="RouletteItemSize.ExtraLarge"
    ></hg-roulette-item>
    <span class="odds">{{ orderedEventBetTypeItems[2].odds }}</span>
  </div>
</button>
