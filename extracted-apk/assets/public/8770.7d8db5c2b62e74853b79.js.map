<hg-loader *ngIf="loading"></hg-loader>
<div class="container" *ngIf="!loading && event && !isEventExpired">
  <div class="container-mobile">
    <div
      class="container-flash-mobile"
      [class.full-width]="!(betTypeOptions[baseSelection.length] && betTypeOptions[baseSelection.length].length > 1)"
    >
      <button (click)="flash(3)">
        <i class="hg-flash"></i>
        <span>{{ 'DRAW_GAMES.FLASH' | i18n }}</span>
      </button>
      <button (click)="openPopin()">
        <i class="hg-flash"></i>
        <span>{{ 'DRAW_GAMES.MULTIPLE_FLASH' | i18n }}</span>
      </button>
    </div>
  </div>

  <div class="container-flash-desktop">
    <div
      class="container-flash-buttons"
      [class.full-width]="!(betTypeOptions[baseSelection.length] && betTypeOptions[baseSelection.length].length > 1)"
    >
      <button *ngFor="let flashNumber of flashNumbers" (click)="flash(flashNumber)">
        <i class="hg-flash"></i>
        <div class="container-button">
          <span>{{ 'KENO_PICK.FLASH' | i18n }}</span>
          <span class="number">{{ flashNumber }} {{ 'KENO_PICK.NUMBER' | i18n }}</span>
        </div>
      </button>
    </div>
  </div>

  <div class="container-grid">
    <div class="title-grid">
      <span>{{ 'KENO_PICK.GRID' | i18n }}</span>
    </div>

    <div class="grid">
      <div
        *ngFor="let number of baseNumbers"
        (click)="onBaseSelection(number)"
        class="number"
        [ngClass]="{
          selected: baseSelection.indexOf(number) > -1,
          disabled: baseSelection.length === 10 && baseSelection.indexOf(number) === -1
        }"
      >
        {{ number }}
      </div>
    </div>
  </div>

  <div class="container-popup" [class.opened]="!selectionEmpty">
    <div class="mobile-add-to-betslip" *ngIf="eventBetType">
      <div class="container-stake">
        <span>{{ 'COMMON.STAKE' | i18n }}</span>
        <span class="stake"><hg-currency [value]="computedAmount"></hg-currency></span>
      </div>

      <button class="button" (click)="addToBetslip()">
        {{ 'VIRTUAL.ADD_TO_BETSLIP' | i18n }}
      </button>
    </div>
    <div class="selection">
      <div class="container-selection">
        <span>Selection</span>
        <div class="container-numbers">
          <div class="number base" *ngFor="let number of baseSelection">
            {{ number }}
          </div>
        </div>
      </div>

      <div class="betslip-button" (click)="addToBetslip()">
        <button>{{ 'BET.ADD_TO_BETSLIP' | i18n }}</button>
      </div>
    </div>
  </div>
</div>

<p class="nodata" *ngIf="!loading && error">
  <i class="hg-cross"></i>
  {{ 'BETSLIST.NO_EVENT' | i18n }}
</p>

<div class="nodata" *ngIf="!loading && isEventExpired">
  <i class="hg-cross"></i>
  {{ 'EVENT.KENO_PICK.NO_BETS' | i18n }}
</div>
