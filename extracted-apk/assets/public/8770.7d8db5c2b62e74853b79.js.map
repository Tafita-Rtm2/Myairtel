<div *ngFor="let eventBetTypeItem of eventBetTypeItems">
  <button [class.selected]="eventBetTypeItem.selected" (click)="addOrRemoveItemToSelection(eventBetTypeItem)">
    <span class="short-name">{{ eventBetTypeItem.shortName }}</span>
    <span
      class="description"
      *ngIf="eventBetTypeItem.betTypeItemId === 3151 || eventBetTypeItem.betTypeItemId === 3152"
      >{{ eventBetTypeItem.betTypeItemId === 3151 ? '1-40' : '41-80' }}</span
    >
  </button>
</div>
