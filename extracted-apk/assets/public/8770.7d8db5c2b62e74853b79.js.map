<div *ngFor="let item of items; let i = index" class="container">
  <div
    class="line"
    (click)="addOrRemoveItemToSelection(orderedEventBetTypeItems[i + 1])"
    [class.not-selected]="!orderedEventBetTypeItems[i + 1].selected"
  >
    <span>L{{ i + 1 }}</span>
    <i [ngClass]="orderedEventBetTypeItems[i + 1].selected ? 'hg-checked' : 'hg-unchecked'"></i>
    <div class="roulette-results">
      <hg-roulette-item
        *ngFor="let n of [0, 1, 2, 3, 4, 5]"
        [number]="item[n]"
        [size]="RouletteItemSize.Small"
      ></hg-roulette-item>
    </div>
  </div>
</div>

<div
  class="zero"
  (click)="addOrRemoveItemToSelection(orderedEventBetTypeItems[0])"
  [class.not-selected]="!orderedEventBetTypeItems[0].selected"
>
  <span>L12</span>
  <i [ngClass]="orderedEventBetTypeItems[0].selected ? 'hg-checked' : 'hg-unchecked'"></i>
  <hg-roulette-item
    [number]="0"
    [size]="RouletteItemSize.Small"
    [optionalWidth]="RouletteItemSize.ExtraLarge"
  ></hg-roulette-item>
</div>
