<div class="numbers-container">
  <div *ngFor="let luckyLootItem of luckyLootItems" class="number">
    <hg-lucky-loot-item
      [color]="luckyLootItem.color"
      [number]="luckyLootItem.number"
      [selected]="selection.indexOf(luckyLootItem.number) > -1"
      [allSelected]="!selection.length"
      (click)="toggleItem(luckyLootItem.number)"
    ></hg-lucky-loot-item>
  </div>
</div>

<div class="desktop-selection">
  <ng-container>
    <span class="selection-title">{{ 'VIRTUAL.MY_SELECTION' | i18n }} :</span>
    <div class="bet-type">{{ eventBetType.name }} :</div>
    <div class="selection-odds-container">
      <div class="items-container" *ngIf="selection?.length">
        <ng-container *ngFor="let item of selection; let last = last">
          <span>{{ item }}</span>
          <span *ngIf="!last">-</span>
        </ng-container>
      </div>
    </div>

    <button class="button" (click)="addToBetSlip()" [disabled]="selection.length !== count">
      <span>{{ 'VIRTUAL.ADD_TO_BETSLIP' | i18n }}</span>
    </button>
  </ng-container>
</div>

<div class="mobile-selection" [class.opened]="oddsPreviewerState">
  <div class="action">
    <hg-number-picker
      [(ngModel)]="stakes"
      [minimum]="eventBetType.baseAmount"
      [maximum]="eventBetType.maximumAmount"
      [increment]="eventBetType.minimumAmountIncrement"
    ></hg-number-picker>

    <button class="button" (click)="addToBetSlip()" [disabled]="selection.length !== count">
      {{ 'VIRTUAL.ADD_TO_BETSLIP' | i18n }}
    </button>
  </div>

  <div class="selection">
    <div class="selection-odds-container">
      <div class="bet-type">{{ eventBetType.name }} :</div>
      <div class="items-container">
        <div *ngFor="let item of selection; let last = last">
          <span>{{ item }}</span>
          <span *ngIf="!last"> - </span>
        </div>
      </div>
    </div>
  </div>
</div>
