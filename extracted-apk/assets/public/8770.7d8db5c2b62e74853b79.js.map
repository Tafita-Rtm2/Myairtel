<div class="container">
  <div class="title">
    <i class="hg-flash"></i>
    <div>{{ 'DRAW_GAMES.FLASH_MULTIPLES' | i18n }}</div>
  </div>

  <div class="list">
    <div
      *ngFor="let multipleFlashNumber of multipleFlashNumbers"
      class="container-multiple flash"
      (click)="flash(multipleFlashNumber)"
    >
      <i class="hg-flash"></i><span>{{ multipleFlashNumber }} {{ 'DRAW_GAMES.NUMBER' | i18n }}</span>
    </div>
  </div>
</div>
