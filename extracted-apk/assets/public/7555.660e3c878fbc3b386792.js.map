<div class="shortcuts">
  <button #slideArrowLeft class="shortcuts__arrow shortcuts__arrow--left" type="button">
    <i class="hg-arrow-left" (click)="onPreviousPosition()"></i>
  </button>
  <button #slideArrowRight class="shortcuts__arrow shortcuts__arrow--right" type="button">
    <i class="hg-arrow-right" (click)="onNextPosition()"></i>
  </button>

  <div
    #slideElement
    class="shortcuts__links"
    [class.shortcuts__links--no-background]="iconDesign !== IconDesignType.Default"
    (scroll)="scrollHandler($event)"
  >
    <div [style.order]="searchButtonOrder">
      <button type="button" id="Shortcuts_Search" (click)="toggleSearchPopin()">
        <span>
          <i *ngIf="iconDesign === IconDesignType.Default" class="hg-search"></i>
          <img
            *ngIf="iconDesign !== IconDesignType.Default"
            src="assets/shortcuts/{{ iconDesign }}/{{ operatorKey ? operatorKey + '/' : '' }}search.png"
            loading="lazy"
            alt="search icon shortcut"
          />
        </span>
        <span>{{ 'SEARCH.SEARCH' | i18n }}</span>
      </button>
    </div>
    <div [style.order]="allSportsButtonOrder" *ngIf="!hideAllSportsButton">
      <button id="Shortcuts_MenuAllSports" type="button" (click)="openMenu()">
        <span>
          <i *ngIf="iconDesign === IconDesignType.Default" class="hg-all-sports"></i>
          <img
            *ngIf="iconDesign !== IconDesignType.Default"
            src="assets/shortcuts/{{ iconDesign }}/{{ operatorKey ? operatorKey + '/' : '' }}sports.png"
            loading="lazy"
            alt="sports icon shortcut"
          />
        </span>
        <span>{{ 'NAV.ALL_SPORTS' | i18n }}</span>
      </button>
    </div>
    <div [style.order]="missionsButtonOrder" *ngIf="showSmarticoMissions">
      <button type="button" id="Shortcuts_Missions" (click)="missionsButtonClick()">
        <span>
          <div *ngIf="missionsCount$ | async as missionsCount" class="shortcuts__missions-counter">
            {{ missionsCount }}
          </div>
          <img src="assets/smartico/mission.png" loading="lazy" alt="missions icon shortcut" />
        </span>
        <span>{{ 'NAV.MISSIONS' | i18n }}</span>
      </button>
    </div>
    <div [style.order]="charityButtonOrder" *ngIf="!hideCharityButton">
      <button type="button" id="Shortcuts_Charities" routerLink="/about/charities" (click)="charityButtonClick()">
        <span>
          <i *ngIf="iconDesign === IconDesignType.Default" class="hg-charity"></i>
          <img
            *ngIf="iconDesign !== IconDesignType.Default"
            src="assets/shortcuts/{{ iconDesign }}/charity.png"
            loading="lazy"
            alt="charity icon shortcut"
          />
        </span>
        <span>{{ 'NAV.CHARITY' | i18n }}</span>
      </button>
    </div>

    <div
      *ngFor="let shortcutsLink of shortcutsLinks; let index = index"
      [ngClass]="shortcutsLink.iconUrl"
      [style.order]="index + 1"
    >
      <a
        *ngIf="shortcutsLink.action.url"
        id="Shortcuts_{{ shortcutsLink.iconUrl }}"
        [routerLink]="[shortcutsLink.action.url]"
        (click)="shortCutClick(shortcutsLink, index)"
      >
        <span>
          <i *ngIf="iconDesign === IconDesignType.Default" class="hg-{{ shortcutsLink.iconUrl }}"></i>
          <img
            *ngIf="iconDesign !== IconDesignType.Default"
            class="{{ shortcutsLink.iconUrl }}"
            src="assets/shortcuts/{{ iconDesign }}/{{ operatorKey ? operatorKey + '/' : '' }}{{
              shortcutsLink.iconUrl
            }}.png"
            loading="lazy"
            alt="{{ shortcutsLink.iconUrl }} icon shortcut"
          />
        </span>
        <span>
          {{
            ('NAV.' + shortcutsLink.text.toUpperCase() | i18n).includes('NOT FOUND')
              ? shortcutsLink.text
              : ('NAV.' + shortcutsLink.text.toUpperCase() | i18n)
          }}
        </span>
      </a>

      <a
        id="Shortcuts_{{ shortcutsLink.iconUrl }}"
        *ngIf="shortcutsLink.action.drawerType"
        (click)="openDrawer(shortcutsLink.action.drawerType)"
      >
        <span>
          <i *ngIf="iconDesign === IconDesignType.Default" class="hg-{{ shortcutsLink.iconUrl }}"></i>
          <img
            *ngIf="iconDesign !== IconDesignType.Default"
            src="assets/shortcuts/{{ iconDesign }}/{{ operatorKey ? operatorKey + '/' : '' }}{{
              shortcutsLink.iconUrl
            }}.png"
            loading="lazy"
            alt="{{ shortcutsLink.iconUrl }} icon shortcut"
          />
        </span>
        <span>
          {{
            (shortcutsLink.text.toUpperCase() | i18n).includes('NOT FOUND')
              ? shortcutsLink.text
              : (shortcutsLink.text.toUpperCase() | i18n)
          }}
        </span>
      </a>
    </div>
  </div>

  <hg-search-popin
    id="Shortcuts_SearchPopin"
    *ngIf="displaySearchPopin"
    (close)="toggleSearchPopin()"
  ></hg-search-popin>
</div>
