<ng-container *ngIf="operators?.length && !hide">
  <span class="current" (click)="toggleThemesSelector()" [class.opening]="opened">
    <i class="hg-arrow-left" [class.arrow-opened]="mobileOpening"></i>
    <i class="hg-settings"></i>
    {{ this.currentOperator?.name }}
    <i class="hg-arrow-down"></i>
  </span>
  <ul [class.active]="opened" [class.dev]="dev">
    <li
      *ngFor="let operator of this.operators; let first = first"
      [class.active]="operator.name === currentOperator?.name"
      (click)="changeTheme(operator)"
    >
      <span>
        <b>{{ operator.name }}</b>
        {{ operator.description ? ' : ' + operator.description : '' }}
      </span>
      <i *ngIf="first" class="hg-arrow-down"></i>
    </li>
  </ul>
</ng-container>
