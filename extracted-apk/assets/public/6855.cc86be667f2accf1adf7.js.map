<div class="landing__header">
  <div class="landing__header-logo">
    <img [src]="logoPath" alt="logo" />
  </div>
</div>
<div class="landing__content">
  <hg-raw-template *ngIf="content" [html]="content" [css]="style"></hg-raw-template>
</div>
<div class="landing__buttons">
  <div>
    <button type="button" (click)="login()" class="button button--login">{{ 'LANDING.BUTTON.LOGIN' | i18n }}</button>
  </div>
  <div>
    <button type="button" (click)="signup()" class="button button--register">
      🎁 {{ 'LANDING.BUTTON.REGISTER' | i18n }}
    </button>
    <hg-inline-svg src="assets/light-effect.svg"></hg-inline-svg>
  </div>
</div>

<hg-login
  [active]="loginOpen"
  [fromMobileDeposit]="false"
  [fromDesktopDeposit]="false"
  [fromLanding]="true"
  [closePopup]="closePopup"
></hg-login>
