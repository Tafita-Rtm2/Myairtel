<ng-container [ngSwitch]="blinder">
  <img
    *ngSwitchCase="HorseRacingBlinderType.Blinders"
    src="assets/images/horse-racing/blinder-blinders.svg"
    alt="Blinder"
  />
  <img
    *ngSwitchCase="HorseRacingBlinderType.Winkers"
    src="assets/images/horse-racing/blinder-winkers.svg"
    alt="Blinder winkers"
  />
</ng-container>
