<div class="banners" *hgMediaIfNot="'md'; ssr: true">
  <hg-anchor anchor="horse-banner"></hg-anchor>
</div>

<div class="nodata" *ngIf="numberOfMeetingsOfToday === 0 && numberOfMeetingsOfTomorrow === 0">
  <img src="/assets/nodata.png" alt="nodata" />
  <span>{{ 'HORSERACING.NO_RACES_AVAILABLE' | i18n }}</span>
</div>

<hg-horseracing-races-of-the-day
  [day]="'today'"
  (numberOfRacesOfTheDay)="getNumberOfRacesForToday($event)"
></hg-horseracing-races-of-the-day>
<hg-horseracing-races-of-the-day
  [day]="'tomorrow'"
  (numberOfRacesOfTheDay)="getNumberOfRacesForTomorrow($event)"
></hg-horseracing-races-of-the-day>
