<ng-container [ngSwitch]="unshod">
  <img *ngSwitchCase="HorseRacingUnshodType.None" src="assets/images/horse-racing/unshod-none.svg" alt="Unshod none" />
  <img *ngSwitchCase="HorseRacingUnshodType.Both" src="assets/images/horse-racing/unshod-both.svg" alt="Unshod both" />
  <img *ngSwitchCase="HorseRacingUnshodType.Fore" src="assets/images/horse-racing/unshod-fore.svg" alt="Unshod fore" />
  <img *ngSwitchCase="HorseRacingUnshodType.Hind" src="assets/images/horse-racing/unshod-hind.svg" alt="Unshod hind" />
</ng-container>
