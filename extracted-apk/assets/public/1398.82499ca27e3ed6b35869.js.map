<div class="title">
  <div class="position">{{ 'HORSERACING.ARRIVAL.POSITION' | i18n }}</div>
  <div class="number">{{ 'HORSERACING.ARRIVAL.NUMBER' | i18n }}</div>
  <div class="details">{{ 'HORSERACING.SELECTION.HORSE' | i18n }}</div>
</div>

<div class="runner-container">
  <div *ngFor="let runner of orderedRunners" [class.non-runner]="runner.nonRunner" class="runner">
    <div class="position" [class.no-position]="!runner.arrivalPosition">{{ runner.arrivalPosition || '-' }}</div>
    <div class="number" [class.with-position]="runner.arrivalPosition">{{ runner.number }}</div>

    <div class="details">
      <div class="horse">{{ runner.horseName }}</div>
      <div class="joker">{{ runner.riderName }}</div>
    </div>
  </div>
</div>
