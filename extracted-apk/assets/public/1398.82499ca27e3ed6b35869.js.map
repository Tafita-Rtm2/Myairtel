<div class="banner" *ngIf="showBanners">
  <hg-anchor anchor="horse-banner" *hgMediaIf="'md'; ssr: true"></hg-anchor>
</div>

<div class="player-container" *hgMediaIf="'md'">
  <hg-horseracing-video-player (closePlayer)="closeVideoPlayer()"> </hg-horseracing-video-player>
</div>

<ng-container *ngIf="showBanners">
  <div class="streaming-container-root" *hgMediaIf="'md'">
    <div class="streaming-container" *ngIf="isStreamingAvailable && !isVideoPlayerVisible">
      <div class="streaming-image-root-container" (click)="showVideoPlayer()">
        <div class="streaming-image-container">
          <div class="streaming-image">
            <img src="assets/live-stream-mobile.svg" loading="lazy" alt="Image live stream mobile" />
          </div>
        </div>
        <div class="streaming-teasing-image-container">
          <div class="streaming-teasing-image">
            <img src="assets/live-stream-teasing.png" loading="lazy" alt="Image live stream teasing" />
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-container>

<ng-container *ngIf="isAboutPage">
  <hg-table-contents *hgMediaIf="'md'"></hg-table-contents>
</ng-container>
