<hg-three-columns-layout>
  <ng-container left>
    <hg-horse-racing-menu *hgMediaIfNot="'md'; ssr: true"></hg-horse-racing-menu>
  </ng-container>

  <ng-container center>
    <div class="content">
      <router-outlet *ngIf="!isServer; else placeholder" (activate)="onActivate($event)"></router-outlet>
      <ng-template #placeholder
        ><div class="placeholder"><hg-loader></hg-loader></div
      ></ng-template>
    </div>
    <hg-horseracing-font-loader></hg-horseracing-font-loader>
  </ng-container>

  <ng-container right>
    <hg-horseracing-sidebar
      [class.sidebar-faq]="hasTableContents"
      [hasTableContents]="hasTableContents"
    ></hg-horseracing-sidebar>
  </ng-container>
</hg-three-columns-layout>
