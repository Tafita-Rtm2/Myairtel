<div class="bloc">
  <ng-container *ngFor="let link of links">
    <div
      class="item"
      *ngIf="link.action?.url"
      [routerLinkActive]="isServer ? '' : 'is-active'"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <a [routerLink]="[link.action.url]" id="HorseRacing_Menu_{{ link.id }}">
        <i [class]="link.iconUrl"></i>
        {{ link.text | i18n }}
        <i class="hg-full-right-arrow"></i>
      </a>
    </div>

    <div class="item streaming-container" *ngIf="link.action?.dialog === 'horseracing-livestream'">
      <span (click)="showVideoPlayer()" id="HorseRacing_Menu_{{ link.id }}">
        <i [class]="link.iconUrl"></i>
        <span>{{ link.text | i18n }}</span>
      </span>
    </div>
  </ng-container>
</div>

<div class="player-container">
  <hg-horseracing-video-player (closePlayer)="closeVideoPlayer()"> </hg-horseracing-video-player>
</div>
<div class="streaming-container-root">
  <div class="streaming-container" *ngIf="isStreamingAvailable && !isVideoPlayerVisible">
    <div class="streaming-image-root-container" (click)="showVideoPlayer()">
      <div class="streaming-image-container">
        <div class="streaming-image">
          <img src="assets/live-stream-mobile.svg" loading="lazy" alt="Image live stream mobile" />
        </div>
      </div>
      <div class="streaming-teasing-image-container">
        <div class="streaming-teasing-image">
          <img src="assets/live-stream-teasing.png" loading="lazy" alt="Image live stream teasing" />
        </div>
      </div>
    </div>
  </div>
</div>
