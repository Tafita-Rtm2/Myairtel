<hg-popup [hideClose]="true" [bottom]="true" [opened]="betSlipActive">
  <hg-bet-slip (close)="closeBetSlip()" [betValidatedTemplate]="betValidatedTemplate"></hg-bet-slip>
  <ng-template
    #betValidatedTemplate
    let-context="context"
    let-close="close"
    let-getBetCode="getBetCode"
    let-isGettingBetCode="isGettingBetCode"
  >
    <hg-bet-validated [context]="context" (close)="close($event)"></hg-bet-validated>
  </ng-template>
</hg-popup>

<hg-horse-racing-table-contents *ngIf="hasTableContents"></hg-horse-racing-table-contents>
