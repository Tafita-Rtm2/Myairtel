<div class="popin-header">
  <h2>{{ 'HORSERACING.ABOUT.BETTYPESGUIDE' | i18n }}</h2>
</div>

<div class="popin-body">
  <div class="icons-bet-types">
    <hg-horseracing-bettype-icon
      *ngFor="let betType of betTypes"
      [iconUrl]="imgUrl"
      [class.active]="currentBetTypeId === betType.id"
      [betTypeId]="+betType.id"
      [booster]="!!betType.booster"
      (click)="onBetTypeClick(betType.id)"
    >
    </hg-horseracing-bettype-icon>
  </div>

  <div class="line"></div>

  <div class="bet-type-information">
    <hg-horseracing-about-bettype-guide
      [betType]="currentBetTypeId"
      [content]="content.betTypes[currentBetTypeId]"
      *ngIf="content.betTypes[currentBetTypeId]"
    >
    </hg-horseracing-about-bettype-guide>
  </div>
</div>
