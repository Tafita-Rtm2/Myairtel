<div class="background">
  <div class="coupon-selection">
    <h1 class="title">{{ 'ABOUT.ODDS_COUPONS' | i18n }}</h1>
    <div class="button" *ngFor="let item of couponsInfos">
      <a (click)="logEvent(item, 'Odds')" [href]="item.urlStart + userLanguage + item.urlEnd" target="_blank">
        <hg-inline-svg [src]="'/assets/pdf-file-format-symbol.svg'"></hg-inline-svg>
        <p>{{ item.date | hgShortTextDate }}</p>
      </a>
    </div>
  </div>
</div>
