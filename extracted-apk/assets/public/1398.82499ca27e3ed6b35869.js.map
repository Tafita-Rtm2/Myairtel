<div class="select-meetings" #sideNav>
  <div id="Meeting_Header" class="current-title" [class.selected]="opened" (click)="toggleMeetingsSelector()">
    <div class="selected">
      <div id="Meeting_Number" class="meeting">R{{ currentMeetingWithRaces.meeting.number }}</div>
      <div id="Meeting_Name" class="name">{{ currentMeetingWithRaces.meeting.name }}</div>
    </div>
    <i class="hg-arrow-down" [class.open]="opened"></i>
  </div>

  <ul [class.active]="opened" (click)="outsideClick($event)">
    <li
      *ngFor="let racesPerMeeting of racesPerMeetings; let first = first"
      (click)="changeCurrentMeeting(racesPerMeeting.meeting.number)"
    >
      <div class="meeting-info">R{{ racesPerMeeting.meeting.number }} - {{ racesPerMeeting.meeting.name }}</div>
    </li>
  </ul>
</div>

<div id="Meeting_Races" class="races" #races>
  <div
    class="race"
    *ngFor="let race of currentMeetingWithRaces.races"
    (click)="changeCurrentRace(race)"
    [class.selected]="race === currentRace"
    [class.active]="race.horseRaceState === HorseRaceStateType.InSale"
  >
    <span id="Race" class="number">C{{ race.number }}</span>
  </div>
</div>
