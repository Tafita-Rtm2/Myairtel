<div class="video-player">
  <ng-container *ngIf="!isUserLoggedIn">
    <div class="video-player-container">
      <div class="video-player-container-header">
        <span class="video-player-container-header-text">{{ 'HORSERACING.STREAMING.TITLE' | i18n }}</span>
        <div>
          <i class="hg-close" (click)="closeVideoPlayer()"></i>
        </div>
      </div>
      <div class="video-container">
        <div class="fake-image">
          <img src="assets/livestream-placeholder.png" loading="lazy" alt="Livestream placeholder" />
        </div>
        <div class="black-opacity"></div>
        <div class="no-content">
          <div class="no-content-content">
            <img src="assets/logo-equidia.svg" alt="Equidia" />
            <span class="no-content-content-text">{{ 'HORSERACING.STREAMING.CONNECTION_MANDATORY' | i18n }}</span>
            <span class="no-content-content-subtext">{{ 'HORSERACING.STREAMING.NOT_REGISTERED_YET' | i18n }}</span>
            <div class="no-content-buttons">
              <button class="login button" (click)="showConnectionView()">{{ 'LOGIN.LOGIN' | i18n }}</button>
              <button type="button" class="register button" [routerLink]="'/myaccount/registration'">
                {{ 'LOGIN.REGISTER' | i18n }}
              </button>
            </div>
          </div>
        </div>
      </div>
      <i class="hg-close" (click)="closeVideoPlayer()"></i>
    </div>
  </ng-container>

  <ng-container *ngIf="isUserLoggedIn">
    <div class="video-player-container">
      <div class="video-player-container-header">
        <span class="video-player-container-header-text">{{ 'HORSERACING.STREAMING.TITLE' | i18n }}</span>
        <div>
          <i class="hg-close" (click)="closeVideoPlayer()"></i>
        </div>
      </div>
      <hg-loader *ngIf="isLoading"></hg-loader>
      <div class="video-container">
        <div id="player" class="target-video"></div>
      </div>
      <i class="hg-close" (click)="closeVideoPlayer()"></i>
    </div>
  </ng-container>
</div>
