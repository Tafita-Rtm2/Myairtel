<hg-loader *ngIf="loading"></hg-loader>

<div class="banners">
  <hg-anchor anchor="horse-banner" *hgMediaIfNot="'md'; ssr: true"></hg-anchor>
</div>

<ng-container *ngIf="displayBetCategoryNameOnMobile">
  <div class="hippique-title" *hgMediaIf="'md'">
    <i class="hg-horseracing-trotmonte"></i>
    <span>{{ 'NAV.HORSERACING' | i18n }} </span>
  </div>
</ng-container>

<div class="container" *ngIf="!loading">
  <div class="quinte" *ngIf="nextQuintePlus">
    <h1 class="title">{{ 'HORSERACING.QUINTEPLUS' | i18n }}</h1>

    <a [routerLink]="['race', 'R' + nextQuintePlus.meeting.number + 'C' + nextQuintePlus.number]">
      <hg-horseracing-race-card
        id="HorseRacing_NextQuinteDeparture_Item"
        [isGoingLive]="nextQuintePlus.isGoingLive"
        [race]="nextQuintePlus"
        [meeting]="nextQuintePlus.meeting"
      ></hg-horseracing-race-card>
    </a>
  </div>

  <div class="next-races" *ngIf="nextRaces && !!nextRaces.length">
    <h1 class="title">{{ 'HORSERACING.NEXT_RACES' | i18n }}</h1>

    <a
      *ngFor="let nextRace of nextRaces; trackBy: trackRace; let i = index"
      [routerLink]="['race', 'R' + nextRace.meeting.number + 'C' + nextRace.race.number]"
      [ngClass]="{ 'first-race-card': i === 0 }"
    >
      <hg-horseracing-race-card
        id="HorseRacing_NextDeparture_Item"
        [isGoingLive]="nextRace.isGoingLive"
        [race]="nextRace.race"
        [meeting]="nextRace.meeting"
      ></hg-horseracing-race-card>
    </a>
  </div>

  <div class="nodata" *ngIf="!nextRaces || !nextRaces.length">
    <img src="/assets/nodata.png" alt="nodata" />
    <span>{{ 'HORSERACING.NO_RACES_AVAILABLE_RIGHT_NOW' | i18n }}</span>
  </div>
</div>
