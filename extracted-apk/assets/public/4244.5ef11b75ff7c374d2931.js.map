<div class="info">
  <label class="title">
    {{ getDisplayName() }}
  </label>
  <label class="date" *ngIf="displayDate">
    {{ manualOdds.expirationDate ?? manualOdds.eventExpectedStart | hgTime }} -
    {{ manualOdds.expirationDate ?? manualOdds.eventExpectedStart | hgLongDate }}
  </label>
</div>
<div class="odd">
  <hg-event-bet-type-item-odds
    [odds]="manualOdds.fixedOdds"
    [selected]="manualOdds.selected"
    [disabled]="!manualOdds.active || disabled"
    (click)="toggleManualOddsBoost()"
  >
  </hg-event-bet-type-item-odds>
  <div class="icon-container-background">
    <div class="icon-container">
      <i class="hg-megaphone"></i>
    </div>
  </div>
</div>
