<hg-three-columns-layout>
  <ng-container left>
    <hg-sports-ui-desktop-event-categories-navigation
      *hgMediaIfNot="'md'; ssr: true"
      [eventTabs]="eventTabs"
    ></hg-sports-ui-desktop-event-categories-navigation>
  </ng-container>

  <ng-container center>
    <router-outlet *ngIf="!isServer; else placeholder" (activate)="onActivate($event)"></router-outlet>
    <ng-template #placeholder>
      <div class="placeholder">
        <hg-loader></hg-loader>
      </div>
    </ng-template>
  </ng-container>

  <ng-container right>
    <hg-sport-sidebar></hg-sport-sidebar>
  </ng-container>
</hg-three-columns-layout>
