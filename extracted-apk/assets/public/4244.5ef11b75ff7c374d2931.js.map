<div *ngIf="isStickyHeader" class="sticky-ghost-element"></div>

<ng-container>
  <hg-score-widget
    *ngIf="event"
    #scoreWidget
    [sourceRef]="event.sourceRef"
    [warnOnDataConsumption]="warnOnDataConsumption"
    [isLive]="isLiveEvent"
    [configuration]="operatorConfiguration"
    [event]="event"
    (displayed)="onWidgetDisplayed($event)"
    (closed)="onWidgetClosed()"
    (widgetError)="onWidgetError($event)"
    (blockHeight)="blockHeight($event)"
    (toggleEventHistory)="setScoreWidgetHeight()"
    [isStickyHeader]="isStickyHeader"
  >
  </hg-score-widget>
</ng-container>

<hg-event-bet-types-filters
  *ngIf="!loading && event"
  #eventBetTypeFilters
  [event]="event"
  [filters]="filters"
  [entryPointId]="event.entryPointId"
  [hasNewPlayerStatsBetType]="hasNewPlayerStatsBetType"
  [isStickyFilters]="isStickyFilters"
  [stickyTopOffset]="blockEventMobileHeight"
  [isBetBuilderToggled]="isBetBuilderToggled"
  (filterChanged)="onFilterChanged($event)"
  (toggleBetBuilderEvent)="toggleBetBuilder($event)"
></hg-event-bet-types-filters>

<hg-event-banner
  *ngIf="event?.allowBetBuilder && betBuilderBannerImages"
  [bannerImages]="betBuilderBannerImages"
  (bannerClicked)="onBetBuilderBannerClicked()"
>
</hg-event-banner>

<hg-loader *ngIf="loading"></hg-loader>
<div
  class="nodata"
  *ngIf="
  !loading && event &&
    (!enrichedGroups || !enrichedGroups.length) &&
    (event.state === EventStateType.Undisputed ||
    event.state === EventStateType.Unknown ||
    event.state === EventStateType.AboutToStart ||
    event.state === EventStateType.Started)
  "
>
  <img src="/assets/nodata.png" alt="nodata" />
  {{ 'EVENT.LIVE.NO_BETS' | i18n }}
</div>

<div class="groups" *ngIf="!loading">
  <div
    class="group"
    *ngFor="let bt of renderedGroups; let i = index; trackBy: trackEventBetType"
    id="EventBetType_{{bt.betTypeId}}"
  >
    <ng-container *ngIf="bt.eventBetTypes.length">
      <div
        class="bet-type"
        [class.live]="event.preEventOrLive === 'Live'"
        [class.bet-type--showcasing]="bt.hasXup && useXupThemeBg"
      >
        <span class="bet-type-infos">
          <hg-bet-type-infos-icon
            *ngIf="bt.hasExplanations"
            id="BetType_Info_Popin"
            [betTypeId]="bt.betTypeId"
            [betTypeContext]="bt.betTypeContext"
            [groupName]="bt.groupName"
          ></hg-bet-type-infos-icon>
          {{ bt.groupName }}
          <span *ngIf="bt.hasValidContext"> &nbsp;({{ bt.betTypeContext | hgBetTypeContext }}) </span>
        </span>

        <div *ngIf="!isBetBuilderToggled" class="bet-type__icons">
          <hg-bet-builder-icon
            *ngIf="bt.allowBetBuilder"
            id="Icon_BetBuilder"
            [accentColor]="true"
            [small]="true"
          ></hg-bet-builder-icon>
          <ng-container *ngIf="bt.xupValue as xup">
            <button type="button" [id]="'Icon_'+ xup + 'up'" (click)="openXupPopup(bt.betTypeContext)">
              <hg-inline-svg class="icon-up" [src]="'/assets/icon-' + xup + 'up.svg'"></hg-inline-svg>
            </button>
          </ng-container>

          <hg-inline-svg
            *ngIf="!isKiosk && bt.canBeSimulated"
            id="Icon_Simulate"
            class="icon-simulate"
            [src]="event.entryPointId === 101
            ? '/assets/icon-simulate-football.svg'
            : '/assets/icon-simulate.svg'"
          ></hg-inline-svg>

          <i
            id="Icon_Cashout"
            class="hg-cashout"
            *ngIf="!isKiosk && bt.canBeCashedout"
            (click)="openCashoutPopup(bt.betTypeId, bt.groupName)"
          ></i>
        </div>
        <hg-bet-builder-icon
          *ngIf="isBetBuilderToggled && bt.allowBetBuilder"
          [accentColor]="true"
        ></hg-bet-builder-icon>
      </div>
      <div #ebtiListContainer>
        <hg-event-bet-type-items-list
          *ngIf="!bt.usesTeamTemplate"
          [eventBetTypeGroupedByBetType]="bt"
          [event]="event"
          [noOdds]="isBetBuilderToggled"
          (toggleBetEvent)="toggleEventBetTypeItem($event.ebt, $event.item)"
        ></hg-event-bet-type-items-list>

        <hg-event-bet-type-items-by-team
          *ngIf="bt.usesTeamTemplate"
          [eventBetTypes]="teamGroupedItemsByBetType[bt.betTypeId]"
          [betTypeId]="bt.betTypeId"
          [event]="event"
          [noOdds]="isBetBuilderToggled"
          [isLoadingOdds]="isLoadingOdds"
          (toggleBetEvent)="toggleEventBetTypeItem($event.ebt, $event.item)"
        ></hg-event-bet-type-items-by-team>
      </div>
    </ng-container>
  </div>

  <div
    *ngIf="renderedGroups.length < enrichedGroups.length"
    hgIntersectionObserver
    (visible)="loadMore()"
    class="load-more-trigger"
  ></div>

  <hg-event-manual-odds-boosts
    *ngIf="hasManualOddsFeature && activeFilter === BetTypeGroup.None && !isBetBuilderToggled"
    class="group"
    [eventId]="eventId"
    [currentLanguage]="currentLanguage"
  ></hg-event-manual-odds-boosts>
</div>
