<div
  *ngIf="
    (topWinScope === TopWinScope.Retail && retailTopWinBets) || (topWinScope === TopWinScope.Online && onlineTopWinBets)
  "
  class="topwin top-bet"
>
  <div class="topwin__background">
    <div alt="Background top win bets"></div>
  </div>
  <div class="topwin__header">
    <span>{{ 'BET.LAST_BIG_WINNINGS' | i18n }}</span>
    <img src="assets/kn-top-win-bet-text.png" loading="lazy" alt="Top winner title" />
    <img
      *hgMediaIfNot="'md'"
      class="bi"
      loading="lazy"
      alt="Top winner title"
      src="assets/bi-top-win-bet-text-desktop.png"
    />
    <img
      *hgMediaIf="'md'"
      class="bi"
      loading="lazy"
      alt="Top winner title"
      src="assets/bi-top-win-bet-text-mobile.png"
    />
  </div>
  <div class="topwin__illustration" alt="man winning"></div>
  <div *ngIf="!isLoading; else loader" class="topwin__list">
    <button
      *ngFor="let bet of displayedTopWinBets; let index = index"
      type="button"
      class="item"
      [class.item--clickable]="bet.betSystem"
      (click)="bet.betSystem && select(bet)"
    >
      <div class="item__top">
        <hg-currency [value]="bet.paidAmount"></hg-currency>
        <div>
          <hg-bet-category-icon [betCategoryId]="bet.betCategoryId"></hg-bet-category-icon>
        </div>
      </div>
      <div class="item__bottom">
        <div class="item__bottom-amount">
          <div>
            <i class="hg-profile"></i>
            <img src="assets/medal-ribbon.png" alt="Top win coins" />
            <span>{{ index + 1 }}</span>
          </div>
          <span>{{ topWinScope === TopWinScope.Online ? bet.customerLogin : bet.ticketNumber }} </span>
        </div>

        <div>
          <div class="item__bottom-infos">
            <div>
              <span>{{ 'BET.LAST_BIG_WINNINGS_STAKE' | i18n }}</span>
              <span>
                <hg-currency [value]="bet.betSystem.totalStake"></hg-currency>
              </span>
            </div>
            <div *ngIf="bet.settledFixedOdds">
              <span>{{ 'BET.ODDS' | i18n }}</span>
              <span>{{ bet.settledFixedOdds | oddsFormat }}</span>
            </div>
          </div>
          <div class="item__bottom-infos" *ngIf="bet.multipleBonusCoefficient && bet.multipleBonusCoefficient > 0">
            <div>
              <span>{{ 'BET.LAST_BIG_WINNINGS_BONUS' | i18n }}</span>
              <span>+{{ bet.multipleBonusCoefficient }}%</span>
            </div>
          </div>
        </div>
      </div>
    </button>
  </div>
  <div *ngIf="displayScopeSelection" class="topwin__buttons">
    <button type="button" (click)="changeScope(TopWinScope.Online)" [class.active]="topWinScope === TopWinScope.Online">
      {{ 'TOP_WIN_BETS.SCOPE.ONLINE' | i18n }}
    </button>
    <button type="button" (click)="changeScope(TopWinScope.Retail)" [class.active]="topWinScope === TopWinScope.Retail">
      {{ 'TOP_WIN_BETS.SCOPE.RETAIL' | i18n }}
    </button>
  </div>
</div>

<hg-top-win-bets-popup *ngIf="displayPopup" [bet]="bet" (closeEvent)="closePopup()"></hg-top-win-bets-popup>

<ng-template #loader>
  <div class="topwin__loader">
    <hg-loader></hg-loader>
  </div>
</ng-template>
