<hg-event-categories *ngIf="event.categories" [categories]="event.categories"></hg-event-categories>

<div class="bets-content">
  <div class="event">
    <hg-incoming-event
      [event]="event"
      [showEntrypoint]="showEntrypoint"
      [showEntryPointName]="showEntryPointName"
      [isAboutToStart]="isAboutToStart"
      [isStreamed]="isStreamed"
      [flatMode]="true"
      [showTimer]="showTimer"
    ></hg-incoming-event>
  </div>

  <div class="bets">
    <div class="items">
      <hg-event-bet-type-item
        *ngFor="let item of eventBetType.eventBetTypeItems; trackBy: trackEventBetTypeItem"
        [ngClass]="'bet-type-' + eventBetType.betTypeId"
        [selected]="item.selected"
        [eventBetTypeItem]="item"
        [enableShortName]="true"
        [disabled]="!eventBetType.bettingAllowed || !item.bettingAllowed || item.completionDisabled || isLoadingOdds"
        [inactive]="!eventBetType.active || !item.active"
        (click)="toggleBet(item)"
      >
      </hg-event-bet-type-item>
    </div>
    <div class="more">
      <a *ngIf="event.preEventEventBetTypeCount > 1" [routerLink]="event | hgEventLink"
        >+{{ event.preEventEventBetTypeCount - 1 }} <i class="hg-arrow-right"></i
      ></a>
    </div>
  </div>

  <div class="unavailable-overlay" *ngIf="disabled" [@disabled]="true">
    <i class="hg-lock"></i> {{ 'EVENT.UNAVAILABLE' | i18n }}
  </div>
</div>
