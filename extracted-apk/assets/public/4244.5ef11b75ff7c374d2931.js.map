<hg-incoming-live-event-with-event-bet-type
  *ngFor="let event of events; trackBy: trackByFn"
  [event]="event"
  [eventBetType]="event.eventBetTypes?.[0]"
  (betSelectionChanged)="toggleEventBetTypeItem(event, event.eventBetTypes?.[0], $event)"
></hg-incoming-live-event-with-event-bet-type>

<span *ngIf="isLoaded && !events?.length">{{ 'LIVE.NO_NEXT_LIVE' | i18n }}</span>
