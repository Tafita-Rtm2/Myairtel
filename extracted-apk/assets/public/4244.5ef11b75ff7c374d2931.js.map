<div *ngIf="!fromTab" class="header">
  <i class="hg-megaphone"></i>
  <label>
    {{ 'MANUALODDSBOOSTS.OPERATOR_NAME' | i18n }}
  </label>
</div>

<div class="manual-odds-boosts-header" *ngIf="hasFunbetsInformation">
  <i class="hg-informations-italic"></i>
  <hg-raw-template [html]="funbetInfosContent" [css]="funbetInfosStyle"></hg-raw-template>
</div>

<ng-template #loading>
  <hg-loader></hg-loader>
</ng-template>

<div class="manual-odds-boosts" *ngIf="!isLoading; else loading">
  <div *ngIf="!manualOddsAndGroups || !manualOddsAndGroups.length" class="nodata">
    <img src="/assets/nodata.png" alt="nodata" />
    {{ 'MANUALODDSBOOSTS.NO_MANUALODDSBOOSTS' | i18n }}
  </div>

  <div class="menu" *ngIf="manualOddsAndGroups && manualOddsAndGroups.length">
    <button (click)="filter(FILTER_ALL)" [class.selected]="selectedFilter === FILTER_ALL">
      <i class="hg-all-games"></i>
      {{ 'MANUALODDS.FILTER.ALL' | i18n }} ({{ manualOddsAndGroups.length }})
    </button>
    <button
      *ngIf="matchCount > 0"
      (click)="filter(GROUP_TYPE_MATCH)"
      [class.selected]="selectedFilter === GROUP_TYPE_MATCH"
    >
      {{ 'MANUALODDS.FILTER.MATCH' | i18n }}
      <div class="count">
        {{ matchCount }}
      </div>
    </button>
    <button
      *ngIf="comboCount > 0"
      (click)="filter(GROUP_TYPE_COMBO)"
      [class.selected]="selectedFilter === GROUP_TYPE_COMBO"
    >
      {{ 'MANUALODDS.FILTER.COMBO' | i18n }}
      <div class="count">
        {{ comboCount }}
      </div>
    </button>
    <button
      *ngIf="competitionCount > 0"
      (click)="filter(GROUP_TYPE_COMPETITION)"
      [class.selected]="selectedFilter === GROUP_TYPE_COMPETITION"
    >
      {{ 'MANUALODDS.FILTER.COMPETITION' | i18n }}
      <div class="count">
        {{ competitionCount }}
      </div>
    </button>
  </div>

  <div class="manual-odds-list">
    <ng-container *ngFor="let entry of displayedManualOddsAndGroups" [ngSwitch]="entry.type">
      <div *ngSwitchCase="TYPE_STANDALONE">
        <hg-manual-odds [manualOdds]="entry.list[0]" [displayDate]="true"></hg-manual-odds>
      </div>
      <div *ngSwitchCase="TYPE_GROUP">
        <hg-manual-odds-group
          [title]="entry.groupTitle"
          [iconUrl]="entry.iconUrl"
          [entryPointId]="entry.entryPointId"
          [date]="entry.date"
          [headerLink]="entry.headerLink"
          [list]="entry.list"
        ></hg-manual-odds-group>
      </div>
    </ng-container>
  </div>
</div>
