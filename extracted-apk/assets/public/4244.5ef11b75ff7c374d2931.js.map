<div class="lmt-container" *ngIf="liveTrackerAvailable && sourceRef">
  <span
    class="activate"
    [class.active]="$any(activate).open"
    #activate
    (click)="$any(activate).open = !$any(activate).open"
  >
    <i class="hg-stadium"></i>
    <span>{{ 'LMT.MONITOR' | i18n }}</span>
    <i class="hg-arrow-down"></i>
  </span>
  <div>
    <hg-live-match-tracker
      (close)="$any(activate).open = false"
      *ngIf="
        $any(activate).open &&
        operatorConfiguration?.scoreWidgetConfiguration?.enabled &&
        operatorConfiguration?.scoreWidgetConfiguration?.type === ScoreWidgetType.Betradar
      "
      [sourceRef]="sourceRef"
      [brSubscriptionId]="brSubscriptionId"
    >
    </hg-live-match-tracker>
  </div>
</div>

<hg-popup [hideClose]="true" [bottom]="true" [opened]="betSlipActive">
  <ng-container *hgMediaIfNot="'md'">
    <hg-complete-my-bet-tutorial *ngIf="displayCompleteMyBetTutorial"></hg-complete-my-bet-tutorial>
  </ng-container>
  <hg-bet-slip
    [class.complete-my-bet-tutorial-opened]="displayCompleteMyBetTutorial"
    (close)="closeBetSlip()"
    [betValidatedTemplate]="betValidatedTemplate"
    (betCodeGenerated)="betCodeGenerated($event)"
    [freeBalance]="me?.freeBalance"
    [betSlipActive]="betSlipActive"
    [balance]="me?.balance"
    [hideBalance]="me?.hideBalance"
  ></hg-bet-slip>
  <ng-template
    #betValidatedTemplate
    let-context="context"
    let-close="close"
    let-getBetCode="getBetCode"
    let-isGettingBetCode="isGettingBetCode"
  >
    <hg-bet-validated
      [context]="context"
      (close)="close($event)"
      (getBetCode)="getBetCode($event)"
      [isGettingBetCode]="isGettingBetCode"
    ></hg-bet-validated>
  </ng-template>
</hg-popup>

<hg-bet-code-ticket-tabs *hgMediaIfNot="'md'"></hg-bet-code-ticket-tabs>

<ng-container *hgIfFeature="'TopWinBets'">
  <hg-top-win-bets *ngIf="!isKiosk && topWinBetsActivated"></hg-top-win-bets>
</ng-container>

<div [hidden]="!hasAtLeastOneBetLine">
  <ng-container *hgMediaIf="'md'">
    <hg-complete-my-bet-tutorial *ngIf="displayCompleteMyBetTutorial"></hg-complete-my-bet-tutorial>
  </ng-container>
  <hg-bet-slip-icon
    class="bet-slip"
    id="Mob_BetSlip_Shortcut"
    [ngClass]="{
      opened: betSlipActive,
      'complete-my-bet-tutorial-opened': displayCompleteMyBetTutorial
    }"
    (click)="openBetSlip()"
    (hasBetLines)="hasBetLines($event)"
  ></hg-bet-slip-icon>
</div>

<hg-anchor *ngIf="!isKiosk" anchor="sidebar-sport"></hg-anchor>

<hg-anchor *ngIf="!isKiosk" class="sport-sidebar" anchor="sport-sidebar" [multiple]="true"></hg-anchor>
