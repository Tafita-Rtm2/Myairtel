<div class="head">
  <ng-container *hgMediaIfNot="'md'">
    <ng-container *ngIf="!isInHomePage">
      <hg-entrypoint-icon [entryPointId]="sportId"></hg-entrypoint-icon>
      <hg-event-categories *ngIf="eventCategoriesNames" [categories]="eventCategoriesNames"></hg-event-categories>
    </ng-container>
    <hg-bet-types
      [betTypes]="betTypes"
      [selectedBetTypeId]="selectedBetType?.id"
      (betTypeSelected)="onBetTypeSelected($event)"
    ></hg-bet-types>
    <div class="odds-time-filter" *ngIf="!isInHomePage">
      <div class="odds">
        {{ 'BETSLIST.ODDS_FILTERS' | i18n }}

        <hg-odds-filter
          [selectedOddsFilter]="oddsFilter"
          (oddsFilterSelected)="onOddsFilterSelected($event)"
        ></hg-odds-filter>
      </div>
    </div>
  </ng-container>

  <ng-container>
    <ng-container *hgMediaIf="'md'">
      <div class="sport-name" *ngIf="!isInHomePage">
        <hg-entrypoint-icon [entryPointId]="sportId"></hg-entrypoint-icon>
        <hg-event-categories
          *ngIf="eventCategoriesNames &&!!eventCategoriesNames.length"
          [categories]="[eventCategoriesNames[0]]"
        ></hg-event-categories>
      </div>

      <div class="overlay" *ngIf="oddsFilterActive || eventCategoriesFilterActive" (click)="closeFilters()"></div>
      <div class="filters" *ngIf="!isInHomePage">
        <div class="odds-filter" [class.opened]="oddsFilterActive">
          <button id="Sports_Odds_Filter_Open" class="filter" (click)="toggleOddsFilter()">
            <div class="title">
              <ng-container *ngIf="!!oddsFilter; else allOddsTemplate">
                {{ 'ODDS_FILTERS.LABEL' | i18n }}&nbsp;&lt;&nbsp;{{ oddsFilter | oddsFormat }}
              </ng-container>

              <ng-template #allOddsTemplate> {{ 'ODDS_FILTERS.LABEL' | i18n }} </ng-template>
            </div>
            <i class="hg-arrow-down"></i>
          </button>

          <div class="panel" *ngIf="oddsFilterActive">
            <hg-odds-filter
              [selectedOddsFilter]="oddsFilter"
              (oddsFilterSelected)="onOddsFilterSelected($event)"
            ></hg-odds-filter>
          </div>
        </div>
        <div class="eventcategories-filter" [class.opened]="eventCategoriesFilterActive">
          <button id="Sports_EventsCategories_Filter_Open" class="filter" (click)="toggleEventCategoriesFilter()">
            <div class="title">{{ "EVENTCATEGORIES_FILTERS.LABEL" | i18n }}</div>
            <span class="counter" *ngIf="eventCategoriesSelectionCount">{{eventCategoriesSelectionCount}}</span>
            <i class="hg-arrow-down"></i>
          </button>

          <div class="panel" *ngIf="eventCategoriesFilterActive">
            <hg-event-categories-filter
              [entryPointId]="sportId"
              [selectedEventCategoriesIds]="eventCategoriesIds"
              (filterChanged)="onEventCategoriesFilterChanges($event)"
            ></hg-event-categories-filter>
          </div>
        </div>
      </div>

      <div class="bettypes-filter">
        <hg-bet-types
          [betTypes]="betTypes"
          [selectedBetTypeId]="selectedBetType?.id"
          (betTypeSelected)="onBetTypeSelected($event)"
        ></hg-bet-types>
      </div>
    </ng-container>
  </ng-container>
</div>

<div class="block" [class.kiosk]="isKiosk">
  <ng-container *ngIf="!loading">
    <ng-container *ngIf="events.length > 0">
      <hg-event-with-event-bet-type
        *ngFor="let item of events; trackBy: trackEventBetType"
        id="Event_Item_{{item.id}}"
        class="block-item"
        [class.on-home-page]="isInHomePage"
        [event]="item"
        [eventBetType]="item.eventBetTypes[0]"
        [isLoadingOdds]="!!isLoadingOddsEventIds.length"
        (betSelectionChanged)="toggleEventBetTypeItem(item, item.eventBetTypes[0], $event)"
      ></hg-event-with-event-bet-type>
    </ng-container>

    <ng-container *ngIf="isInHomePage">
      <ng-container *hgIfFeature="'TopWinBets'">
        <ng-container *ngIf="!isKiosk && topWinBetsActivated && displayTopWins">
          <hg-top-win-bets *hgDeferOnVisible="null;placeHolderClass: 'top-win-bets-placeholder'"></hg-top-win-bets>
        </ng-container>
      </ng-container>
    </ng-container>

    <div class="nodata" *ngIf="!loading && (!events || !events.length)">
      <img src="/assets/nodata.png" alt="nodata" />
      {{'BETSLIST.NO_EVENT' | i18n}}
    </div>
  </ng-container>

  <hg-loader *ngIf="loading"></hg-loader>
</div>

<footer *ngIf="!loading && hasMore">
  <button #loadMoreButton *ngIf="!loadingMore" type="button" (click)="loadOrderedEvents(true)">
    {{'SEARCH.SHOW_MORE' | i18n}}
  </button>
  <hg-loader *ngIf="loadingMore"></hg-loader>
</footer>
