<header>
  <h2><i class="hg-search"></i>{{'SEARCH.SEARCH_RESULT' | i18n}}</h2>
</header>

<ng-container *ngIf="!loading && (events && events.length !== 0)">
  <div class="items">
    <hg-event-with-event-bet-type
      *ngFor="let item of events; trackBy: trackMatch"
      [event]="item"
      [eventBetType]="item.eventBetTypes[0]"
      [showEntrypoint]="true"
      [isLoadingOdds]="!!isLoadingOddsEventIds.length"
      (betSelectionChanged)="onBetSelectionChanged(item, $event)"
    >
    </hg-event-with-event-bet-type>
  </div>
</ng-container>

<p class="nodata" *ngIf="!loading && (!events || events.length === 0)">
  <img src="/assets/nodata.png" alt="nodata" />
  <span>{{'SEARCH.NORESULT' | i18n}}</span>
</p>

<footer>
  <hg-loader *ngIf="loading"></hg-loader>
  <span *ngIf="!loading && hasMore" (click)="loadSearchResult()">{{'SEARCH.SHOW_MORE' | i18n}}</span>
</footer>
