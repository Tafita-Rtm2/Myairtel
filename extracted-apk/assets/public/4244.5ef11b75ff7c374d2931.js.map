<span class="banner-glow" aria-hidden="true">
  <span
    class="banner-glow__particle"
    *ngFor="let particle of trailParticles; trackBy: particleTrackByIndex"
    [style.animation-delay.s]="particle.animationDelay"
    [style.opacity]="particle.opacity"
  ></span>
</span>

<button type="button" class="banner" (click)="onClick()">
  <img class="banner__icon" src="assets/smartico/mission.png" aria-hidden="true" />

  <span class="banner__label">
    {{ 'SMARTICO.AVAILABLE_MISSIONS' | i18n }}
  </span>

  <span class="banner__counter" *ngIf="missionsCount$ | async as missionsCount">{{ missionsCount }}</span>

  <span class="banner__spacer"></span>

  <i class="hg-full-right-arrow banner__arrow" aria-hidden="true"></i>
</button>
