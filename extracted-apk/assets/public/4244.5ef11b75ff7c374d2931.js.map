<div class="sections">
  <div *ngIf="topEventCategories" class="section" [class.opened]="topEventCategoriesActive">
    <button id="Sports_EventsCategories_Filter_Open" class="filter" (click)="toggleTopEventCategories()">
      <span class="name">{{ 'MENU.TOP5' | i18n }}</span>
      <span class="counter" *ngIf="topEventCategoriesSelectionNumber">{{ topEventCategoriesSelectionNumber }}</span>
      <span class="total">{{ topEventCategories.length }}</span>
      <i class="hg-arrow-down"></i>
    </button>
    <div class="elements">
      <label *ngFor="let eventCategory of topEventCategories" id="Sports_EventsCategories_Filter_Competition">
        <input
          type="checkbox"
          [ngModel]="eventCategory.isChecked"
          (ngModelChange)="toggleEventCategorySelection(eventCategory)"
        /><span>{{ eventCategory.name }}</span>
      </label>
    </div>
  </div>

  <div class="section" *ngFor="let eventCategory of eventCategories" [class.opened]="eventCategory.opened">
    <button id="Sports_EventsCategories_Filter_Open" class="filter" (click)="toggleEventCategoryOpened(eventCategory)">
      <span class="name">{{ eventCategory.name }}</span>
      <span class="counter" *ngIf="eventCategory.selectionNumber">{{ eventCategory.selectionNumber }}</span>
      <span class="total">{{ eventCategory.subCategories.length }}</span>
      <i class="hg-arrow-down"></i>
    </button>
    <div class="elements">
      <label *ngFor="let subEventCategory of eventCategory.subCategories">
        <input
          type="checkbox"
          [ngModel]="subEventCategory.isChecked"
          (ngModelChange)="toggleEventCategorySelection(subEventCategory)"
        />
        <span>{{ subEventCategory.name }}</span>
      </label>
    </div>
  </div>

  <button
    id="Sports_EventsCategories_Filter_ShowMore"
    class="link-button"
    *ngIf="!showAllEventCategories"
    (click)="showMore()"
  >
    {{ 'EVENTCATEGORIES_FILTERS.FILTER_MORE' | i18n }}
  </button>

  <ng-container *ngIf="showAllEventCategories">
    <div class="section" *ngFor="let eventCategory of moreEventCategories" [class.opened]="eventCategory.opened">
      <button class="filter" (click)="toggleEventCategoryOpened(eventCategory)">
        <span class="name">{{ eventCategory.name }}</span>
        <span class="counter" *ngIf="eventCategory.selectionNumber">{{ eventCategory.selectionNumber }}</span>
        <span class="total">{{ eventCategory.subCategories.length }}</span>
        <i class="hg-arrow-down"></i>
      </button>
      <div class="elements">
        <label *ngFor="let subEventCategory of eventCategory.subCategories">
          <input
            type="checkbox"
            [ngModel]="subEventCategory.isChecked"
            (ngModelChange)="toggleEventCategorySelection(subEventCategory)"
          />
          <span>{{ subEventCategory.name }}</span>
        </label>
      </div>
    </div>
  </ng-container>
</div>

<div class="actions">
  <button id="Sports_EventsCategories_Filter_Reset" class="button cancel" (click)="cancel()">
    {{ 'EVENTCATEGORIES_FILTERS.CANCEL' | i18n }}
  </button>
  <button id="Sports_EventsCategories_Filter_Apply" class="button apply" (click)="apply()">
    {{ 'EVENTCATEGORIES_FILTERS.APPLY' | i18n }}
  </button>
</div>
