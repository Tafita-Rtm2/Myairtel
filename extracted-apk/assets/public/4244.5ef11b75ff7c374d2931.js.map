<div class="manual-odds-as-event-bet-type" *ngIf="manualOddsBoosts.length">
  <div class="bet-type">
    <span class="bet-type-infos">{{ 'MANUALODDSBOOSTS.OPERATOR_NAME' | i18n }}</span>
  </div>

  <div class="manual-padding">
    <hg-manual-odds-content
      *ngFor="
        let mob of manualOddsBoosts | slice : 0 : (showMore ? manualOddsBoosts.length : 3);
        let last = last;
        let i = index
      "
      [manualOdds]="mob"
      [displayDate]="false"
    ></hg-manual-odds-content>
    <button class="manual-odds" *ngIf="hasOverflow" (click)="toggleShowMore()">
      <i class="hg-arrow-down" [class.up]="showMore"></i>
    </button>
  </div>
</div>
