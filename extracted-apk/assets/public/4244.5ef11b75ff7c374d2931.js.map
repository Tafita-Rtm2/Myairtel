<div class="filters">
  <div
    class="filter-item-container"
    #filterContainer
    (mousedown)="onFilterDragStart($event)"
    (mousemove)="onFilterDrag($event)"
    (mouseup)="onFilterDragEnd()"
    (mouseleave)="onFilterDragEnd()"
  >
    <hg-bet-builder-filter
      *ngIf="event?.allowBetBuilder"
      [isBetBuilderToggled]="isBetBuilderToggled"
      [hasNew]="true"
      (betBuilderToggled)="toggleBetBuilder($event)"
    ></hg-bet-builder-filter>
    <ng-container *ngFor="let filter of filters">
      <div
        *ngIf="filter"
        class="event-filter-item"
        id="Event_BetType_Filter"
        (click)="toggleFilter(filter)"
        [class.selected]="activeFilterSet[filter]"
        [class.has-new]="filter === 'PlayerStats' && hasNewPlayerStatsBetType"
      >
        <span>
          {{ 'EVENT.GROUP.' + filter + '.' + entryPointId + '|EVENT.GROUP.' + filter | i18n }}
        </span>
      </div>
    </ng-container>
  </div>
</div>
