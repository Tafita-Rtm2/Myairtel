<div
  *ngIf="!isKiosk"
  class="banners {{ elementsOrder ? 'order--' + elementsOrder.indexOf('banners') : '' }}"
  [class.banner--mb]="!isHomePage"
>
  <hg-anchor anchor="banner"></hg-anchor>
</div>

<ng-container *ngIf="!isLoading && !isKiosk && isHomePage">
  <hg-shortcuts
    id="Mob_Sports_Shortcuts"
    *hgMediaIf="'md'"
    class="{{ elementsOrder ? 'order--' + elementsOrder.indexOf('shortcuts') : '' }}"
  ></hg-shortcuts>
</ng-container>

<ng-container *hgMediaIf="'md'">
  <hg-top-win-bets
    *ngIf="displayTopWins"
    class="{{ elementsOrder ? 'order--' + elementsOrder.indexOf('top-wins') : '' }}"
  ></hg-top-win-bets>
</ng-container>

<hg-top-matchs-games
  class="{{ elementsOrder ? 'order--' + elementsOrder.indexOf('top-matchs') : '' }}"
></hg-top-matchs-games>

<hg-top-combos
  *hgIfFeature="'TopCombos'"
  class="{{ elementsOrder ? 'order--' + elementsOrder.indexOf('top-combos') : '' }}"
></hg-top-combos>

<ng-container *hgMediaIf="'md'">
  <hg-smartico-missions-banner
    *ngIf="displayMissionsBanner"
    class="{{ elementsOrder ? 'order--' + elementsOrder.indexOf('missions-banner') : '' }}"
  ></hg-smartico-missions-banner>
</ng-container>

<div class="events" *ngIf="!!activeEntryPoint">
  <div
    class="events-tab"
    [class.last-nav]="currentTab && lastEventTabType === currentTab.type"
    [class.first-nav]="currentTab && currentTab.type === firstEventTabType"
  >
    <ng-container *ngFor="let eventTab of eventTabsList; let index = index">
      <div
        [class.active]="currentTab && eventTab.type === currentTab.type"
        [class.live]="currentTab && eventTab.type === EventTabTypes.Live && currentTab.type !== lastEventTabType"
        [class.oddsBoost]="eventTab.type === EventTabTypes.OddsBoost"
        [id]="'EventTab_' + (eventTab.type | titlecase)"
        (click)="setTab(eventTab)"
        (keyup.enter)="currentTab = eventTab"
        (click)="clickOnTab(eventTab, index)"
      >
        <i *ngIf="!!eventTab.icon" [class]="'hg-' + eventTab.icon"></i>{{ eventTab.text | i18n }}
      </div>
    </ng-container>
  </div>

  <div *ngIf="currentTab" class="events-tab-contents" [ngSwitch]="currentTab.type">
    <ng-container *ngSwitchCase="EventTabTypes.Upcoming">
      <div class="entrypoints">
        <ng-container *ngFor="let entryPoint of entryPoints; trackByFn">
          <div
            id="Events_Filter_Entrypoint"
            class="entrypoints-available"
            [class.active]="activeEntryPoint === entryPoint.id"
          >
            <hg-entrypoint-icon [entryPointId]="entryPoint.id"></hg-entrypoint-icon>
            <button type="button" class="item" (click)="clickOnEntryPoint(entryPoint.id)">{{ entryPoint.name }}</button>
          </div>
        </ng-container>
      </div>

      <hg-events-by-event-category
        [sportId]="activeEntryPoint"
        [isInHomePage]="true"
        [orderByPopularEvents]="true"
        [topWinBetsActivated]="topWinBetsActivated"
      ></hg-events-by-event-category>
    </ng-container>

    <ng-container *ngSwitchCase="EventTabTypes.Live">
      <hg-bets-home-live [isHomePage]="true"></hg-bets-home-live>
    </ng-container>

    <ng-container *ngSwitchCase="EventTabTypes.OddsBoost">
      <hg-odds-boosts></hg-odds-boosts>
    </ng-container>
    <ng-container *ngSwitchCase="EventTabTypes.ManualOdds">
      <hg-manual-odds-boosts [fromTab]="true"></hg-manual-odds-boosts>
    </ng-container>
  </div>
  <hg-loader *ngIf="isLoading"></hg-loader>
</div>
