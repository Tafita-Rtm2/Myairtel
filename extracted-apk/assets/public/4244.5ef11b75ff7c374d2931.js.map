<div class="banners">
  <hg-anchor anchor="banner-live"></hg-anchor>
</div>

<div class="tabs" [class.show-before-after]="!isHomePage" *ngIf="entryPoints.length">
  <h1 *ngIf="!isHomePage"><i class="hg-live"></i> {{ 'NAV.LIVE' | i18n }}</h1>
  <div class="gradient" *ngIf="!isHomePage"></div>
  <div class="categories">
    <div class="available" [class.active]="!selectedEntryPoint" (click)="changeEntryPoint()">
      <i class="hg-all-games" [class.active]="!selectedEntryPoint"></i>
      <span class="name" [class.on-live]="!isHomePage"
        >{{ 'LIVE.ALL_LIVES' | i18n }}&nbsp;({{ totalLivesCounter }})</span
      >
    </div>
    <div
      *ngFor="let entryPoint of entryPoints"
      class="entrypoint"
      [class.active]="selectedEntryPoint === entryPoint.category.id"
      [class.available]="entryPoint.liveCount"
      (click)="entryPoint.liveCount && changeEntryPoint(entryPoint.category.id)"
    >
      <i [class.active]="selectedEntryPoint === entryPoint.category.id">
        <hg-inline-svg *ngIf="entryPoint.category.iconUrl" [src]="entryPoint.category.iconUrl"></hg-inline-svg>
      </i>
      <span class="name" [class.on-live]="!isHomePage">{{ entryPoint.category.name }}</span>
      <span class="now" *ngIf="entryPoint.liveCount">{{ entryPoint.liveCount }}</span>
    </div>
  </div>
</div>

<hg-loader *ngIf="loadingEvents"></hg-loader>
<div class="content" [class.on-home]="isHomePage">
  <div
    class="nodata"
    *ngIf="
      !loadingEvents && (!liveDisplayedEventsWithEventBetTypes || liveDisplayedEventsWithEventBetTypes.length === 0)
    "
  >
    <span>{{ 'LIVE.NO_LIVE' | i18n }}</span>
  </div>

  <div class="group" *ngFor="let group of liveDisplayedEventsWithEventBetTypes">
    <div class="categories">
      <span *ngFor="let category of group.categories; let first = first">
        {{ category }}
        <ng-container *ngIf="!first">&nbsp;-&nbsp;</ng-container>
      </span>
    </div>

    <hg-live-event-with-event-bet-type-item
      *ngFor="let event of group.events; trackBy: trackByFn"
      [event]="event"
      [eventBetType]="event.eventBetTypes?.[0]"
      [isLoadingOdds]="!!isLoadingOddsEventIds.length"
      (betSelectionChanged)="toggleEventBetTypeItem(event, event.eventBetTypes?.[0], $event)"
    ></hg-live-event-with-event-bet-type-item>
  </div>

  <span class="title">{{ 'LIVE.TOCOME' | i18n }}</span>
  <hg-loader class="next" *ngIf="loadingNextEvents"></hg-loader>
  <ng-container *ngIf="hasLoadedEvents">
    <hg-next-live *hgDeferOnVisible (loaded)="showNextLives()" [entryPointId]="selectedEntryPoint"></hg-next-live>
  </ng-container>
</div>
