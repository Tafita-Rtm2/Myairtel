<hg-manual-odds-border>
  <div class="container">
    <div class="header" (click)="navigateToEvent()" [class.link]="headerLink">
      <div class="icon-container">
        <hg-entrypoint-icon *ngIf="entryPointId" [entryPointId]="entryPointId"></hg-entrypoint-icon>
        <img
          *ngIf="!entryPointId && iconUrl"
          [src]="iconUrl"
          alt=""
          width="18"
          height="18"
          onerror="this.style.display='none';"
        />
        <i *ngIf="!entryPointId && !iconUrl" class="hg-megaphone"></i>
      </div>
      <label class="title">{{ title }}</label>
      <div class="date">
        <div>{{ date | hgTime }}</div>
        <div>{{ date | hgLongDate }}</div>
      </div>
    </div>
    <div class="list">
      <div class="manual-odds" *ngFor="let manualOdds of displayedList">
        <hg-manual-odds-content [manualOdds]="manualOdds" [displayDate]="false"></hg-manual-odds-content>
      </div>
    </div>
    <div class="footer">
      <button (click)="displayAll()" *ngIf="list.length > defaultMaxDisplayed">
        <ng-container *ngIf="hiddenCount > 0">
          {{ '+ ' + hiddenCount }}
          <i class="hg-arrow-down"></i>
        </ng-container>
        <ng-container *ngIf="hiddenCount <= 0">
          <i class="hg-arrow-down reverse"></i>
        </ng-container>
      </button>
    </div>
  </div>
</hg-manual-odds-border>
