<button id="Event_Banner" class="event-banner" (click)="handleClickOnBanner()">
  <ng-container *hgMediaIfNot="'xs'">
    <img
      *ngIf="bannerImages.desktop?.url"
      [src]="bannerImages.desktop.url"
      alt="event-banner-img-desktop"
      class="event-banner__desktop"
    />
  </ng-container>
  <ng-container *hgMediaIf="'xs'">
    <img
      *ngIf="bannerImages.mobile?.url"
      [src]="bannerImages.mobile.url"
      alt="event-banner-img-mobile"
      class="event-banner__mobile"
    />
  </ng-container>
</button>
