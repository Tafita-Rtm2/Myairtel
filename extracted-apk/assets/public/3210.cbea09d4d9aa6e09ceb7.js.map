<ng-container *ngIf="currentTutorialStep">
  <div class="step">
    <div class="step__image">
      <img [attr.src]="currentTutorialStep.img" alt="Step illustration" />
    </div>

    <div class="step__infos">
      <div class="step__infos-title">
        <span>{{ currentTutorialStep.title | i18n }}</span>
      </div>
      <div class="step__infos-text" [innerHTML]="currentTutorialStep.text | i18n"></div>
    </div>
  </div>

  <div class="footer">
    <hg-bullets
      [bulletsCount]="steps.length"
      [currentIndex]="currentStepNumber"
      (selectionChange)="goToStep($event)"
    ></hg-bullets>

    <div class="footer__buttons">
      <button *ngIf="!isFirstStep" type="button" (click)="goToStep(currentStepNumber - 1)">
        {{ 'TUTORIALS.LABEL.PREVIOUS' | i18n }}
      </button>

      <button type="button" [class.bold]="isLastStep" (click)="goToStep(currentStepNumber + 1)">
        {{ (isLastStep ? 'TUTORIALS.LABEL.LETSGO' : 'TUTORIALS.LABEL.NEXT') | i18n }}
      </button>
    </div>
  </div>
</ng-container>
