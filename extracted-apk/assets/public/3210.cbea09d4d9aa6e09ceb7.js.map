<div class="results__title">
  <i class="hg-result"></i>
  <span>{{ 'MENU.RESULTS' | i18n }}</span>
</div>

<div class="results__container">
  <hg-loader *ngIf="isLoading"></hg-loader>
  <div *ngIf="isLoading" class="results__loading">
    <hg-loader></hg-loader>
  </div>

  <ng-container *ngIf="!isLoading!; error">
    <div id="Sportspool_OngoingGrids_Container" class="results__list">
      <div class="results__list-title">
        <i class="hg-chrono"></i>
        <span>{{ 'EVENT.PERIOD.InProgress' | i18n }}</span>
      </div>

      <div class="results__list-items">
        <ng-container *ngIf="currentEvents && currentEvents.length > 0; else noData"></ng-container>
        <hg-sports-pool-game-result
          *ngFor="let event of currentEvents"
          [id]="'Sportspool_Result_' + event.id"
          [gameResult]="event"
        ></hg-sports-pool-game-result>
      </div>
    </div>

    <div id="Sportspool_FinishedGrids_Container" class="results__list">
      <div class="results__list-title">
        <span>{{ 'SPORTS_POOL.LABEL.PREVIOUS_GRID' | i18n }}</span>
      </div>

      <div class="results__list-items">
        <ng-container *ngIf="previousEvents && previousEvents.length > 0; else noData"></ng-container>
        <hg-sports-pool-game-result
          *ngFor="let event of previousEvents"
          [id]="'Sportspool_Result_' + event.id"
          [gameResult]="event"
        ></hg-sports-pool-game-result>
      </div>
    </div>
  </ng-container>
</div>

<div *ngIf="hasMore && !isLoadingMore && !isLoading" class="results__button">
  <button type="button" (click)="loadMore()">{{ 'SEARCH.SHOW_MORE' | i18n }}</button>
</div>

<div *ngIf="isLoadingMore">
  <hg-loader></hg-loader>
</div>

<ng-template #noData>
  <span>{{ 'BETSLIST.NO_EVENT' | i18n }}</span>
</ng-template>
