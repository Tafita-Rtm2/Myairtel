<hg-popup [hideClose]="true" [bottom]="true" [opened]="betSlipActive">
  <hg-bet-slip
    (close)="closeBetSlip()"
    [betValidatedTemplate]="betValidatedTemplate"
    [allowedToCopyLastBetSlipSelection]="false"
  ></hg-bet-slip>
  <ng-template #betValidatedTemplate let-context="context" let-close="close">
    <hg-bet-validated [context]="context" (close)="close($event)"></hg-bet-validated>
  </ng-template>
</hg-popup>

<hg-bet-slip-icon
  class="bet-slip"
  [class.opened]="betSlipActive"
  [class.show]="hasAtLeastOneBetLine"
  [class.higher]="isBetSlipHigher"
  (click)="openBetSlip()"
  (hasBetLines)="hasBetLines($event)"
  id="Sportspool_Betslip_Mobile"
></hg-bet-slip-icon>

<router-outlet name="bottomsidebaroutlet"></router-outlet>
