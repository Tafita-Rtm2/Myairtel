<div *ngIf="entryPoints" class="entrypoints">
  <!-- Dynamic entry points -->
  <ng-container *ngFor="let entryPoint of entryPoints">
    <a
      class="item"
      [routerLink]="['/sports-pool']"
      [routerLinkActive]="'is-active'"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <hg-entrypoint-icon [entryPointId]="entryPoint.id"></hg-entrypoint-icon>
      <span>{{ entryPoint.name }}</span>
      <i class="hg-full-right-arrow"></i>
    </a>
  </ng-container>

  <!-- Results -->
  <a class="item" [routerLink]="['/sports-pool/results']" [routerLinkActive]="'is-active'">
    <i class="hg-result"></i>
    <span>{{ 'MENU.RESULTS' | i18n }}</span>
    <i class="hg-full-right-arrow"></i>
  </a>

  <!-- Rules -->
  <a class="item" [routerLink]="['/sports-pool/rules']" [routerLinkActive]="'is-active'">
    <i class="hg-infos"></i>
    <span>{{ 'ABOUT.RULES' | i18n }}</span>
    <i class="hg-full-right-arrow"></i>
  </a>
</div>
