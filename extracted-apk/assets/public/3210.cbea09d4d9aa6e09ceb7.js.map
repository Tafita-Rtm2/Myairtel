<hg-three-columns-layout>
  <ng-container left>
    <hg-sports-pool-ui-desktop-event-categories-navigation *hgMediaIfNot="'md'; ssr: true">
    </hg-sports-pool-ui-desktop-event-categories-navigation>
  </ng-container>

  <ng-container center>
    <router-outlet *ngIf="!isServer; else placeholder"></router-outlet>
    <ng-template #placeholder
      ><div class="placeholder"><hg-loader></hg-loader></div
    ></ng-template>
  </ng-container>

  <ng-container right>
    <hg-sports-pool-sidebar></hg-sports-pool-sidebar>
  </ng-container>
</hg-three-columns-layout>
