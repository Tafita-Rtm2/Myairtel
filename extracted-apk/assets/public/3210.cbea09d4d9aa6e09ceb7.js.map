<a [routerLink]="['/sports-pool/results', gameResult?.id]" class="result">
  <div class="result__informations">
    <div class="result__informations-top">
      <div class="informations__template">
        <span id="Title">{{ gameResult?.detailsName }}</span>
      </div>
      <span><hg-currency id="Jackpot_Amount" class="value" [value]="gameResult?.poolAmount"></hg-currency></span>
    </div>
    <div class="result__informations-bottom">
      <span id="Name">{{ gameResult?.name }}</span>
      <span id="Date"> - {{ gameResult?.expectedStart | hgShortDate }}</span>
      <span id="Template"> - {{ 'SPORTS_POOL.LABEL.GRID_OF' | i18n }} {{ gameResult?.matchCount }}</span>
    </div>
    <div *ngIf="gameResult.winnersCount > 0" class="result__informations-winners">
      <span
        >{{ gameResult.winnersCount | hgNumber }} {{ 'SPORTS_POOL.LABEL.WINNERS' | i18n }} -
        <hg-currency class="value" [value]="gameResult.totalWinnings"></hg-currency
      ></span>
    </div>
  </div>
  <div class="result__button">
    <i class="hg-full-right-arrow"></i>
  </div>
  <i class="hg-sports-pool result__background"></i>
  <div *ngIf="gameResult.hasOnGoingGame" id="Grid_Result_Live" class="result__live"></div>
</a>
