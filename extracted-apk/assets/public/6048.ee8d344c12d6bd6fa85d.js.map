<hg-loader *ngIf="loading"></hg-loader>

<div class="nodata" *ngIf="!loading && error">
  <ng-container *ngIf="isEventPage">
    <i class="hg-cross"></i>
    {{ 'EVENT.DRAW_GAMES.NO_BETS' | i18n }}
  </ng-container>
  <ng-container *ngIf="!isEventPage">
    <img src="/assets/nodata.png" alt="nodata" />
    {{ 'DRAWGAMES.NO_EVENTS' | i18n }}
  </ng-container>
</div>

<div class="current-game" *ngIf="drawGame && !loading && !error">
  <span>
    <span id="DrawGame_Name">{{ drawGame.name }}</span> -
    <span id="DrawGame_Time">{{ drawGame.expectedStart | hgTime }}</span></span
  >
  <div id="DrawGame_Type" *ngIf="drawGame.drawGameRule.maxBaseNumber <= 100" class="draw-game-type">
    {{ drawGame.drawGameRule.drawnBaseNumberCount }} / {{ drawGame.drawGameRule.maxBaseNumber }}
  </div>
  <button class="replay-event" *ngIf="canReplayEvent" (click)="replayEvent()" id="DrawGame_Replay">
    <i class="hg-rebet"></i>
  </button>
</div>

<div class="content">
  <button class="replay" *ngIf="!drawGame && !loading && canReplay" (click)="replay()">
    <i class="hg-rebet"></i>
    <label>{{ 'DRAW_GAMES.REPLAYLASTSELECTION' | i18n }}</label>
  </button>

  <hg-draw-game-default
    *ngIf="drawGame && drawGame.drawGameRule.maxBaseNumber <= 100"
    [event]="drawGame"
    [loading]="loading"
    [error]="error"
  >
  </hg-draw-game-default>

  <hg-borlette
    *ngIf="(isEmptyBorlette || (drawGame && drawGame.drawGameRule.maxBaseNumber > 100)) && !loading && !error"
    [drawGame]="drawGame"
    [drawGames]="drawGames"
    [displayPointe]="displayPointe"
    [displayRaleBoule]="displayRaleBoule"
  ></hg-borlette>
</div>

<div class="rules" *ngIf="ruleTypeContent">
  <div class="toggle-rules" (click)="toggleRules = !toggleRules">
    <span>
      {{ 'ABOUT.RULES' | i18n }}
    </span>
    <i class="hg-arrow-down" [class.arrow-rotate]="toggleRules"></i>
  </div>

  <div class="toggled-rules" *ngIf="toggleRules">
    <hg-raw-template [html]="ruleTypeContent" [css]="ruleTypeStyle"></hg-raw-template>
  </div>
</div>
