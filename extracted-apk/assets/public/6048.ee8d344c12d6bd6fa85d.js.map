<div
  class="item-container"
  [ngClass]="{
    modal: modal,
    mariage: selectedDrawGame.betTypeId === DrawGameBorletteBetType.Mariage,
    options: selectedDrawGame.betTypeId === DrawGameBorletteBetType.Loto4
  }"
>
  <div class="item">
    <div class="inputs-container">
      <input
        *ngIf="
          selectedDrawGame.betTypeId !== DrawGameBorletteBetType.Mariage &&
          selectedDrawGame.betTypeId !== DrawGameBorletteBetType.Loto6
        "
        id="Input_Number"
        type="number"
        class="input-number"
        (input)="updateNumber($event)"
        [(ngModel)]="selection[index].number"
        [placeholder]="'DRAW_GAMES.NUMBER' | i18n"
        [disabled]="modal"
        numbersOnly
        [attr.maxlength]="padLength"
      />

      <div *ngIf="selectedDrawGame.betTypeId === DrawGameBorletteBetType.Loto6" id="Loto6_Selection_Container">
        <input
          type="number"
          class="input-number very-small"
          id="Input_Number"
          (input)="updateNumbers($event, 'first')"
          [(ngModel)]="selection[index].numbers.first"
          [placeholder]="'DRAW_GAMES.NUMBER' | i18n"
          [disabled]="modal"
          numbersOnly
          [attr.maxlength]="padLength"
        />
        <input
          type="number"
          class="input-number very-small"
          id="Input_Number"
          (input)="updateNumbers($event, 'second')"
          [(ngModel)]="selection[index].numbers.second"
          [placeholder]="'DRAW_GAMES.NUMBER' | i18n"
          [disabled]="modal"
          numbersOnly
          [attr.maxlength]="padLength"
        />
        <input
          type="number"
          class="input-number very-small"
          id="Input_Number"
          (input)="updateNumbers($event, 'third')"
          [(ngModel)]="selection[index].numbers.third"
          [placeholder]="'DRAW_GAMES.NUMBER' | i18n"
          [disabled]="modal"
          numbersOnly
          [attr.maxlength]="padLength"
        />
      </div>

      <div
        *ngIf="selectedDrawGame.betTypeId === DrawGameBorletteBetType.Mariage"
        class="inputs-number-container"
        id="Mariage_Selection_Container"
      >
        <input
          type="number"
          class="input-number small"
          (input)="updateNumbers($event, 'first')"
          id="Input_Number_Mariage_1"
          [(ngModel)]="selection[index].numbers.first"
          [placeholder]="'DRAW_GAMES.NUMBER' | i18n"
          [disabled]="modal"
          numbersOnly
          [attr.maxlength]="padLength"
        />
        <span>x</span>
        <input
          type="number"
          class="input-number small"
          id="Input_Number_Mariage_2"
          (input)="updateNumbers($event, 'second')"
          [(ngModel)]="selection[index].numbers.second"
          [placeholder]="'DRAW_GAMES.NUMBER' | i18n"
          [disabled]="modal"
          numbersOnly
          [attr.maxlength]="padLength"
        />
      </div>

      <div
        *ngIf="
          selectedDrawGame.betTypeId !== DrawGameBorletteBetType.Loto4 &&
          selectedDrawGame.betTypeId !== DrawGameBorletteBetType.Loto5
        "
        class="input-stake-control"
        [class.error]="selection[index].error.stake"
      >
        <button type="button" (click)="decrementStakeEvent.emit(); focusEvent.emit()">-</button>
        <input
          id="Option1_Stake"
          type="number"
          (input)="changeStakeEvent.emit(selection[index].stake)"
          (focus)="focusEvent.emit()"
          [(ngModel)]="selection[index].stake"
          [placeholder]="'DRAW_GAMES.STAKE' | i18n"
          numbersOnly
        />
        <button type="button" (click)="incrementStakeEvent.emit(); focusEvent.emit()">+</button>
      </div>

      <div
        *ngIf="
          selectedDrawGame.betTypeId === DrawGameBorletteBetType.Loto4 ||
          selectedDrawGame.betTypeId === DrawGameBorletteBetType.Loto5
        "
        class="input-options-control"
      >
        <div class="input-options-item" [class.selected]="selection[index].options['1'].selected">
          <span>{{ 'DRAW_GAMES.OPTION' | i18n }} 1</span>
          <div class="input-stake-control" [class.error]="selection[index].options['1'].error">
            <button type="button" (click)="decrementStakeOptionsEvent.emit('1'); focusEvent.emit()">-</button>
            <input
              id="Option2_Stake"
              type="number"
              (input)="
                changeStakeOptionsEvent.emit({
                  optionsIndex: '1',
                  value: selection[index].options['1'].stake
                })
              "
              (focus)="focusEvent.emit()"
              [(ngModel)]="selection[index].options['1'].stake"
              [placeholder]="'DRAW_GAMES.STAKE' | i18n"
              numbersOnly
            />
            <button type="button" (click)="incrementStakeOptionsEvent.emit('1'); focusEvent.emit()">+</button>
          </div>
          <button
            *ngIf="modal && selectedDrawGame.betTypeId === DrawGameBorletteBetType.Loto4"
            type="button"
            (click)="selectOptionsEvent.emit('1')"
            [disabled]="!selection[index].options['1'].stake"
            class="select"
            [ngClass]="{ selected: selection[index].options['1'].selected }"
          >
            <i *ngIf="selection[index].options['1'].selected" class="hg-check-mark"></i>
          </button>
        </div>
        <div class="input-options-item" [class.selected]="selection[index].options['2'].selected">
          <span>{{ 'DRAW_GAMES.OPTION' | i18n }} 2</span>
          <div class="input-stake-control" [class.error]="selection[index].options['2'].error">
            <button type="button" (click)="decrementStakeOptionsEvent.emit('2'); focusEvent.emit()">-</button>
            <input
              id="Option3_Stake"
              type="number"
              (input)="
                changeStakeOptionsEvent.emit({
                  optionsIndex: '2',
                  value: selection[index].options['2'].stake
                })
              "
              (focus)="focusEvent.emit()"
              [(ngModel)]="selection[index].options['2'].stake"
              [placeholder]="'DRAW_GAMES.STAKE' | i18n"
              numbersOnly
            />
            <button type="button" (click)="incrementStakeOptionsEvent.emit('2'); focusEvent.emit()">+</button>
          </div>
          <button
            *ngIf="modal && selectedDrawGame.betTypeId === DrawGameBorletteBetType.Loto4"
            type="button"
            (click)="selectOptionsEvent.emit('2')"
            [disabled]="!selection[index].options['2'].stake"
            class="select"
            [ngClass]="{ selected: selection[index].options['2'].selected }"
          >
            <i *ngIf="selection[index].options['2'].selected" class="hg-check-mark"></i>
          </button>
        </div>
        <div class="input-options-item" [class.selected]="selection[index].options['3'].selected">
          <span>{{ 'DRAW_GAMES.OPTION' | i18n }} 3</span>
          <div class="input-stake-control" [class.error]="selection[index].options['3'].error">
            <button type="button" (click)="decrementStakeOptionsEvent.emit('3'); focusEvent.emit()">-</button>
            <input
              type="number"
              (input)="
                changeStakeOptionsEvent.emit({
                  optionsIndex: '3',
                  value: selection[index].options['3'].stake
                })
              "
              (focus)="focusEvent.emit()"
              [(ngModel)]="selection[index].options['3'].stake"
              [placeholder]="'DRAW_GAMES.STAKE' | i18n"
              numbersOnly
            />
            <button type="button" (click)="incrementStakeOptionsEvent.emit('3'); focusEvent.emit()">+</button>
          </div>
          <button
            *ngIf="modal && selectedDrawGame.betTypeId === DrawGameBorletteBetType.Loto4"
            type="button"
            (click)="selectOptionsEvent.emit('3')"
            [disabled]="!selection[index].options['3'].stake"
            class="select"
            [ngClass]="{ selected: selection[index].options['3'].selected }"
          >
            <i *ngIf="selection[index].options['3'].selected" class="hg-check-mark"></i>
          </button>
        </div>
      </div>
      <button *ngIf="index > 0 && !modal" type="button" (click)="removeEvent.emit()" class="remove">&times;</button>
      <button
        *ngIf="modal && selectedDrawGame.betTypeId !== DrawGameBorletteBetType.Loto4"
        type="button"
        (click)="selectItem()"
        [disabled]="!this.item.stake"
        class="select"
        [ngClass]="{ selected: item.selected }"
      >
        <i *ngIf="item.selected" class="hg-check-mark"></i>
      </button>
    </div>
    <div *ngIf="indexItemFocused === index || !modal" class="presets-container">
      <button type="button" id="Clear_Item" (click)="resetStakeEvent.emit()"><i class="hg-erase"></i></button>
      <ng-container *ngFor="let stake of predefinedStakes">
        <button
          id="PredefinedStake"
          *ngIf="stake >= this.selectedDrawGame.baseAmount"
          type="button"
          (click)="setStakeEvent.emit(stake)"
        >
          {{ stake }}
        </button>
      </ng-container>
    </div>
    <div
      *ngIf="
        (selection[index].options &&
          (selection[index].options['1'].error ||
            selection[index].options['2'].error ||
            selection[index].options['3'].error)) ||
        selection[index].error.stake
      "
      class="error-container"
    >
      <span
        *ngIf="
          (selection[index].options &&
            (selection[index].options['1'].error === 'baseAmount' ||
              selection[index].options['2'].error === 'baseAmount' ||
              selection[index].options['3'].error === 'baseAmount')) ||
          selection[index].error.stake === 'baseAmount'
        "
      >
        * {{ 'DRAW_GAMES.ERROR.MINIMUM_STAKE' | i18n }}
        <hg-currency [value]="selectedDrawGame.baseAmount"></hg-currency>.
        {{ 'DRAW_GAMES.INCREASE_STAKE' | i18n }}
      </span>

      <span
        *ngIf="
          (selection[index].options &&
            (selection[index].options['1'].error === 'minimumAmountIncrement' ||
              selection[index].options['2'].error === 'minimumAmountIncrement' ||
              selection[index].options['3'].error === 'minimumAmountIncrement')) ||
          selection[index].error.stake === 'minimumAmountIncrement'
        "
      >
        * {{ 'DRAW_GAMES.ERROR.MINIMUM_AMOUNT_INCREMENT' | i18n }}
        <hg-currency [value]="selectedDrawGame.minimumAmountIncrement"></hg-currency>.
      </span>
    </div>
  </div>
</div>
