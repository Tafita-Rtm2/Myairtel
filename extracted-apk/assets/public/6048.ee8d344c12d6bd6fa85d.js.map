<hg-popup [hideClose]="true" [bottom]="true" [opened]="betSlipActive">
  <hg-bet-slip
    (close)="closeBetSlip()"
    [betValidatedTemplate]="betValidatedTemplate"
    (betCodeGenerated)="betCodeGenerated($event)"
    [hideBalance]="(me$ | async)?.hideBalance"
  ></hg-bet-slip>
  <ng-template
    #betValidatedTemplate
    let-context="context"
    let-getBetCode="getBetCode"
    let-isGettingBetCode="isGettingBetCode"
    let-close="close"
  >
    <hg-bet-validated
      [context]="context"
      [isGettingBetCode]="isGettingBetCode"
      (getBetCode)="getBetCode($event)"
      (close)="close($event)"
      id="DrawGames_BetPlacedPopup"
    ></hg-bet-validated>
  </ng-template>
</hg-popup>

<ng-container *ngIf="betCodeActiveForDrawGame">
  <hg-bet-code-ticket-tabs *hgMediaIfNot="'md'"></hg-bet-code-ticket-tabs>
</ng-container>

<hg-bet-slip-icon
  id="DrawGame_Open_Betslip"
  class="bet-slip"
  [class.opened]="betSlipActive"
  (click)="openBetSlip()"
></hg-bet-slip-icon>

<router-outlet name="bottomsidebaroutlet"></router-outlet>
