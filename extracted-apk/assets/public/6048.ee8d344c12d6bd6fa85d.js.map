<div class="tchala-container" id="Tchala_Popin" [ngClass]="{ 'selection-mode': isInSelectionMode }">
  <div class="search-container">
    <form (submit)="filter(searchText)">
      <span class="input-with-icon">
        <input
          id="Tchala_SearchBar"
          name="search"
          type="text"
          placeholder="{{ 'TCHALA.SEARCH' | i18n }}"
          (keyup)="filter(searchText)"
          [(ngModel)]="searchText"
        />
        <button>
          <i class="hg-search"></i>
        </button>
      </span>
    </form>
  </div>

  <hg-loader *ngIf="loading"></hg-loader>

  <div *ngIf="!loading" [style.opacity]="!loading ? 1 : 0" class="table-container">
    <hg-raw-template
      *ngIf="content"
      [html]="content"
      [css]="style"
      (contentLoaded)="onContentLoaded()"
    ></hg-raw-template>
  </div>
</div>

<button id="Add_Button" class="button close" (click)="save()" *ngIf="isInSelectionMode" [disabled]="!canSave()">
  {{ 'TCHALA.VALIDATE_SELECTION' | i18n }}
</button>
