<div class="infos" [routerLink]="['/draw-games', event.id]">
  <div class="header-container">
    <div *ngIf="event.drawGameRule.maxBaseNumber <= 100" class="container-type">
      <span class="type" id="DrawGame_Type"
        >{{ event.drawGameRule.drawnBaseNumberCount }} / {{ event.drawGameRule.maxBaseNumber }}</span
      >
    </div>
    <div class="title-container">
      <span class="title" id="DrawGame_Name">{{ event.name }}</span>
    </div>
  </div>

  <div class="details-container">
    <i
      id="Icon_Loto"
      [ngClass]="{
        'hgdg-loto': event.drawGameRule.maxBaseNumber <= 100,
        'hgdg-loto-borlette': event.drawGameRule.maxBaseNumber > 100
      }"
    ></i>
    <!-- <hg-entrypoint-icon [entryPointId]="event.eventCategoryId"></hg-entrypoint-icon> -->
    <span class="date-time" id="DrawGame_Date_Time"
      >{{ event.expectedStart | hgDate }} {{ 'DRAWGAMES.AT' | i18n }} {{ event.expectedStart | hgTime }}</span
    >
  </div>
</div>

<div class="actions">
  <button class="replay" id="DrawGame_Replay" *ngIf="canReplay" (click)="replay()"><i class="hg-rebet"></i></button>
  <button class="play" id="DrawGame_Play" [routerLink]="['/draw-games', event.id]">
    {{ 'DRAW_GAMES.PLAY' | i18n }}
  </button>
</div>
