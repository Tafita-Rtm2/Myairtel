<div class="header-menu">
  <ng-container *ngFor="let drawGame of drawGamesList; let i = index">
    <button
      id="Borlette_Select_{{ drawGame.name }}"
      *ngIf="drawGame.active"
      type="button"
      (click)="selectGame(i)"
      [class.active]="selectedDrawGame.name === drawGame.name"
      [attr.disabled]="!drawGame.bettingAllowed ? '' : null"
    >
      {{ drawGame.name }}
    </button>
  </ng-container>
</div>

<div class="draw-game-container {{ selectedDrawGame.name | lowercase }}">
  <div *ngIf="selectedDrawGame.betTypeId === DrawGameBorletteBetType.Borlette" class="buttons">
    <button type="button" id="Borlette_Open_Tchala" (click)="openTchala()">
      <span>
        {{ 'DRAW_GAMES.BORLETTE.LABEL.TCHALA' | i18n }}
      </span>
    </button>
    <button type="button" id="Borlette_Open_Pointe" (click)="openPointe()" *ngIf="displayPointe">
      <span>
        {{ 'DRAW_GAMES.BORLETTE.LABEL.POINTE' | i18n }}
      </span>
    </button>
    <button type="button" id="Borlette_Open_RaleBoule" (click)="openRaleBoule()" *ngIf="displayRaleBoule">
      <span>
        {{ 'DRAW_GAMES.LABEL.RECOMMENDEDNUMBERS' | i18n }}
      </span>
    </button>
    <button type="button" id="Borlette_Open_BoulePe" (click)="openBoulePe()">
      <span>
        {{ 'DRAW_GAMES.BORLETTE.LABEL.TWIN_NUMBERS' | i18n }}
      </span>
    </button>
  </div>

  <div class="description" [innerHTML]="'DRAW_GAMES.DESCRIPTION.' + selectedDrawGame.name | uppercase | i18n"></div>
  <div class="labels">
    <span>{{
      (selectedDrawGame.betTypeId === DrawGameBorletteBetType.Mariage ||
      selectedDrawGame.betTypeId === DrawGameBorletteBetType.Loto6
        ? 'DRAW_GAMES.NUMBERS'
        : 'DRAW_GAMES.NUMBER'
      ) | i18n
    }}</span>
    <span>{{ 'DRAW_GAMES.STAKE' | i18n }} (<hg-currency></hg-currency>)</span>
  </div>
  <div class="content">
    <ng-container *ngFor="let item of selection; let i = index">
      <hg-draw-game-borlette-item
        id="Borlette_{{ selectedDrawGame.name }}_Item"
        [selectedDrawGame]="selectedDrawGame"
        [index]="i"
        [selection]="selection"
        [padLength]="padLength"
        [predefinedStakes]="predefinedStakes"
        (changeInputNumberEvent)="handleInputNumber($event, i)"
        (changeInputNumbersEvent)="handleInputNumbers($event)"
        (decrementStakeEvent)="handleDecrement(i)"
        (decrementStakeOptionsEvent)="handleDecrementOptions(i, $event)"
        (incrementStakeOptionsEvent)="handleIncrementOptions(i, $event)"
        (incrementStakeEvent)="handleIncrement(i)"
        (changeStakeEvent)="handleStakeChange($event, i)"
        (changeStakeOptionsEvent)="handleStakeOptionsChange($event, i)"
        (removeEvent)="removeItem(i)"
        (resetStakeEvent)="resetStake(i)"
        (setStakeEvent)="setStakeItem($event, i)"
      >
      </hg-draw-game-borlette-item>
    </ng-container>
  </div>
</div>

<div class="buttons-container">
  <button
    type="button"
    (click)="addNumber()"
    id="Borlette_Add_Item"
    class="add-number"
    [attr.disabled]="!selectionIsValid ? '' : null"
  >
    <i class="hg-add"></i>
    <span>{{
      (selectedDrawGame.betTypeId === DrawGameBorletteBetType.Loto6
        ? 'DRAW_GAMES.ADD_SELECTION'
        : 'DRAW_GAMES.ADD_NUMBER'
      ) | i18n
    }}</span>
  </button>
  <button
    type="button"
    id="Borlette_AddToBetslip"
    class="submit"
    (click)="addToBetslip()"
    [attr.disabled]="!selectionIsValid ? '' : null"
  >
    <span>{{ 'BET.ADD_TO_BETSLIP' | i18n }}</span>
    <span class="price" *ngIf="totalStake"
      >&nbsp;(<hg-currency id="Borlette_Stake" [value]="totalStake"></hg-currency>)</span
    >
  </button>
</div>

<hg-draw-game-borlette-modal
  *ngIf="displayModal"
  [predefinedStakes]="predefinedStakes"
  [selection]="selectionModal"
  [selectedDrawGame]="selectedDrawGameModal"
  [titleModal]="titleModal"
  (closeEvent)="displayModal = false"
  (confirmEvent)="confirmModal($event)"
>
</hg-draw-game-borlette-modal>
