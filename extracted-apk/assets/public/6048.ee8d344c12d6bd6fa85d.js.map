<hg-loader *ngIf="loading"></hg-loader>

<div class="replay-info" id="DrawGames_Rebet_Info" *ngIf="!loading && displayReplayInfo">
  <div class="replay-info-centered-elements">
    <i class="hg-rebet"></i>
    <label>{{ 'DRAWGAMES.REPLAY.INFO' | i18n }}</label>
  </div>
  <button id="DrawGames_Rebet_Info_Close" (click)="closeReplayInfo()">&#10005;</button>
</div>

<div *ngIf="!loading" class="rows-container">
  <div *ngFor="let event of events; trackBy: trackEvent" [@removed]="true" class="row">
    <hg-draw-games-event-preview id="DrawGame_Event" [event]="event" [drawGames]="events"></hg-draw-games-event-preview>
  </div>

  <p class="nodata" *ngIf="!loading && (!events || !events.length)">
    <img src="/assets/nodata.png" alt="nodata" />
    {{ 'DRAWGAMES.NO_EVENTS' | i18n }}
  </p>
</div>
