<hg-three-columns-layout>
  <ng-container left>
    <hg-draw-games-ui-desktop-event-categories-navigation
      *hgMediaIfNot="'md'; ssr: true"
      (navigated)="navigated($event)"
      [displayBorlettePage]="displayBorlettePage"
    >
    </hg-draw-games-ui-desktop-event-categories-navigation>
  </ng-container>

  <ng-container center>
    <div class="banners" *ngIf="displayBanner">
      <hg-anchor #bannerAnchor anchor="banner-lotery"></hg-anchor>
    </div>
    <div class="router-container">
      <router-outlet *ngIf="!isServer; else placeholder"></router-outlet>
      <ng-template #placeholder>
        <div class="placeholder">
          <hg-loader></hg-loader>
        </div>
      </ng-template>
    </div>
    <hg-drawgames-font-loader></hg-drawgames-font-loader>
  </ng-container>

  <ng-container right>
    <hg-draw-games-sidebar></hg-draw-games-sidebar>
  </ng-container>
</hg-three-columns-layout>
