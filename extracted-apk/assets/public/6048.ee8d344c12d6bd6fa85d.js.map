<div class="infos">
  <div class="header-container">
    <span class="title" id="DrawGame_Name">{{ event.name }}</span>
  </div>

  <div class="details-container">
    <span *ngIf="!event.hasPrizesOrOptions" class="type" id="DrawGame_Type"
      >{{ event.drawGameRule.drawnBaseNumberCount }} / {{ event.drawGameRule.maxBaseNumber }}</span
    >
    <div class="date" id="DrawGame_Date">{{ event.expectedStart | hgDate }}</div>
  </div>
</div>

<div class="results" id="DrawGame_Results_Numbers">
  <ng-container *ngIf="event.hasPrizesOrOptions">
    <div *ngFor="let number of event.baseSelectionAsStringArray" class="number">
      <span id="DrawGame_Results_String">{{ number }}</span>
    </div>
  </ng-container>

  <ng-container *ngIf="!event.hasPrizesOrOptions">
    <div *ngFor="let number of event.baseSelection" class="number">
      <span id="DrawGame_Results_Number">{{ number }}</span>
    </div>
  </ng-container>

  <div *ngFor="let number of event.extraSelection" class="extra number">
    <span id="DrawGame_Results_ExtraNumber">{{ number }}</span>
  </div>
</div>
