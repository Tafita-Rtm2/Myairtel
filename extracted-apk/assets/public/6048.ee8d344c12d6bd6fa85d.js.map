<div class="results-container" [style.opacity]="!error ? 1 : 0">
  <div class="results-header">
    <span class="title">{{ 'MENU.RESULTS' | i18n }}</span>
    <div class="filter">
      <span>{{ 'DRAW_GAMES.RESULTS.DATE' | i18n }}</span>
      <hg-select
        *ngIf="!displayCalendar"
        [(ngModel)]="dateSelected"
        [options]="dates"
        (ngModelChange)="onDateChange()"
        id="DrawGames_Results_Select_Date"
      >
        <ng-template #selectTemplate class="option" let-item>{{ item | hgDate }}</ng-template>
      </hg-select>
      <input
        id="DrawGames_Results_Select_Date"
        *ngIf="displayCalendar"
        type="date"
        class="calendar"
        [(ngModel)]="calendarSelectedDate"
        (ngModelChange)="onDateChange()"
        [attr.min]="minDate"
        [attr.max]="maxDate"
      />
    </div>
  </div>

  <hg-loader *ngIf="loading"></hg-loader>

  <div class="rows-container" *ngIf="!loading">
    <div class="row" *ngFor="let event of events">
      <hg-result id="DrawGame_Event_Results" [event]="event"></hg-result>
    </div>
  </div>
  <div class="nodata" *ngIf="(!loading && (!events || events.length === 0)) || error">
    <img src="/assets/nodata.png" alt="nodata" />
    <span>{{ 'BETSLIST.NO_EVENT' | i18n }}</span>
  </div>
</div>
