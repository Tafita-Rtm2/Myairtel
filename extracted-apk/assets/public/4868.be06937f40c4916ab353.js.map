<hg-event
  *ngIf="
    (event.state === EventStateType.Undisputed ||
      event.state === EventStateType.Unknown ||
      event.state === EventStateType.AboutToStart) &&
      !statscoreIsLoaded;
    else summary
  "
  [event]="event"
  [class.is-pinned]="isStickyHeader"
  #blockEventHeight
></hg-event>

<ng-template #summary>
  <hg-event-summary
    *ngIf="!scoreWidgetActivated || !statscoreIsLoaded"
    [class.is-pinned]="isStickyHeader"
    [isStickyHeader]="isStickyHeader"
    [event]="event"
    (blockHeaderHeight)="blockHeaderHeight($event)"
    (toggleEventHistory)="toggleEventHistory.emit($event)"
  ></hg-event-summary>
</ng-template>

<ng-container
  *ngIf="
    !isKiosk &&
    configuration.scoreWidgetConfiguration?.enabled &&
    configuration.scoreWidgetConfiguration?.type === ScoreWidgetType.Statscore &&
    !isExpired &&
    event.entryPointId >= 101 &&
    event.entryPointId < 1000
  "
>
  <span
    *ngIf="!scoreWidgetActivated && !isLive; else liveStatscoreButton"
    class="score-widget-activate"
    (click)="activateScoreWidget(false)"
  >
    <i class="hg-stats-widget"></i>
    <span>{{ 'SCORE_WIDGET.PRE_EVENT.MONITOR' | i18n }}</span>
  </span>

  <span *ngIf="!scoreWidgetActivated && !isLive && displayTextWarnOnData" class="text-warn-on-data">
    {{ 'SCORE_WIDGET.TEXT.WARN_ON_DATA' | i18n }}
  </span>

  <hg-statscore
    *ngIf="scoreWidgetActivated"
    (close)="closeScoreWidget()"
    [sourceRef]="sourceRef"
    [preEventOrLiveConfigValue]="preEventOrLiveConfigValue"
    [token]="configuration.scoreWidgetConfiguration?.configuration?.token"
    (widgetIsLoaded)="statscoreWidgetIsloaded($event)"
  >
  </hg-statscore>
</ng-container>

<ng-container
  *ngIf="
    isValidSourceRef &&
    !isKiosk &&
    configuration.scoreWidgetConfiguration?.enabled &&
    configuration.scoreWidgetConfiguration?.type === ScoreWidgetType.Statscore2 &&
    !isExpired &&
    event.entryPointId >= 101 &&
    event.entryPointId < 1000
  "
>
  <span
    *ngIf="!scoreWidgetActivated && !isLive; else liveStatscoreButton"
    class="score-widget-activate"
    (click)="activateScoreWidget(false)"
  >
    <i class="hg-stats-widget"></i>
    <span>{{ 'SCORE_WIDGET.PRE_EVENT.MONITOR' | i18n }}</span>
  </span>

  <span *ngIf="!scoreWidgetActivated && !isLive && displayTextWarnOnData" class="text-warn-on-data">
    {{ 'SCORE_WIDGET.TEXT.WARN_ON_DATA' | i18n }}
  </span>

  <hg-statscore2
    *ngIf="scoreWidgetActivated"
    (close)="closeScoreWidget()"
    [sourceRef]="sourceRef"
    [preEventOrLiveConfigValue]="preEventOrLiveConfigValue"
    [widgetOverride]="widgetOverride"
    (widgetIsLoaded)="statscoreWidgetIsloaded($event)"
  >
  </hg-statscore2>
</ng-container>

<ng-template #liveStatscoreButton>
  <span *ngIf="!scoreWidgetActivated && isLive" class="score-widget-activate" (click)="activateScoreWidget(true)">
    <i class="hg-stadium"></i>
    <span>{{ 'SCORE_WIDGET.LIVE.MONITOR' | i18n }}</span>
  </span>
</ng-template>

<ng-container
  *ngIf="
    !isKiosk &&
    configuration.scoreWidgetConfiguration?.enabled &&
    configuration.scoreWidgetConfiguration?.type === ScoreWidgetType.Betradar
  "
>
  <hg-live-match-tracker
    (close)="scoreWidgetActivated = false"
    *ngIf="scoreWidgetActivated"
    [sourceRef]="sourceRef"
    [brSubscriptionId]="configuration.scoreWidgetConfiguration?.configuration?.subscriptionId"
  >
  </hg-live-match-tracker>

  <span
    *ngIf="event.entryPointId === 101 && isLive && !scoreWidgetActivated && liveTrackerAvailable"
    class="lmt-activate"
    (click)="activateScoreWidget(true)"
  >
    <i class="hg-stadium"></i>
    <span>{{ 'SCORE_WIDGET.LIVE.MONITOR' | i18n }}</span>
  </span>
</ng-container>
