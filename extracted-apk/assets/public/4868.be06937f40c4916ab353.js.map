<h3>{{ 'COMMON.WARNING' | i18n }}</h3>
<hr />

<p *ngIf="isLive; else preEvent">
  {{ 'SCORE_WIGET_WARNING.TEXT' | i18n }}
</p>

<ng-template #preEvent>
  <p>
    {{ 'SCORE_WIDGET.PRE_EVENT.WARNING.TEXT' | i18n }}
  </p>
</ng-template>

<button class="button validate" (click)="close.emit(false)">{{ 'COMMON.OK' | i18n }}</button>
<button *ngIf="!warnOnDataConsumption" class="button" (click)="close.emit(true)">
  {{ 'SCORE_WIDGET_WARNING.DONT_ASK_AGAIN' | i18n }}
</button>
<button *ngIf="warnOnDataConsumption" class="button" (click)="close.emit(null)">{{ 'COMMON.RETURN' | i18n }}</button>
