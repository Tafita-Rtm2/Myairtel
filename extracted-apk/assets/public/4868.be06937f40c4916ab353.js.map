<span *ngIf="!widgetLoaded && !loading" class="score-widget-unavailable">
  {{ 'SCORE_WIDGET.UNAVAILABLE' | i18n }}
</span>

<div [class.error]="hasError" id="STATSCORE__Tracker"></div>

<iframe
  *ngIf="widgetOverride"
  id="STATSCORE_LMP_GENERATOR_IFRAME"
  frameborder="0"
  scrolling="yes"
  width="100%"
  height="350px"
  [src]="iFrameSrc"
></iframe>

<div *ngIf="widgetLoaded" class="close" (click)="close.emit()">
  <i class="hg-cross"></i> <span> {{ 'STATSCORE.WIDGET.CLOSE' | i18n }} </span>
</div>

<div id="statscore2-colors" class="colors">
  <span class="primary"></span>
  <span class="accent-bg"></span>
</div>
