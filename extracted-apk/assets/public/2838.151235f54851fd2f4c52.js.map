<button class="button" (click)="openBasket($event)">
  <i class="hg-charity"></i>{{ 'CHARITY.MAKE_DONATION' | i18n }}
</button>
<hg-popup [opened]="showPopup" [bottom]="true" (click)="preventClick($event)" *hgMediaIf="'sm'" [hideClose]="true">
  <hg-charity-basket-popup (close)="closeBasket()" [charity]="charity"></hg-charity-basket-popup>
</hg-popup>
