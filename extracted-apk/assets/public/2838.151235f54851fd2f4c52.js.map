<div class="container-block">
  <div class="container" *ngIf="pointsOfSale" [class.map-enabled]="enableMap">
    <div
      hgMap
      *ngIf="pointsOfSale && enableMap"
      [focus]="focus"
      [points]="pointsForCategory"
      [me]="myPosition"
      (markerClicked)="onMarkerClicked($event)"
    ></div>
    <div
      class="map"
      [style.backgroundImage]="'url(' + pointsOfSale.imageUrl + ')'"
      *ngIf="pointsOfSale && !enableMap && pointsOfSale.imageUrl"
    ></div>

    <hg-loader *ngIf="!pointsOfSale"></hg-loader>
    <div class="points">
      <h1>
        {{ (category === 0 ? 'FOOTER.POINTS_OF_SALE' : 'FOOTER.POINTS_OF_SALE.' + category) | i18n }} {{ operatorName }}
      </h1>
      <div class="points-list">
        <div
          class="point"
          [class.active]="pointToDisplay === point"
          *ngFor="let point of pointsForCategory; let index = index"
          (click)="onPointFocus(point)"
        >
          <span class="number">
            {{ index + 1 }}
          </span>
          <div class="name">{{ point.name }}</div>
          <div class="address">{{ point.address }}</div>
          <span *ngIf="point.distance" class="distance">{{ point.distance | hgDistance }}</span>
        </div>
      </div>
    </div>
  </div>
</div>

<hg-table-contents></hg-table-contents>
