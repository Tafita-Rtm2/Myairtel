<hg-three-columns-layout>
  <ng-container center>
    <div class="container">
      <div class="title">
        <h1>{{ 'FAQ.TITLE' | i18n }}</h1>
        <p *hgMediaIfNot="'md'">{{ 'FAQ.DESCRIPTION' | i18n }}</p>
      </div>
      <div class="faq-main-content">
        <ng-container *ngFor="let content of contents; let index = index">
          <div
            [id]="index"
            class="faq-content"
            (click)="active = active === index ? null : index; scrollToFaqContent(index)"
          >
            <div>
              <div
                class="faq-content-title"
                [class.background-title]="active === index"
                [class.is-active]="active === index"
              >
                <p>{{ content.title }}</p>
                <i class="hg-arrow-down arrow" [class.arrow-rotate]="active === index"></i>
              </div>
              <div class="hide" [class.is-open]="active === index" *ngIf="active === index">
                <div class="faq-content-answer">
                  <hg-raw-template [html]="content.content" [css]="content.style"></hg-raw-template>
                </div>
              </div>
            </div>
          </div>
        </ng-container>
      </div>
    </div>

    <hg-table-contents *hgMediaIf="'md'"></hg-table-contents>
  </ng-container>
</hg-three-columns-layout>
