<div class="countdown">
  <div><i class="hg-chrono"></i></div>
  <div>
    <span>{{ text$ | async }} </span>
    <span *ngIf="countdown$ | async as countdown; else textDate">
      {{ countdown }}
    </span>
    <ng-template #textDate>
      {{ dateText }}
    </ng-template>
  </div>
</div>
