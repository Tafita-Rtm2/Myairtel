<ng-container [ngSwitch]="event.entryPointId">
  <hg-one-score-event-summary
    *ngSwitchCase="101"

    [event]="event"
    #blockEventHeight
  ></hg-one-score-event-summary>
  <hg-racket-event-summary
    *ngSwitchCase="103"
    [class.is-pinned]="isStickyHeader"
    [isStickyHeader]="isStickyHeader"
    [event]="event"
    #blockEventHeight
  ></hg-racket-event-summary>
  <hg-one-score-event-summary
    *ngSwitchCase="104"
    [class.is-pinned]="isStickyHeader"
    [isStickyHeader]="isStickyHeader"
    [event]="event"
    #blockEventHeight
  ></hg-one-score-event-summary>
  <hg-racket-event-summary
    *ngSwitchCase="106"
    [class.is-pinned]="isStickyHeader"
    [isStickyHeader]="isStickyHeader"
    [event]="event"
    #blockEventHeight
  ></hg-racket-event-summary>
  <hg-darts-event-summary
    *ngSwitchCase="108"
    [class.is-pinned]="isStickyHeader"
    [isStickyHeader]="isStickyHeader"
    [event]="event"
    #blockEventHeight
  ></hg-darts-event-summary>
  <hg-one-score-event-summary
    *ngSwitchCase="109"
    [class.is-pinned]="isStickyHeader"
    [isStickyHeader]="isStickyHeader"
    [event]="event"
    #blockEventHeight
  ></hg-one-score-event-summary>
  <hg-one-score-event-summary
    *ngSwitchCase="110"
    [class.is-pinned]="isStickyHeader"
    [isStickyHeader]="isStickyHeader"
    [event]="event"
    #blockEventHeight
  ></hg-one-score-event-summary>
  <hg-racket-event-summary
    *ngSwitchCase="113"
    [class.is-pinned]="isStickyHeader"
    [isStickyHeader]="isStickyHeader"
    [event]="event"
    #blockEventHeight
  ></hg-racket-event-summary>
  <hg-racket-event-summary
    *ngSwitchCase="114"
    [class.is-pinned]="isStickyHeader"
    [isStickyHeader]="isStickyHeader"
    [event]="event"
    #blockEventHeight
  ></hg-racket-event-summary>
  <hg-one-score-event-summary
    *ngSwitchCase="1003"
    [class.is-pinned]="isStickyHeader"
    [isStickyHeader]="isStickyHeader"
    [event]="event"
    #blockEventHeight
  ></hg-one-score-event-summary>
  <hg-one-score-event-summary
    *ngSwitchCase="8019"
    [class.is-pinned]="isStickyHeader"
    [isStickyHeader]="isStickyHeader"
    [event]="event"
    #blockEventHeight
  ></hg-one-score-event-summary>
  <hg-one-score-event-summary
    *ngSwitchCase="8020"
    [class.is-pinned]="isStickyHeader"
    [isStickyHeader]="isStickyHeader"
    [event]="event"
    #blockEventHeight
  ></hg-one-score-event-summary>
  <hg-one-score-event-summary
    *ngSwitchCase="8021"
    [class.is-pinned]="isStickyHeader"
    [isStickyHeader]="isStickyHeader"
    [event]="event"
    #blockEventHeight
  ></hg-one-score-event-summary>
  <hg-one-score-event-summary
    *ngSwitchCase="8027"
    [class.is-pinned]="isStickyHeader"
    [isStickyHeader]="isStickyHeader"
    [event]="event"
    #blockEventHeight
  ></hg-one-score-event-summary>
  <hg-one-score-event-summary
    *ngSwitchCase="8028"
    [class.is-pinned]="isStickyHeader"
    [isStickyHeader]="isStickyHeader"
    [event]="event"
    #blockEventHeight
  ></hg-one-score-event-summary>
  <hg-one-score-event-summary
    *ngSwitchCase="8029"
    [class.is-pinned]="isStickyHeader"
    [isStickyHeader]="isStickyHeader"
    [event]="event"
    #blockEventHeight
  ></hg-one-score-event-summary>
  <hg-default-event-summary
    *ngSwitchDefault
    [class.is-pinned]="isStickyHeader"
    [isStickyHeader]="isStickyHeader"
    [event]="event"
    #blockEventHeight
  ></hg-default-event-summary>
</ng-container>
<div class="history" *ngIf="event.entryPointId === 101">
  <div [class.live]="event.state === EventStateType.Started">
    <hg-event-history
      *ngIf="
        event.state !== EventStateType.Started ||
        (event.cards && event.cards.length) ||
        (event.goals && event.goals.length)
      "
      [cards]="event.cards"
      [goals]="event.goals"
      [collapsable]="event.state === EventStateType.Started"
      (toggleEvent)="toggleEventHistory.emit($event)"
    >
    </hg-event-history>
  </div>
  <div
    class="no-available"
    *ngIf="
      event.state !== EventStateType.Started &&
      (!event.cards || !event.cards.length) &&
      (!event.goals || !event.goals.length)
    "
  >
    {{ 'EVENT.SUMMARY.NOSUMMARY_AVAILABLE' | i18n }}
  </div>
</div>
