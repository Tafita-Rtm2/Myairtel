<div [class.collapsable]="collapsable">
  <div class="info" (click)="toggleHistory()">
    <span>{{ 'EVENT.SUMMARY' | i18n }}</span>
    <i *ngIf="collapsable && !displayFullHistory" class="hg-arrow-down arrow-down"></i>
    <i *ngIf="collapsable && displayFullHistory" class="hg-arrow-down arrow-up"></i>
  </div>

  <div
    *ngFor="let event of history"
    class="history"
    [style.display]="!collapsable || displayFullHistory ? 'flex' : 'none'"
    [class.home]="event.team === TeamType.Home"
    [class.away]="event.team === TeamType.Away"
  >
    <span>{{ event.timeDetails }}'</span>
    <hg-inline-svg
      *ngIf="!event.type || event.type === 'Default'"
      class="event-icon"
      src="assets/history/goal.svg"
      class="goal"
    ></hg-inline-svg>
    <hg-inline-svg
      *ngIf="event.type === 'Yellow'"
      class="event-icon card"
      src="assets/history/yellow-card.svg"
    ></hg-inline-svg>
    <hg-inline-svg
      *ngIf="event.type === 'Red'"
      class="event-icon card"
      src="assets/history/red-card.svg"
    ></hg-inline-svg>
    <hg-inline-svg
      *ngIf="event.type === 'YellowRed'"
      class="event-icon card"
      src="assets/history/yellow-red-card.svg"
    ></hg-inline-svg>
    <span>{{ event.player }}</span>
  </div>
</div>
