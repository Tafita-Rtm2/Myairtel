<ng-container *ngFor="let amount of amounts; let last = last">
  <span [id]="type + '_AmountSelector'" (click)="onAmountSelected(amount)">{{ amount }}</span>
  <span
    *ngIf="last && maximumAmount && amounts?.length === 3"
    [id]="type + '_AmountSelector_Max'"
    (click)="onAmountSelected(maximumAmount)"
    >MAX</span
  >
</ng-container>
