<div class="background">
  <div class="coupon-menu" *ngIf="mode === 'menu'">
    <button (click)="switchMode('odds')">
      <p class="button-title">{{ 'ABOUT.ODDS_COUPONS' | i18n }}</p>
      <i class="hg-arrow-right"></i>
    </button>
    <button (click)="switchMode('results')">
      <p class="button-title">{{ 'ABOUT.RESULTS_COUPONS' | i18n }}</p>
      <i class="hg-arrow-right"></i>
    </button>
  </div>

  <div class="coupon-selection" [class.active]="mode === 'odds'">
    <p class="title">{{ 'ABOUT.ODDS_COUPONS' | i18n }}</p>
    <div class="button" *ngFor="let item of couponsInfos">
      <a (click)="logEvent(item, 'Odds')" [href]="item.urlStart + userLanguage + item.urlEnd" target="_blank">
        <hg-inline-svg [src]="'/assets/pdf-file-format-symbol.svg'"></hg-inline-svg>
        <p>{{ item.date | hgShortTextDate }}</p>
      </a>
    </div>
  </div>

  <div class="result-selection" [class.active]="mode === 'results'">
    <p class="title">{{ 'ABOUT.RESULTS_COUPONS' | i18n }}</p>
    <div class="button" *ngFor="let item of resultsInfos">
      <a (click)="logEvent(item, 'Results')" [href]="item.urlStart + userLanguage + item.urlEnd" target="_blank">
        <hg-inline-svg [src]="'/assets/pdf-file-format-symbol.svg'"></hg-inline-svg>
        <p>{{ item.date | hgShortTextDate }}</p>
      </a>
    </div>
  </div>
</div>
