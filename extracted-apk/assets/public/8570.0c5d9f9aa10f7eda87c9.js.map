<hg-horseracing-about-header
  ><h1>{{ 'HORSERACING.ABOUT.HOWTOBET' | i18n }}</h1></hg-horseracing-about-header
>

<hg-horseracing-about-content>
  <hg-loader *ngIf="loadingContent; else howtobetcontent"></hg-loader>
  <ng-template #howtobetcontent>
    <div *ngFor="let section of content; let i = index" class="content">
      <div class="illustration">
        <div class="number">{{ i + 1 }}</div>
        <img [src]="section.illustrationUrl" alt="{{ section.title }}" />
      </div>
      <div class="content-text">
        <h2>{{ section.title }}</h2>
        <p>{{ section.description }}</p>
      </div>
    </div>
  </ng-template>
</hg-horseracing-about-content>
