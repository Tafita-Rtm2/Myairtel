<hg-horseracing-about-header
  ><h1>{{ 'HORSERACING.ABOUT.RACETYPES' | i18n }}</h1></hg-horseracing-about-header
>

<hg-horseracing-about-content>
  <hg-loader *ngIf="loadingContent; else racetypescontent"></hg-loader>
  <ng-template #racetypescontent>
    <div *ngFor="let section of content" class="content">
      <div class="bg">
        <img [src]="section.illustrationUrl" loading="lazy" alt="Image type of races" />
      </div>
      <h2>{{ section.title }}</h2>
      <div [innerHTML]="section.description"></div>
    </div>
  </ng-template>
</hg-horseracing-about-content>
