<div class="category__title">
  <hg-inline-svg *ngIf="category.iconUrl" [src]="category.iconUrl" id="Icon"> </hg-inline-svg>
  <span id="Title">{{ 'INSTANT-GAMES.BIG-WINNERS.TITLE' | i18n }}</span>
</div>

<div
  class="category"
  [ngClass]="{
    'category__gradient--left': arrowLeftVisible,
    'category__gradient--right': arrowRightVisible
  }"
>
  <hg-arrows-slide
    *hgMediaIfNot="'md'"
    [showLeftArrow]="arrowLeftVisible"
    [showRightArrow]="arrowRightVisible"
    (previous)="onPreviousPosition()"
    (next)="onNextPosition()"
  ></hg-arrows-slide>

  <!-- FIRST WINNER (XS ONLY) -->
  <div *ngIf="(media$ | async) === Media.xs" class="category__big-winner-container">
    <a
      class="category__big-winner category__big-winner--first"
      id="First_BigWinner"
      [routerLink]="bigWinners[0].instantGame.computedUrl"
    >
      <div class="category__big-winner-content">
        <div class="category__big-winner-column category__big-winner-column--left">
          <span class="category__big-winner-title" id="BigWinner_Title">{{ category.name | uppercase }}</span>

          <span class="category__big-winner-customer">
            <img src="/assets/instant-games/user.svg" alt="user icon" />
            {{ bigWinners[0].customer }}
          </span>

          <span class="category__big-winner-reward" id="BigWinner_Reward">
            <hg-currency [forceDecimals]="false" [value]="bigWinners[0].paidAmount"></hg-currency>
          </span>
        </div>

        <div class="category__big-winner-column category__big-winner-column--right">
          <img src="/assets/instant-games/big-winner-cup.png" class="category__big-winner-cup" alt="cup" />

          <div class="category__big-winner-game" [class.is-new]="bigWinners[0].instantGame.isNew" id="GameContainer">
            <img
              class="category__big-winner-game-image"
              [src]="bigWinners[0].instantGame.imageUrl | hgToSecureUrl"
              loading="lazy"
              [alt]="bigWinners[0].instantGame.name + ' game'"
            />
          </div>
        </div>
      </div>
    </a>
  </div>

  <!-- ALL WINNERS -->
  <div
    *ngIf="(media$ | async) > Media.xs || bigWinners.length > 1"
    class="category__big-winners"
    #categoryGames
    (touchmove)="swipe()"
    (mousedown)="startDragging($event, categoryGames)"
    (mouseup)="stopDragging($event)"
    (mouseleave)="stopDragging($event)"
    (mousemove)="moveEvent($event, categoryGames)"
    id="Category_Games"
  >
    <ng-container *ngFor="let bigWinner of bigWinners; let first = first; trackBy: trackBy">
      <a
        *ngIf="(media$ | async) > Media.xs || !first"
        class="category__big-winner"
        [class.category__big-winner--first]="first"
        [class.category__big-winner--not-first]="!first"
        (click)="redirect(bigWinner.instantGame.computedUrl, bigWinner.instantGame.name)"
      >
        <span *ngIf="first" class="category__big-winner-title" id="BigWinner_Title">{{
          category.name | uppercase
        }}</span>

        <div class="category__big-winner-content">
          <div class="category__big-winner-column category__big-winner-column--left">
            <span class="category__big-winner-customer" id="BigWinner_CustomerLogin">
              <img src="/assets/instant-games/user.svg" alt="user icon" />
              {{ bigWinner.customer }}
            </span>

            <span class="category__big-winner-reward" id="BigWinner_Reward">
              <hg-currency [forceDecimals]="false" [value]="bigWinner.paidAmount"></hg-currency>
            </span>
          </div>

          <div class="category__big-winner-column category__big-winner-column--right">
            <img
              *ngIf="first"
              src="/assets/instant-games/big-winner-cup.png"
              class="category__big-winner-cup"
              alt="cup"
            />

            <div class="category__big-winner-game" [class.is-new]="bigWinner.instantGame.isNew" id="GameContainer">
              <img
                class="category__big-winner-game-image"
                [src]="bigWinner.instantGame.imageUrl | hgToSecureUrl"
                loading="lazy"
                [alt]="bigWinner.instantGame.name + ' game'"
              />
            </div>
          </div>
        </div>
      </a>
    </ng-container>
  </div>
</div>
