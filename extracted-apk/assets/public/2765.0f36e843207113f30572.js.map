<div class="game">
  <div *ngIf="mode === InstantGameMode.Demo && !!customerId" class="game__demo">
    {{ 'INSTANT-GAMES.DEMO_MESSAGE' | i18n }}
    <button type="button" class="button" (click)="goToRealMode()">
      {{ 'INSTANT-GAMES.PLAY_FOR_REAL' | i18n }}
    </button>
  </div>

  <div class="game__widget" [style.--tournament-banner-offset.px]="hasTournamentBanner ? BANNER_HEIGHT : 0">
    <hg-instant-games-in-game-tournament-banner
      #tournamentBanner
      [gameId]="game?.id"
    ></hg-instant-games-in-game-tournament-banner>
    <iframe
      #insaElement
      *ngIf="isReady && iframeURL"
      [class]="classWidget.toLowerCase()"
      src="about:blank"
      allowfullscreen=""
      webkitallowfullscreen=""
      mozallowfullscreen=""
      title="Widget Insa Games"
    ></iframe>

    <hg-loader *ngIf="!isReady"></hg-loader>
  </div>
  <hg-similar-games *ngIf="game && isReady" provider="InsaGames" [gameId]="game?.id"></hg-similar-games>
</div>
