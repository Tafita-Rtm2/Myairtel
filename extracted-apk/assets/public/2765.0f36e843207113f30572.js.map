<div class="category">
  <div class="category__title">
    <span id="Title">{{ category.name }}</span>
  </div>

  <div class="category__games">
    <ng-container>
      <ng-container *hgMediaIfNot="'md'">
        <ng-container *ngFor="let game of category.instantGames; let i = index; trackBy: trackBy">
          <a [class.is-new]="game.isNew" (click)="redirect(game.computedUrl, game.name, category, i + 1)">
            <hg-favorite [isFavorite]="game.isFavorite" (favoriteToggled)="toggleFavorited(game, $event)"></hg-favorite>
            <hg-game-tile [instantGame]="game"></hg-game-tile>
          </a>
        </ng-container>
      </ng-container>
      <hg-instant-game-carousel
        [games]="category.instantGames"
        *hgMediaIf="'md'"
        (favoriteToggled)="toggleFavorited($event.game, $event.event)"
      ></hg-instant-game-carousel>
    </ng-container>
  </div>
</div>
