<div class="category category__gradient--left category__gradient--right">
  <div *ngIf="category" class="category__title">
    <hg-inline-svg *ngIf="category.iconUrl" [src]="category.iconUrl" id="Icon"> </hg-inline-svg>
    <span id="Title">{{ category.name }}</span>
  </div>

  <div class="category__games" #categoryGames id="Category_Games">
    <div class="scroll-container" #scrollContainer>
      <div class="scroll-track" [style.--duration]="scrollDuration">
        <button
          *ngFor="let item of repeatedItems; trackBy: trackBySlot"
          (click)="redirect(item.instantGame.computedUrl, item.instantGame.name)"
          class="scroll-item"
          type="button"
        >
          <div class="ws__container">
            <div class="ws__image">
              <img
                [src]="item.instantGame.imageUrl | hgToSecureUrl"
                loading="lazy"
                [alt]="item.instantGame.name + ' game'"
              />
            </div>
            <div class="ws__infos">
              <div>
                <i class="hg-profile"></i>
                <span>{{ item.customer }}</span>
              </div>
              <hg-currency [value]="item.paidAmount"></hg-currency>
            </div>
          </div>
        </button>
      </div>
    </div>
  </div>
</div>
