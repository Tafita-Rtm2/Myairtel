<div
  class="category"
  [ngClass]="{
    'category__gradient--left': arrowLeftVisible,
    'category__gradient--right': arrowRightVisible,
    'category--hot': category.type === InstantGameCategoryType.HotGames,
    'category--cold': category.type === InstantGameCategoryType.ColdGames
  }"
>
  <div class="category__title">
    <hg-inline-svg [src]="category.iconUrl" id="Icon"> </hg-inline-svg>
    <span id="Title">{{ category.name }}</span>
    <button class="category__button" id="SeeMore_Button" (click)="onCategoryClick(category, 'title')">
      {{ 'GENERIC.SEE.MORE' | i18n }}
      <i class="hg-arrow-right"></i>
    </button>
  </div>

  <hg-arrows-slide
    *hgMediaIfNot="'md'"
    [showLeftArrow]="arrowLeftVisible"
    [showRightArrow]="arrowRightVisible"
    (previous)="onPreviousPosition()"
    (next)="onNextPosition()"
  ></hg-arrows-slide>

  <div
    class="category__games"
    id="Category_Games"
    #categoryGames
    (touchmove)="swipe()"
    (mousedown)="startDragging($event, categoryGames)"
    (mouseup)="stopDragging($event)"
    (mouseleave)="stopDragging($event)"
    (mousemove)="moveEvent($event, categoryGames)"
  >
    <ng-container *ngFor="let game of category.instantGames; let i = index; trackBy: trackBy">
      <button
        [class.is-new]="game.isNew"
        (click)="redirect(game.computedUrl, game.name, category, i + 1)"
        class="category__game"
      >
        <hg-favorite [isFavorite]="game.isFavorite" (favoriteToggled)="toggleFavorited(game, $event)"></hg-favorite>
        <hg-game-tile [instantGame]="game"></hg-game-tile>
        <span class="category__rtp" id="RTP_Value"> {{ game.rtp | hgPercent }}</span>
      </button>
    </ng-container>
  </div>
</div>
