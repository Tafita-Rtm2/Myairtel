  4.796c.11.203.31.341.539.373l5.668.769c.611.083.846.844.387 1.256l-4.009 3.602c-.187.168-.274.422-.228.67l.945
  5.132c.107.582-.491 1.04-1.025.784l-5.2-2.49c-.198-.095-.428-.095-.625 0l-5.2
  2.49c-.534.256-1.132-.202-1.025-.784l.945-5.132c.046-.248-.041-.502-.228-.67L2.17
  10.699c-.459-.412-.225-1.173.387-1.256l5.668-.769c.229-.031.429-.169.539-.373l2.599-4.795z"
        fill="#000"
        fill-opacity=".5"
