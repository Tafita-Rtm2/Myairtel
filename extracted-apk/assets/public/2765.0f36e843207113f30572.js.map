<div class="results">
  <ng-container *ngIf="vendors | async as vendors">
    <ng-container *ngIf="vendors?.length > 0">
      <span class="results__title">{{ 'INSTANT_GAMES.PROVIDERS' | i18n }}</span>
      <div class="results__list results__list--vendors">
        <ng-container *ngIf="providersCategoryId$ | async as providerId">
          <a
            *ngFor="let vendor of vendors; trackBy: trackBy"
            (click)="vendorClicked(vendor.name)"
            [routerLink]="['/', instantGamesBetCategoryPath, 'category', providerId, vendor.name]"
          >
            <div class="vendor">
              <img class="vendor__img" [src]="vendor.imageUrl | hgToSecureUrl" loading="lazy" [alt]="vendor.name" />
              <span>
                {{ vendor.gameCount }}
              </span>
            </div>
          </a>
        </ng-container>
      </div>
    </ng-container>

    <ng-container *ngIf="(games | async)?.length > 0">
      <span class="results__title">{{ 'INSTANT_GAMES.GAMES' | i18n }}</span>
      <div class="results__list">
        <a
          *ngFor="let game of games | async; let last = last; trackBy: trackBy"
          (click)="gameClicked(game.name)"
          [routerLink]="[game.computedUrl]"
        >
          <hg-favorite [isFavorite]="game.isFavorite" (favoriteToggled)="toggleFavorite(game, $event)"></hg-favorite>
          <hg-game-tile [instantGame]="game"></hg-game-tile>
        </a>
      </div>
    </ng-container>
    <div class="results__empty" *ngIf="(games | async)?.length === 0 && vendors?.length === 0">
      <img src="/assets/instantgame_no-results.svg" [alt]="'SEARCH.NO_INSTANTGAME_RESULTS_FOUND' | i18n" />
      <span>{{ 'SEARCH.NO_INSTANTGAME_RESULTS_FOUND' | i18n }}</span>
      <span>{{ 'SEARCH.NO_INSTANTGAME_RESULTS_FOUND_SUBTEXT' | i18n }}</span>
    </div>
  </ng-container>
</div>
