<ng-container *ngIf="isLoading$ | async; else categoriesLoaded">
  <hg-loader></hg-loader>
</ng-container>
<ng-template #categoriesLoaded>
  <ng-container *ngIf="categories$ | async as categories; else loading">
    <ng-container *ngFor="let category of categories; trackBy: trackBy">
      <ng-container [ngSwitch]="category.type">
        <!-- CLASSIC -->
        <hg-instant-game-standard-category
          *ngSwitchCase="InstantGameCategoryType.Classic"
          [category]="category"
          [id]="'Category_' + category.type"
        ></hg-instant-game-standard-category>

        <!-- FAVORITES -->
        <ng-container *ngSwitchCase="InstantGameCategoryType.Favorites">
          <hg-instant-game-standard-category
            *ngIf="category.instantGames?.length"
            [category]="category"
            [id]="'Category_' + category.type"
          ></hg-instant-game-standard-category>
        </ng-container>

        <!-- MOST LIKED -->
        <hg-instant-game-standard-category
          *ngSwitchCase="InstantGameCategoryType.MostLiked"
          [category]="category"
          [id]="'Category_' + category.type"
        ></hg-instant-game-standard-category>

        <!-- TOP 10 -->
        <hg-instant-game-standard-category
          *ngSwitchCase="InstantGameCategoryType.Top10"
          [category]="category"
          [id]="'Category_' + category.type"
        ></hg-instant-game-standard-category>

        <!-- RECENTLY PLAYED -->
        <ng-container *ngSwitchCase="InstantGameCategoryType.RecentlyPlayed">
          <hg-instant-game-standard-category
            *ngIf="isUserConnected && category.instantGames?.length"
            [category]="category"
            [id]="'Category_' + category.type"
          ></hg-instant-game-standard-category>
        </ng-container>

        <!-- PROVIDERS -->
        <hg-instant-game-vendors-category
          *ngSwitchCase="InstantGameCategoryType.Providers"
          [category]="category"
          id="Category_Providers"
        ></hg-instant-game-vendors-category>

        <!-- BIG WINNERS -->
        <ng-container *ngSwitchCase="InstantGameCategoryType.BigWinners">
          <ng-container *ngIf="bigWinners$ | async as bigWinners">
            <hg-instant-game-big-winners-category
              *ngIf="bigWinners?.length"
              [category]="category"
              [bigWinners]="bigWinners"
              id="Category_BigWinners"
            ></hg-instant-game-big-winners-category>
          </ng-container>
        </ng-container>

        <!-- HIGHLIGHTS -->
        <hg-instant-game-highlights-category
          *ngSwitchCase="InstantGameCategoryType.Highlights"
          [category]="category"
          id="Category_Highlight"
        ></hg-instant-game-highlights-category>

        <!-- HIGHLIGHT PROVIDER -->
        <hg-instant-game-highlights-category
          *ngSwitchCase="InstantGameCategoryType.HighlightProvider"
          [category]="category"
          id="Category_HighlightProvider"
        ></hg-instant-game-highlights-category>

        <!-- GAME OF THE WEEK -->
        <hg-instant-game-game-of-the-week-category
          *ngSwitchCase="InstantGameCategoryType.GameOfTheWeek"
          [category]="category"
          id="Category_GameOfTheWeek"
        ></hg-instant-game-game-of-the-week-category>

        <!-- ANIMATED -->
        <ng-container *ngSwitchCase="InstantGameCategoryType.Animated">
          <hg-instant-game-animated-category
            *ngIf="category.instantGames?.length === 10"
            [category]="category"
            id="Category_Animated"
          ></hg-instant-game-animated-category>
        </ng-container>

        <!-- HOT / COLD -->
        <hg-instant-game-hot-cold-category
          *ngSwitchCase="InstantGameCategoryType.HotGames"
          [category]="category"
          id="Category_HotGames"
        ></hg-instant-game-hot-cold-category>

        <hg-instant-game-hot-cold-category
          *ngSwitchCase="InstantGameCategoryType.ColdGames"
          [category]="category"
          id="Category_ColdGames"
        ></hg-instant-game-hot-cold-category>

        <!-- WINNERS STREAM -->
        <ng-container *ngSwitchCase="InstantGameCategoryType.WinnersStream">
          <ng-container *ngIf="winnersStream$ | async as winnersStream">
            <hg-instant-game-winners-stream-category
              *ngIf="winnersStream?.length"
              [category]="category"
              [winnersStream]="winnersStream"
              id="Category_WinnersStream"
            ></hg-instant-game-winners-stream-category>
          </ng-container>
        </ng-container>

        <!-- TOURNAMENTS -->
        <hg-category-tournaments
          *ngSwitchCase="InstantGameCategoryType.Tournaments"
          [category]="category"
          id="Category_Tournaments"
        ></hg-category-tournaments>
      </ng-container>
    </ng-container>
  </ng-container>
</ng-template>
<ng-template #loading>
  <div class="categories-skeleton"></div>
</ng-template>
