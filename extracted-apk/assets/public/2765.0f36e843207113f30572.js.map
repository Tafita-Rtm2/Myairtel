<hg-loader *ngIf="loading"></hg-loader>
<div class="similar-games">
  <span class="similar-games-title">{{ 'INSTANT-GAMES.SIMILAR-GAMES' | i18n | uppercase }}</span>
  <div *ngIf="games?.length !== 0" class="similar-games-container games-container">
    <a
      *ngFor="let game of games; trackBy: trackBy"
      (click)="gameClicked(game.name)"
      [routerLink]="[game.computedUrl]"
      [queryParams]="{ categoryId: categoryId }"
      class="game"
    >
      <hg-game-tile [instantGame]="game"></hg-game-tile>
    </a>
  </div>
  <a (click)="goToInstantGamesHome()" class="similar-games-home-btn">
    <i class="hg-casino"></i>
    <span>{{ 'INSTANT-GAMES.HOME' | i18n }}</span>
  </a>
</div>
