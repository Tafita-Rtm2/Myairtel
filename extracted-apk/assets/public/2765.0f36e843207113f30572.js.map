<hg-loader *ngIf="loading"></hg-loader>

<div class="bg-game">
  <div *ngIf="showSwitchMode" class="demo-mode">
    {{ 'INSTANT-GAMES.DEMO_MESSAGE' | i18n }}
    <button type="button" class="switch-mode" (click)="switchMode()">
      {{ 'INSTANT-GAMES.ROULETTE.PLAY_FOR_REAL' | i18n }}
    </button>
  </div>
  <hg-instant-games-in-game-tournament-banner
    #tournamentBanner
    [gameId]="game?.id"
  ></hg-instant-games-in-game-tournament-banner>
  <div class="game">
    <iframe
      hgIframeRedirectionObserver
      [hgIframeRedirectionArmed]="isGameLoaded"
      #gameIFrame
      [style.opacity]="!isGameReady ? 0 : 1"
      src="about:blank"
      [style.width]="width ? width + 'px' : '100%'"
      [style.height]="height ? height + 'px' : '100%'"
      (load)="gameUrl ? iFrameLoaded() : null"
    >
    </iframe>
    <div *hgMediaIf="'md'" class="game__scroll__area">
      <div class="game__scroll__button" *ngIf="isScrollVisible && !loading && isGameReady">
        <button type="button" (click)="scrollToBottom()">
          <i class="hg-arrow-back-to-top"></i>
        </button>
      </div>
    </div>

    <div
      class="connection-needed"
      *ngIf="((!loading && !isGameReady) || (!funModeAvailable && !loggedIn)) && liveGameImage"
    >
      <img class="game-img" [src]="liveGameImage | hgToSecureUrl" alt="Game" />
      <span>{{ 'INSTANT-GAMES.CONNECTION_NEEDED' | i18n }}</span>
    </div>
  </div>

  <hg-similar-games *ngIf="game && isGameReady" provider="BoomingGames" [gameId]="game?.id"></hg-similar-games>
</div>
