<div
  class="category"
  [ngClass]="{
    'category__gradient--left': arrowLeftVisible,
    'category__gradient--right': arrowRightVisible
  }"
>
  <div class="category__title">
    <hg-inline-svg *ngIf="category.iconUrl" [src]="category.iconUrl" id="Icon"> </hg-inline-svg>
    <span id="Title">{{ category.name }}</span>
    <button class="category__title-button" (click)="onCategoryClick(category)" id="ProvidersNumber">
      {{ category.data.length }}
      <i class="hg-arrow-right"></i>
    </button>
  </div>

  <hg-arrows-slide
    *hgMediaIfNot="'md'"
    [showLeftArrow]="arrowLeftVisible"
    [showRightArrow]="arrowRightVisible"
    (previous)="onPreviousPosition()"
    (next)="onNextPosition()"
  ></hg-arrows-slide>

  <div
    class="category__games"
    #categoryGames
    (touchmove)="swipe()"
    (mousedown)="startDragging($event, categoryGames)"
    (mouseup)="stopDragging($event)"
    (mouseleave)="stopDragging($event)"
    (mousemove)="moveEvent($event, categoryGames)"
    id="Category_Games"
  >
    <button *ngFor="let vendor of category.vendors; trackBy: trackBy" (click)="onVendorClick(category.id, vendor.name)">
      <div class="vendor-container" id="VendorContainer">
        <img
          [class]="'vendor ' + vendor.name"
          [src]="vendor.imageUrl | hgToSecureUrl"
          loading="lazy"
          [alt]="vendor.name"
        />
        <span id="GamesCount">
          {{ vendor.gameCount }}
        </span>
      </div>
    </button>
  </div>
</div>
