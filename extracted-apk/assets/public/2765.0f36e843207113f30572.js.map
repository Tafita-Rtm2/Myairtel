<div
  class="category"
  [ngClass]="{
    'category__gradient--left': arrowLeftVisible,
    'category__gradient--right': arrowRightVisible
  }"
>
  <hg-arrows-slide
    *hgMediaIfNot="'md'"
    [class.with-counter]="category.withCounter"
    [showLeftArrow]="arrowLeftVisible"
    [showRightArrow]="arrowRightVisible"
    (previous)="onPreviousPosition()"
    (next)="onNextPosition()"
  ></hg-arrows-slide>
  <div
    class="category__tournaments"
    [ngClass]="{
      'category__tournaments--mini': category.miniMode
    }"
    #categoryGames
    (touchmove)="swipe()"
    (mousedown)="startDragging($event, categoryGames)"
    (mouseup)="stopDragging($event)"
    (mouseleave)="stopDragging($event)"
    (mousemove)="moveEvent($event, categoryGames)"
  >
    <div class="card-wrapper" *ngFor="let tournament of category.data">
      <hg-instant-games-tournament-card
        [tournament]="tournament"
        [miniMode]="category.miniMode"
        [desktopMode]="(media$ | async) >= Media.lg"
        [alone]="category.data.length === 1"
        [mouseMove]="mouseMove"
      ></hg-instant-games-tournament-card>
    </div>
  </div>
</div>
