<div class="history-board" *ngIf="rouletteHistory.length > 0">
  <span class="history-title">{{ 'INSTANT-GAMES.ROULETTE.LAST_RESULTS' | i18n }}</span>
  <div class="history">
    <div class="history-item" *ngFor="let item of rouletteHistory">
      <span class="result" [style.background]="colors[item.color]" [style.border-color]="borderColors[item.color]">{{
        item.result
      }}</span>
      <div class="balance-change">
        <svg *ngIf="item.paidAmount >= 0" class="arrow">
          <use [attr.href]="'assets/instant-games/casinoSprite.svg#arrow_win'"></use>
        </svg>
        <svg *ngIf="item.paidAmount < 0" class="arrow">
          <use [attr.href]="'assets/instant-games/casinoSprite.svg#arrow_loss'"></use>
        </svg>
        <span [ngClass]="item.paidAmount >= 0 ? 'gainWin' : 'gainLoss'">{{
          item.paidAmount >= 0 ? '+' + item.paidAmount : item.paidAmount
        }}</span>
      </div>
    </div>
  </div>
</div>
