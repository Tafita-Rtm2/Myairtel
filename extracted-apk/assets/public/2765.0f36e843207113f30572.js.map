<hg-three-columns-layout centerMaxWidth="1280px" rightWidth="150px">
  <ng-container left>
    <hg-instant-games-menu *hgMediaIfNot="'md'; ssr: true"></hg-instant-games-menu>
  </ng-container>

  <ng-container center>
    <div *ngIf="!isServer; else placeholder" class="router-wrapper">
      <router-outlet></router-outlet>
    </div>

    <ng-template #placeholder>
      <div class="placeholder">
        <hg-loader></hg-loader>
      </div>
    </ng-template>
  </ng-container>
</hg-three-columns-layout>
