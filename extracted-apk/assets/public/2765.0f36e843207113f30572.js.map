<ng-container *ngIf="gamesViewModel$ | async as vm">
  <div class="page">
    <h1 class="page__title">{{ vm.name }}</h1>
    <div class="games__grid">
      <a *ngFor="let game of vm.games; trackBy: trackByGame" [routerLink]="[game.computedUrl]">
        <hg-favorite [isFavorite]="game.isFavorite" (favoriteToggled)="toggleFavorite(game, $event)"></hg-favorite>
        <hg-game-tile [instantGame]="game"></hg-game-tile>
      </a>
    </div>
  </div>
</ng-container>
