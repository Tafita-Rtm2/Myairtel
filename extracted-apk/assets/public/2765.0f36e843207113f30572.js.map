<!-- BANNER -->
<div class="banners">
  <hg-anchor anchor="banner-casino"></hg-anchor>
</div>
<div class="games">
  <ng-container *ngIf="isOnAll$ | async as isOnAll">
    <div class="games__content" [class.games__content--all]="isOnAll">
      <!-- shortcuts -->
      <ng-container *ngIf="isHomePage">
        <hg-shortcuts
          *hgMediaIf="'md'"
          class="{{ elementsOrder ? 'order--' + elementsOrder.indexOf('shortcuts') : '' }}"
        ></hg-shortcuts>
      </ng-container>

      <ng-container *hgMediaIf="'md'">
        <hg-instant-games-mobile-header [displayBetCategoryNameOnMobile]="displayBetCategoryNameOnMobile">
        </hg-instant-games-mobile-header>
      </ng-container>
      <div class="games__list">
        <ng-container *hgMediaIfNot="'md'">
          <div class="search-container">
            <form (submit)="$event.preventDefault(); filterGames()">
              <span class="input-with-icon">
                <input
                  name="search"
                  type="text"
                  placeholder="{{ 'SEARCH.SEARCH' | i18n }}"
                  [(ngModel)]="searchText"
                  autocomplete="off"
                  id="Casino_SearchBar"
                />
                <button>
                  <i class="hg-search"></i>
                </button>
              </span>
            </form>
          </div>
        </ng-container>

        <ng-container *ngIf="!searchGame; else searchGamesResults">
          <hg-instant-game-categories></hg-instant-game-categories>
        </ng-container>
        <ng-template #searchGamesResults>
          <hg-search-games-results
            [searchText]="searchText"
            [games]="filteredGames$"
            [vendors]="filteredVendors$"
            (favoriteToggled)="onFavoriteToggled($event)"
          ></hg-search-games-results>
        </ng-template>
      </div>
    </div>
  </ng-container>
</div>
