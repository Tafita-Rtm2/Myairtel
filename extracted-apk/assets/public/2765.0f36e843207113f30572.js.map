<div class="tournaments">
  <div class="header">
    <div class="header__title">
      <i class="hg-tournament"></i>
      <h1>{{ 'INSTANT-GAMES.TOURNAMENTS' | i18n }}</h1>
    </div>

    <div class="header__menu" #menu>
      <button
        *ngFor="let filter of filters"
        [class.active]="filter === (activeFilter$ | async)"
        (click)="onFilterChange(filter)"
      >
        {{ 'GENERIC.STATE.' + (filter | uppercase) | i18n }}
      </button>
    </div>
  </div>

  <ng-container *ngIf="loading$ | async">
    <hg-loader></hg-loader>
  </ng-container>

  <section>
    <hg-instant-games-tournament-card
      *ngFor="let tournament of tournaments$ | async"
      [tournament]="tournament"
    ></hg-instant-games-tournament-card>
  </section>
</div>
