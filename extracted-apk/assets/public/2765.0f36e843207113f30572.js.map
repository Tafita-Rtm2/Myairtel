<div class="category">
  <ng-container *ngIf="sortedCategories$ | async as categories">
    <div class="item" [class.is-open-all]="isOnAll$ | async" (click)="onCategoryClick()" id="Category_All">
      <i class="hg-home-2"></i>
      <span [attr.title]="'INSTANT-GAMES.ALL' | i18n">{{ 'INSTANT-GAMES.ALL' | i18n }}</span>
      <i class="hg-full-right-arrow"></i>
    </div>
    <ng-container *ngFor="let category of categories; let i = index; trackBy: trackByCategory">
      <ng-container
        *ngIf="
          category.type === InstantGameCategoryType.Classic ||
          category.type === InstantGameCategoryType.Favorites ||
          category.type === InstantGameCategoryType.Tournaments ||
          category.type === InstantGameCategoryType.MostLiked ||
          (category.type === InstantGameCategoryType.RecentlyPlayed &&
            isUserConnected &&
            category.instantGames?.length > 0)
        "
      >
        <div
          class="item"
          (click)="onCategoryClick(category)"
          [class.is-open-cat]="
            (categoryId$ | async) === category.id.toString() ||
            (category.type === InstantGameCategoryType.Tournaments && (isTournamentRoute$ | async))
          "
          [id]="'Category_' + category.name"
        >
          <hg-inline-svg [src]="category.iconUrl"></hg-inline-svg>
          <i *ngIf="category.hasNew" class="has-new">NEW</i>
          <span [title]="category.name">{{ category.name }}</span>
          <i class="hg-full-right-arrow"></i>
        </div>
      </ng-container>
    </ng-container>
  </ng-container>
</div>
