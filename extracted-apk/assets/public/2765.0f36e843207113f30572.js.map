<div
  class="slide-container"
  id="Slide_Container"
  (touchstart)="swipe($event, 'start')"
  (touchend)="swipe($event, 'end')"
  (touchmove)="swipe($event, 'move')"
>
  <div
    class="slide"
    *ngFor="let game of games; let i = index; trackBy: trackByGame"
    [ngClass]="{
      active: currentIndex === i
    }"
    #slideElements
  >
    <a carouselZoomItem [class.is-new]="game.isNew" (click)="redirect(game.computedUrl)">
      <div class="game-container" [class.is-new]="game.isNew">
        <hg-favorite [isFavorite]="game.isFavorite" (favoriteToggled)="onToggleFavorited(game, $event)"></hg-favorite>

        <img
          [class]="'game ' + game.name"
          [src]="game.imageUrl | hgToSecureUrl"
          [alt]="game.name"
          loading="lazy"
          class="game-container"
        />
      </div>
    </a>
  </div>
</div>
