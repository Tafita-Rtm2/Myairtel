<div
  class="category"
  [ngClass]="{
    'category__gradient--left': arrowLeftVisible,
    'category__gradient--right': arrowRightVisible
  }"
  [class.with-counter]="category.withCounter"
  [class.highlight-horizontal-scroller]="category.hasHighlighted"
>
  <div class="category__title">
    <hg-inline-svg *ngIf="category.iconUrl" [src]="category.iconUrl" id="Icon"> </hg-inline-svg>
    <span id="Title">{{ category.name }}</span>
    <button
      *ngIf="category.type !== InstantGameCategoryType.Top10"
      class="category__title-button"
      (click)="onCategoryClick(category)"
      id="InstantGamesNumber"
    >
      {{ category.instantGamesNumber }}
      <i class="hg-arrow-right"></i>
    </button>
  </div>

  <hg-arrows-slide
    *hgMediaIfNot="'md'"
    [class.with-counter]="category.withCounter"
    [showLeftArrow]="arrowLeftVisible"
    [showRightArrow]="arrowRightVisible"
    (previous)="onPreviousPosition()"
    (next)="onNextPosition()"
  ></hg-arrows-slide>

  <div
    class="category__games"
    [ngClass]="{
      'category__games--highlight': category.hasHighlighted,
      'category__games--with-counter': category.withCounter,
      'category__games--mini': category.miniMode && !category.hasHighlighted && category.instantGames.length > 7
    }"
    #categoryGames
    (touchmove)="swipe()"
    (mousedown)="startDragging($event, categoryGames)"
    (mouseup)="stopDragging($event)"
    (mouseleave)="stopDragging($event)"
    (mousemove)="moveEvent($event, categoryGames)"
    id="Category_Games"
  >
    <ng-container *ngFor="let game of category.instantGames; let i = index; trackBy: trackBy">
      <button
        [attr.id]="category.type === InstantGameCategoryType.Top10 ? 'GameDisplay' : null"
        class="category__game"
        [class.category__game--highlight]="game.highlighted && category.type !== InstantGameCategoryType.Favorites"
        [class.category__game--top-ten]="category.type === InstantGameCategoryType.Top10"
        [class.category__game--top-ten-first]="category.type === InstantGameCategoryType.Top10 && i === 0"
        (click)="redirect(game.computedUrl, game.name, category, i + 1)"
      >
        <img
          id="TopTenNumber"
          *ngIf="category.type === InstantGameCategoryType.Top10"
          [src]="'assets/instant-games/top10/' + (i + 1) + '.svg'"
          [alt]="'Top ' + (i + 1) + ' position'"
        />

        <hg-favorite
          [isFavorite]="game.isFavorite"
          (favoriteToggled)="toggleFavorited(game, $event, category.type)"
        ></hg-favorite>
        <hg-game-tile (click)="$event.preventDefault()" [instantGame]="game" class="game-container"></hg-game-tile>

        <hg-players-count [value]="game.customersInPlay" *ngIf="category.withCounter"></hg-players-count>
        <hg-player-favorite-counter
          *ngIf="category.type === InstantGameCategoryType.MostLiked"
          [iconUrl]="category.iconUrl"
          [value]="game.favoriteCount"
        ></hg-player-favorite-counter>
      </button>
    </ng-container>
  </div>
</div>
