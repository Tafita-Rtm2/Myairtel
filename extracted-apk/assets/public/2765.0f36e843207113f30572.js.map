<!-- highlight -->
<div class="highlights" *ngIf="category.type === InstantGameCategoryType.Highlights">
  <div class="highlights__container">
    <div class="highlights__title">
      <div class="highlights__half">
        <div class="highlights__half--first">{{ topGamesNameFirstHalf }}</div>
        <div class="highlights__half--last">{{ topGamesNameLastHalf }}</div>
      </div>
    </div>
    <div class="highlights__split" *ngIf="(media$ | async) <= Media.md"></div>
    <div class="highlights__list">
      <a
        *ngFor="
          let game of category.instantGames | slice : 0 : ((media$ | async) <= Media.md ? 9 : 12);
          let index = index;
          trackBy: trackBy
        "
        (click)="redirect(game.computedUrl, game.name, category, index + 1)"
        [routerLink]="[game.computedUrl]"
        [queryParams]="{ categoryId: category.id }"
      >
        <hg-favorite [isFavorite]="game.isFavorite" (favoriteToggled)="toggleFavorited(game, $event)"></hg-favorite>
        <hg-game-tile [instantGame]="game"></hg-game-tile>
        <hg-players-count *ngIf="category.withCounter" [value]="game.customersInPlay"></hg-players-count>
      </a>
    </div>
  </div>
  <div class="highlights__button" *ngIf="category.instantGames?.length > 9">
    <button (click)="onCategoryClick(category, 'title')" id="SeeMore_Button">
      {{ 'GENERIC.SEE.MORE' | i18n }} <i class="hg-full-right-arrow"></i>
    </button>
  </div>
</div>

<!-- highlight-provider -->
<div class="highlightsp" *ngIf="category.type === InstantGameCategoryType.HighlightProvider">
  <div class="highlightsp__title">
    <div class="vendor-logo" id="Vendor_Logo">
      <img
        [class]="'vendor ' + category.vendor"
        [src]="category.vendor?.imageUrl | hgToSecureUrl"
        loading="lazy"
        [alt]="category.vendor?.name"
      />
    </div>
  </div>
  <div class="highlightsp__split"></div>
  <div class="highlightsp__list">
    <a
      *ngFor="
        let game of category.instantGames
          | slice : 0 : ((media$ | async) <= Media.md ? 9 : category.instantGames?.length);
        let index = index;
        trackBy: trackBy
      "
      [routerLink]="[game.computedUrl]"
      [queryParams]="{ categoryId: category.id }"
    >
      <hg-favorite [isFavorite]="game.isFavorite" (favoriteToggled)="toggleFavorited(game, $event)"></hg-favorite>
      <hg-game-tile [instantGame]="game"></hg-game-tile>
    </a>
  </div>
  <div class="highlightsp__button">
    <button (click)="onVendorClick(providersCategoryId, category.vendor?.name)" id="SeeMore_Button">
      {{ 'GENERIC.SEE.MORE' | i18n }} <i class="hg-full-right-arrow"></i>
    </button>
  </div>
</div>
