<div class="category">
  <div class="category__title" id="Title">{{ category.name }}</div>
  <a class="category__animated" (click)="redirectAnimated(category)">
    <img [src]="category.data | hgToSecureUrl" [alt]="category.name" class="category__animated-background" />
    <div class="category__animated-shadow"></div>
    <div class="category__animated-wrapper" id="GifWrapper">
      <img [src]="category.data | hgToSecureUrl" [alt]="category.name" class="gif" />
    </div>
  </a>
  <div class="category__games-container" id="Category_Games">
    <ng-container *ngFor="let game of category.instantGames; let i = index; trackBy: trackBy">
      <a
        *ngIf="!game.highlighted"
        [class.is-new]="game.isNew"
        class="category__game"
        (click)="redirect(game.computedUrl, game.name, category, i + 1)"
      >
        <hg-favorite [isFavorite]="game.isFavorite" (favoriteToggled)="toggleFavorited(game, $event)"></hg-favorite>
        <hg-game-tile [instantGame]="game"></hg-game-tile>
      </a>
    </ng-container>
  </div>
</div>
