<div class="betting-shop-container">
  <hg-raw-template *ngIf="content" [html]="content.content" [css]="content.style"></hg-raw-template>
  <hg-loader *ngIf="isLoading"></hg-loader>
  <ng-container *ngIf="!isLoading && !content">
    <div class="images" hgImageColoredHandler>
      <div>
        <img src="assets/banners/header-01.svg" alt="{{ 'BETTINGSHOP.DEPOSIT.TEXT.1' | i18n }}" />
        <span>{{ 'BETTINGSHOP.DEPOSIT.TEXT.1' | i18n }}</span>
      </div>
      <div>
        <img src="assets/banners/header-02.svg" alt="{{ 'BETTINGSHOP.DEPOSIT.TEXT.2' | i18n }}" />
        <span>{{ 'BETTINGSHOP.DEPOSIT.TEXT.2' | i18n }}</span>
      </div>
      <div>
        <img src="assets/banners/header-03.svg" alt="{{ 'BETTINGSHOP.DEPOSIT.TEXT.3' | i18n }}" />
        <span>{{ 'BETTINGSHOP.DEPOSIT.TEXT.3' | i18n }}</span>
      </div>
    </div>

    <router-outlet *ngIf="!isPopin"></router-outlet>
  </ng-container>
</div>
